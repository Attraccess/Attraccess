name: Create Release

on:
  workflow_dispatch:
    inputs:
      specifier:
        description: 'Version: "major", "minor", "patch", or exact like "2.0.0"'
        required: true
        type: string
      dry-run:
        description: 'Preview changes without creating a release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Nx remote cache — writable only when dispatched on main; a dispatch against
  # any other ref reads but cannot plant artifacts.
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_CACHE_TOKEN_RO && vars.NX_CACHE_URL || '' }}
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.NX_CACHE_TOKEN_RW || secrets.NX_CACHE_TOKEN_RO }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Mint a short-lived GitHub App installation token. The App is added as a
      # bypass actor on the `main` ruleset, so its pushes skip the PR-required
      # and required-signatures rules that block nx release's direct push.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: ./.github/actions/setup

      - name: Resolve App bot user id
        id: bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          user_id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)
          echo "id=$user_id" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.bot-user.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Lint and typecheck publishable libraries
        run: pnpm nx run-many -t lint,typecheck --exclude=tag:scope:hardware

      - name: Build publishable libraries
        run: pnpm nx run-many -t build --exclude=tag:scope:companion,tag:scope:hardware

      - name: Run NX Release (dry run)
        if: inputs.dry-run
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm nx release ${{ inputs.specifier }} --dry-run --yes

      - name: Run NX Release
        if: ${{ !inputs.dry-run }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm nx release ${{ inputs.specifier }} --yes
