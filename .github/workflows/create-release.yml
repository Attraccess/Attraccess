name: Create Release

on:
  workflow_dispatch:
    inputs:
      specifier:
        description: 'Version: "major", "minor", "patch", or exact like "2.0.0"'
        required: true
        type: string
      dry-run:
        description: 'Preview changes without creating a release'
        required: false
        type: boolean
        default: false
      publish-only:
        description: 'Only publish the libraries of an existing release; specifier must be its exact version'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  # npm trusted publishing (OIDC) — no long-lived npm token.
  id-token: write

# One release at a time: each run pushes a release commit and tag, and an older run publishing last would move
# the npm dist-tag back to its version.
concurrency:
  group: create-release
  cancel-in-progress: false

env:
  # Nx remote cache — writable only when dispatched on main; a dispatch against
  # any other ref reads but cannot plant artifacts.
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_CACHE_TOKEN_RO && vars.NX_CACHE_URL || '' }}
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.NX_CACHE_TOKEN_RW || secrets.NX_CACHE_TOKEN_RO }}
  # Prereleases ("1.11.0-beta.0", "prerelease", "preminor", ...) go to the `next` dist-tag so `latest` stays on the
  # newest stable. Passed to `nx release publish --tag`; setting npm's `tag` config instead also redirects the
  # `npm view` nx runs before publishing, which then fails with E404 for a missing `next`.
  RELEASE_NPM_TAG: ${{ (contains(inputs.specifier, '-') || startsWith(inputs.specifier, 'pre')) && 'next' || 'latest' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Mint a short-lived GitHub App installation token. The App is added as a
      # bypass actor on the `main` ruleset, so its pushes skip the PR-required
      # and required-signatures rules that block nx release's direct push.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ inputs.publish-only && format('refs/tags/v{0}', inputs.specifier) || '' }}

      - uses: ./.github/actions/setup

      - name: Resolve App bot user id
        id: bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          user_id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)
          echo "id=$user_id" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.bot-user.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Lint publishable libraries
        run: |
          exclude="$(node scripts/ci-nx-exclude.mjs lint)"
          echo "Excluding: $exclude"
          pnpm nx run-many -t lint --exclude="$exclude"

      - name: Typecheck publishable libraries
        run: |
          exclude="$(node scripts/ci-nx-exclude.mjs typecheck)"
          echo "Excluding: $exclude"
          pnpm nx run-many -t typecheck --exclude="$exclude"

      - name: Build publishable libraries
        run: |
          exclude="$(node scripts/ci-nx-exclude.mjs build)"
          echo "Excluding: $exclude"
          pnpm nx run-many -t build --exclude="$exclude"

      # nx's version and changelog steps, then commit, tag, push and the GitHub release (scripts/create-release.mjs).
      # A PR merged meanwhile rejects the push; the release commit is then re-created on the new main with the same
      # version and pushed again, so the tag, main, the GitHub release and the packages share one commit.
      # A dry run only previews: it writes no versions, so publishing would re-pack the already released version.
      - name: Create release
        id: release
        if: ${{ !inputs.publish-only }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          SPECIFIER: ${{ inputs.specifier }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: node scripts/create-release.mjs

      # nx release publish packs dist/ as it is; rebuild so the packages carry the version just written.
      - name: Rebuild publishable libraries with the release version
        if: ${{ !inputs.dry-run && !inputs.publish-only }}
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo "HEAD is not the pushed release commit $RELEASE_SHA" >&2
            exit 1
          fi
          # After a retry the release sits on a newer main; a PR merged meanwhile may have changed the dependencies.
          if ! git diff --quiet "$GITHUB_SHA" HEAD -- pnpm-lock.yaml; then
            pnpm install --frozen-lockfile
          fi
          exclude="$(node scripts/ci-nx-exclude.mjs build)"
          pnpm nx run-many -t build --exclude="$exclude"

      # A late publish-only run must not move a dist-tag back from a newer release.
      - name: Refuse to move dist-tags backwards
        if: inputs.publish-only
        env:
          SPECIFIER: ${{ inputs.specifier }}
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const semver = require("semver");
            const { SPECIFIER: version, RELEASE_NPM_TAG: tag } = process.env;
            const projects = require("./nx.json").release.projects;
            const ahead = [];
            for (const project of projects) {
              const { root } = JSON.parse(execFileSync("pnpm", ["-s", "nx", "show", "project", project, "--json"]));
              const pkg = require(`./${root}/package.json`);
              if (pkg.private) continue;
              let current = "";
              try {
                current = execFileSync("npm", ["view", pkg.name, `dist-tags.${tag}`], { stdio: ["ignore", "pipe", "ignore"] }).toString().trim();
              } catch {}
              if (current && semver.gt(current, version)) ahead.push(`${pkg.name}@${tag} is ${current}`);
            }
            if (ahead.length) {
              console.error(`Not publishing ${version} to "${tag}": ${ahead.join(", ")}`);
              process.exit(1);
            }
          '

      - name: Publish libraries
        if: ${{ !inputs.dry-run || inputs.publish-only }}
        env:
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: pnpm nx release publish --tag "$RELEASE_NPM_TAG" $DRY_RUN
