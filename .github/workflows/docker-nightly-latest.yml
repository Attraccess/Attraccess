name: Docker Nightly Latest (Main Branch)

on:
  push:
    branches: [main]

env:
  GHCR_IMAGE_NAME: ${{ vars.GHCR_IMAGE_NAME }}
  DOCKERHUB_IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE_NAME }}
  DOCKER_BUILDKIT: 1
  # Nx remote cache — main is the only branch that writes it. Falls back to the
  # read-only token if RW is missing, so a rotation gap degrades to reads.
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_CACHE_TOKEN_RO && vars.NX_CACHE_URL || '' }}
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_CACHE_TOKEN_RW || secrets.NX_CACHE_TOKEN_RO }}

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Lint all projects
        run: pnpm nx run-many --target=lint --parallel=5 --exclude=tag:scope:hardware

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Typecheck all projects
        run: pnpm nx run-many --target=typecheck --parallel=5 --exclude=tag:scope:hardware

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Test all projects
        run: node scripts/ci-test-projects.mjs --group=core

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Build all projects
        env:
          NODE_ENV: production
        run: pnpm nx run-many --target=build --parallel=5 --exclude=tag:scope:hardware,tag:scope:companion,tag:type:plugin

  plugins:
    needs: [lint, typecheck, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - uses: ./.github/actions/setup-browser-tests
      - name: Test and pack all plugins
        run: node scripts/ci-test-projects.mjs --group=plugins
      - name: Test packed Hello World fixture
        run: pnpm --dir examples/plugin-hello-world run pack-test

  # The single publish gate: plugins and the server image publish from the same outcome.
  # A failed or cancelled job blocks; a skipped one (HIL variable off) does not.
  publish-gate:
    needs:
      [
        lint,
        typecheck,
        test,
        build,
        plugins,
        build-companion,
        build-attractap-firmware,
        build-attractap-desktop,
        attractap-lab-hil,
      ]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - run: echo "All build, test and HIL jobs passed or were skipped"

  publish-plugins:
    needs: [publish-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      # Publishes what npm lacks: every plugin whose inputs changed since the commit recorded on its `next`
      # version, including changes merged in earlier runs that failed. Never moves `next` backwards.
      - name: Publish nightly official plugin packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_NIGHTLY: 'true'
        run: node apps/plugins/scripts/plugin-publish-plan.mjs --channel=next

  build-companion:
    uses: ./.github/workflows/build-companion-binaries.yml
    secrets: inherit

  build-attractap-desktop:
    uses: ./.github/workflows/build-attractap-desktop.yml

  attractap-lab-hil:
    # Real reader firmware against the NFC card emulator in the Attractap lab;
    # skipped unless vars.ATTRACTAP_LAB_HIL_ENABLED is 'true'. Publishing jobs
    # need it: a failed or cancelled run blocks them, a skipped one does not.
    uses: ./.github/workflows/attractap-lab-hil.yml
    secrets: inherit

  build-attractap-firmware:
    uses: ./.github/workflows/attractap-firmware.yml
    secrets: inherit

  containerize:
    needs: [publish-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/download-attractap-firmware

      - uses: ./.github/actions/download-companion

      - name: Get short SHA
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: ./.github/actions/docker-build-push
        with:
          tags: |
            ghcr.io/${{ env.GHCR_IMAGE_NAME }}:nightly-${{ steps.vars.outputs.SHORT_SHA }}
            ${{ env.DOCKERHUB_IMAGE_NAME }}:nightly-${{ steps.vars.outputs.SHORT_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      # An older run finishing late must not move nightly-latest backwards; its nightly-<sha7> image stays.
      - name: Move nightly-latest unless a newer commit already owns it
        run: node scripts/promote-nightly-image.mjs
