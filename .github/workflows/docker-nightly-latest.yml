name: Docker Nightly Latest (Main Branch)

# Once a night instead of on every push: one full run needs both lab readers for
# about an hour, and merges come faster than that. Pushes to main keep the Nx
# cache warm through main-nx-cache.yml. Run it by hand (on main) to publish sooner.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  GHCR_IMAGE_NAME: ${{ vars.GHCR_IMAGE_NAME }}
  DOCKERHUB_IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE_NAME }}
  DOCKER_BUILDKIT: 1
  # Nx remote cache — main is the only branch that writes it. Falls back to the
  # read-only token if RW is missing, so a rotation gap degrades to reads.
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_CACHE_TOKEN_RO && vars.NX_CACHE_URL || '' }}
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && (secrets.NX_CACHE_TOKEN_RW || secrets.NX_CACHE_TOKEN_RO) || secrets.NX_CACHE_TOKEN_RO }}

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  # Decides whether this run tests on the readers and publishes. A scheduled run
  # on a commit that already passed has nothing new, so it leaves the readers
  # free; a commit whose last run failed is tried again. Manual runs always go.
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Compare with the last green nightly
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::The nightly publishes from main only; dispatch it on main"
            exit 1
          fi
          changed=true
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            last="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow docker-nightly-latest.yml \
              --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')"
            if [ "$last" = "$GITHUB_SHA" ]; then
              changed=false
              echo "::notice::$GITHUB_SHA already passed a nightly; skipping the lab readers and publishing"
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Lint all projects
        run: |
          exclude="$(node scripts/ci-nx-exclude.mjs lint)"
          echo "Excluding: $exclude"
          pnpm nx run-many --target=lint --parallel=5 --exclude="$exclude"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Typecheck all projects
        run: |
          exclude="$(node scripts/ci-nx-exclude.mjs typecheck)"
          echo "Excluding: $exclude"
          pnpm nx run-many --target=typecheck --parallel=5 --exclude="$exclude"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: attraccess
          POSTGRES_PASSWORD: attraccess
          POSTGRES_DB: attraccess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U attraccess -d attraccess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_TYPE: postgres
      DATABASE_URL: postgres://attraccess:attraccess@127.0.0.1:5432/attraccess
      # Admin connection the tests create one database per test from.
      TEST_DATABASE_URL: postgres://attraccess:attraccess@127.0.0.1:5432/postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Test all projects
        run: node scripts/ci-test-projects.mjs --group=core

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Build all projects
        env:
          NODE_ENV: production
        run: |
          exclude="$(node scripts/ci-nx-exclude.mjs build)"
          echo "Excluding: $exclude"
          pnpm nx run-many --target=build --parallel=5 --exclude="$exclude"

  plugins:
    needs: [lint, typecheck, test, build]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: attraccess
          POSTGRES_PASSWORD: attraccess
          POSTGRES_DB: attraccess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U attraccess -d attraccess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_TYPE: postgres
      DATABASE_URL: postgres://attraccess:attraccess@127.0.0.1:5432/attraccess
      # Admin connection the tests create one database per test from.
      TEST_DATABASE_URL: postgres://attraccess:attraccess@127.0.0.1:5432/postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - uses: ./.github/actions/setup-browser-tests
      - name: Test and pack all plugins
        run: node scripts/ci-test-projects.mjs --group=plugins
      - name: Test packed Hello World fixture
        run: pnpm --dir examples/plugin-hello-world run pack-test

  # The single publish gate: plugins and the server image publish from the same outcome.
  # A failed or cancelled job blocks; a skipped one (HIL variable off) does not.
  # Nothing publishes when `changes` found the commit already published.
  publish-gate:
    needs: [changes, lint, typecheck, test, build, plugins, build-companion, build-attractap-firmware, attractap-lab-hil]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "All build, test and HIL jobs passed or were skipped"

  publish-plugins:
    needs: [publish-gate]
    # Without an explicit condition a skipped job further up (HIL variable off) would skip this job too.
    if: ${{ !cancelled() && needs.publish-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      # Build in its own step; the publish step then reuses the local Nx cache.
      - name: Build official plugin packages
        run: pnpm nx run-many --target=build --projects=tag:type:plugin,plugins-backend-sdk
      # Publishes what npm lacks: every plugin whose inputs changed since the commit recorded on its `next`
      # version, including changes merged in earlier runs that failed. Never moves `next` backwards.
      - name: Publish nightly official plugin packages
        run: node apps/plugins/scripts/plugin-publish-plan.mjs --channel=next

  build-companion:
    uses: ./.github/workflows/build-companion-binaries.yml
    secrets: inherit

  attractap-lab-hil:
    # Real reader firmware against the NFC card emulator in the Attractap lab;
    # skipped unless vars.ATTRACTAP_LAB_HIL_ENABLED is 'true'. Publishing jobs
    # need it: a failed or cancelled run blocks them, a skipped one does not.
    needs: [changes]
    if: needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/attractap-lab-hil.yml
    secrets: inherit

  build-attractap-firmware:
    uses: ./.github/workflows/attractap-firmware.yml
    secrets: inherit

  containerize:
    needs: [publish-gate]
    # Same condition as publish-plugins, so both publish or both skip.
    if: ${{ !cancelled() && needs.publish-gate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/download-attractap-firmware

      - uses: ./.github/actions/download-companion

      - name: Get short SHA
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: image
        uses: ./.github/actions/docker-build-push
        with:
          tags: |
            ghcr.io/${{ env.GHCR_IMAGE_NAME }}:nightly-${{ steps.vars.outputs.SHORT_SHA }}
            ${{ env.DOCKERHUB_IMAGE_NAME }}:nightly-${{ steps.vars.outputs.SHORT_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      # An older run finishing late must not move nightly-latest backwards; its nightly-<sha7> image stays.
      - name: Move nightly-latest unless a newer commit already owns it
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: node scripts/promote-nightly-image.mjs
