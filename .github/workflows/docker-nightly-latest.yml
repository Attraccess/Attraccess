name: Docker Nightly Latest (Main Branch)

on:
  push:
    branches: [main]

env:
  GHCR_IMAGE_NAME: ${{ vars.GHCR_IMAGE_NAME }}
  DOCKERHUB_IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE_NAME }}
  DOCKER_BUILDKIT: 1

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Lint all projects
        run: pnpm nx run-many --target=lint --parallel=5 --exclude=tag:scope:hardware

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Typecheck all projects
        run: pnpm nx run-many --target=typecheck --parallel=5 --exclude=tag:scope:hardware

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Test all projects
        run: pnpm nx run-many --target=test,e2e --parallel=5 --exclude=tag:scope:hardware

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Build all projects
        env:
          NODE_ENV: production
        run: pnpm nx run-many --target=build --parallel=5 --exclude=tag:scope:hardware,tag:scope:companion

  build-companion-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Install Linux packaging dependencies
        run: sudo apt-get install -y fakeroot rpm
      - name: Build Linux companion (x64 + arm64)
        run: pnpm nx run companion:build
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: companion-linux-${{ github.run_id }}
          path: |
            apps/companion/dist/companion_linux_x86_64.AppImage
            apps/companion/dist/companion_linux_arm64.AppImage
          if-no-files-found: warn

  build-companion-macos:
    runs-on: macos-latest
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Set up macOS code signing
        if: ${{ env.HAS_APPLE_CERT == 'true' }}
        uses: ./.github/actions/macos-codesign-setup
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Build macOS companion (universal)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.APPLE_CERTIFICATE != '' && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm nx run companion:build
      - name: Clean up keychain
        if: ${{ env.HAS_APPLE_CERT == 'true' && always() }}
        run: '[ -n "$KEYCHAIN_PATH" ] && security delete-keychain "$KEYCHAIN_PATH" || true'
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: companion-macos-${{ github.run_id }}
          path: apps/companion/dist/companion_mac_universal.dmg
          if-no-files-found: warn

  build-companion-windows:
    runs-on: windows-latest
    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Set up Windows code signing
        if: ${{ env.HAS_WINDOWS_CERT == 'true' }}
        uses: ./.github/actions/windows-codesign-setup
        with:
          cert-base64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          cert-password: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      - name: Build Windows companion (x64)
        shell: bash
        run: pnpm nx run companion:build
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: companion-windows-${{ github.run_id }}
          path: apps/companion/dist/companion_win_x64.exe
          if-no-files-found: warn

  containerize:
    needs: [lint, typecheck, test, build, build-companion-linux, build-companion-macos, build-companion-windows]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Firmware must be built on the runner: the Docker builder has no
      # ESP-IDF, so the in-container build is skipped and the pre-built
      # firmware_output/ from the build context is bundled instead.
      - uses: ./.github/actions/build-attractap-firmware

      - name: Download companion Linux binaries
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: companion-linux-${{ github.run_id }}
          path: apps/companion/dist

      - name: Download companion macOS binary
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: companion-macos-${{ github.run_id }}
          path: apps/companion/dist

      - name: Download companion Windows binary
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: companion-windows-${{ github.run_id }}
          path: apps/companion/dist

      - name: Get short SHA
        id: vars
        run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: ./.github/actions/docker-build-push
        with:
          tags: |
            ghcr.io/${{ env.GHCR_IMAGE_NAME }}:nightly-latest
            ghcr.io/${{ env.GHCR_IMAGE_NAME }}:nightly-${{ steps.vars.outputs.SHORT_SHA }}
            ${{ env.DOCKERHUB_IMAGE_NAME }}:nightly-latest
            ${{ env.DOCKERHUB_IMAGE_NAME }}:nightly-${{ steps.vars.outputs.SHORT_SHA }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
