name: Attractap lab hardware smoke

on:
  workflow_dispatch:
    inputs:
      firmware_run_id:
        description: Successful firmware build run containing the firmware artifact
        type: string
        required: true
      firmware_file:
        description: Merged firmware filename matching the connected reader variant
        type: string
        required: true
      place:
        description: Labgrid place holding that variant (default <firmware variant>-1)
        type: string
        required: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  hardware:
    runs-on: ubuntu-latest
    environment: attractap-lab
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/download-artifact@v4
        with:
          name: attractap-firmware-${{ inputs.firmware_run_id }}
          run-id: ${{ inputs.firmware_run_id }}
          github-token: ${{ github.token }}
          path: firmware
      - name: Select a place holding the firmware's variant
        id: place
        env:
          FIRMWARE_FILE: ${{ inputs.firmware_file }}
          PLACE: ${{ inputs.place }}
        run: |
          # Merged images are <FIRMWARE_NAME>_<FIRMWARE_VARIANT>.bin; places are
          # named after the variant file, <variant>-<n>.
          variant=
          for file in apps/attractap/firmware/variants/*.cmake; do
            name=$(sed -n 's/^set(ATTRACTAP_FIRMWARE_NAME "\(.*\)")$/\1/p' "$file")
            flavor=$(sed -n 's/^set(ATTRACTAP_FIRMWARE_VARIANT "\(.*\)")$/\1/p' "$file")
            if [ "${name}_${flavor}.bin" = "$FIRMWARE_FILE" ]; then
              variant=$(basename "$file" .cmake)
            fi
          done
          if [ -z "$variant" ]; then
            echo "::error::$FIRMWARE_FILE is not the merged image of any firmware variant"
            exit 1
          fi
          place=${PLACE:-$variant-1}
          case "$place" in
            "$variant"-[0-9]*) ;;
            *)
              echo "::error::Place $place does not hold $variant hardware"
              exit 1
              ;;
          esac
          echo "place=$place" >> "$GITHUB_OUTPUT"
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.LAB_HOST }}
      - name: Configure hardware SSH access
        env:
          LAB_SSH_PRIVATE_KEY: ${{ secrets.LAB_SSH_PRIVATE_KEY }}
          LAB_SSH_KNOWN_HOSTS: ${{ secrets.LAB_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$LAB_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$LAB_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  User labgrid\n  BatchMode yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts ~/.ssh/config
      - name: Claim, flash, record serial and capture screen
        env:
          LG_COORDINATOR: ${{ vars.LAB_HOST }}:20408
          LG_PLACE: ${{ steps.place.outputs.place }}
          FIRMWARE_FILE: ${{ inputs.firmware_file }}
        run: |
          nix run path:./apps/attractap-lab -- \
            --config apps/attractap-lab/example-env.yaml \
            --place "$LG_PLACE" --image "firmware/$FIRMWARE_FILE" \
            --output lab-artifacts --log-seconds 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attractap-lab-${{ github.run_id }}
          path: lab-artifacts/
          if-no-files-found: ignore
