name: Attractap Desktop

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'apps/attractap/desktop/**'
      - 'apps/attractap/firmware/**'
      - '.github/workflows/hardware.yml'

permissions:
  contents: read

jobs:
  desktop-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install native desktop dependencies
        run: brew install sdl3 curl cmake
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test native desktop
        run: pnpm nx run attractap-desktop:test
