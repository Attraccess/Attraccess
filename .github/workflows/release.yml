name: Release

on:
  release:
    types: [published]

env:
  GHCR_IMAGE_NAME: ${{ vars.GHCR_IMAGE_NAME }}
  DOCKERHUB_IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE_NAME }}
  DOCKER_BUILDKIT: 1
  RELEASE_VERSION: ${{ github.event.release.tag_name }}
  # Nx remote cache — releases build off main, so they may write.
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_CACHE_TOKEN_RW && vars.NX_CACHE_URL || '' }}
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_CACHE_TOKEN_RW }}

permissions:
  contents: write
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Lint all projects
        run: pnpm nx run-many --target=lint --parallel=5 --exclude=tag:scope:hardware,tag:type:plugin

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Typecheck all projects
        run: pnpm nx run-many --target=typecheck --parallel=5 --exclude=tag:scope:hardware,tag:type:plugin

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Test all projects
        run: pnpm nx run-many --target=test,e2e --parallel=5 --exclude=tag:scope:hardware,tag:type:plugin

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Build all projects
        env:
          NODE_ENV: production
        run: pnpm nx run-many --target=build --parallel=5 --exclude=tag:scope:hardware,tag:type:plugin,tag:scope:companion

  plugins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Build + zip plugin apps
        env:
          NODE_ENV: production
        run: pnpm nx run-many --target=package --parallel=3 --projects=tag:type:plugin

      - name: Collect plugin ZIPs into a flat directory
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          mkdir -p dist/plugin-zips
          for zip in apps/plugins/**/dist/*.zip; do
            cp "$zip" dist/plugin-zips/
          done

      - name: Attach plugin ZIPs to release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE_VERSION }}
          files: dist/plugin-zips/*.zip
          fail_on_unmatched_files: true

  build-companion:
    uses: ./.github/workflows/build-companion-binaries.yml
    secrets: inherit

  containerize:
    needs: [lint, typecheck, test, build, build-companion]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/build-attractap-firmware

      - uses: ./.github/actions/download-companion

      - name: Get short SHA
        id: vars
        run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Compute Docker tags
        id: docker-tags
        run: |
          TAGS="ghcr.io/${{ env.GHCR_IMAGE_NAME }}:${{ env.RELEASE_VERSION }}"
          TAGS="${TAGS},${{ env.DOCKERHUB_IMAGE_NAME }}:${{ env.RELEASE_VERSION }}"
          TAGS="${TAGS},ghcr.io/${{ env.GHCR_IMAGE_NAME }}:${{ env.RELEASE_VERSION }}-${{ steps.vars.outputs.SHORT_SHA }}"
          TAGS="${TAGS},${{ env.DOCKERHUB_IMAGE_NAME }}:${{ env.RELEASE_VERSION }}-${{ steps.vars.outputs.SHORT_SHA }}"
          # nx release sets target_commitish to a commit SHA (not "main"), so
          # also accept the release's own commit — it was just pushed to main.
          if [[ "${{ github.event.release.prerelease }}" == "false" && ("${{ github.event.release.target_commitish }}" == "main" || "${{ github.event.release.target_commitish }}" == "${{ github.sha }}") ]]; then
            TAGS="${TAGS},ghcr.io/${{ env.GHCR_IMAGE_NAME }}:latest"
            TAGS="${TAGS},${{ env.DOCKERHUB_IMAGE_NAME }}:latest"
          fi
          echo "TAGS=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: ./.github/actions/docker-build-push
        with:
          tags: ${{ steps.docker-tags.outputs.TAGS }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Update GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE_VERSION }}
          body: |
            ## Docker Image

            ### GitHub Container Registry
            ```bash
            docker pull ghcr.io/${{ env.GHCR_IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
            ```

            ### Docker Hub
            ```bash
            docker pull ${{ env.DOCKERHUB_IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
            ```

            ### Image Details
            - GitHub Registry: `ghcr.io/${{ env.GHCR_IMAGE_NAME }}:${{ env.RELEASE_VERSION }}`
            - Docker Hub: `${{ env.DOCKERHUB_IMAGE_NAME }}:${{ env.RELEASE_VERSION }}`

            ### Docker Run Example
            ```bash
            docker run -p 3000:3000 ${{ env.DOCKERHUB_IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
            ```

          append_body: true

  balena:
    needs: [lint, typecheck, test, build, build-companion]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/build-attractap-firmware

      - uses: ./.github/actions/download-companion

      - uses: ./.github/actions/balena-push
        with:
          version: ${{ env.RELEASE_VERSION }}
          balena-token: ${{ secrets.BALENA_TOKEN }}
          balena-fleet: ${{ secrets.BALENA_FLEET }}
          note: 'Release ${{ env.RELEASE_VERSION }}'
