name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: '24 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript, TypeScript, C/C++, and Actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, c-cpp, actions
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
