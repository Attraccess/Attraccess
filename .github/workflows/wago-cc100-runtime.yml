name: WAGO CC100 Runtime

on:
  pull_request:
    paths:
      - 'apps/plugins/wago/cc100-runtime/**'
      - 'apps/plugins/wago/backend/protocol.ts'
      - 'apps/plugins/wago/backend/wago.service.ts'
      - '.github/workflows/wago-cc100-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'apps/plugins/wago/cc100-runtime/**'
      - 'apps/plugins/wago/backend/protocol.ts'
      - 'apps/plugins/wago/backend/wago.service.ts'
      - '.github/workflows/wago-cc100-runtime.yml'

permissions:
  contents: read
  packages: write

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - run: pnpm nx run wago-cc100-runtime:typecheck
      - run: pnpm nx run wago-cc100-runtime:test
      - run: pnpm nx run wago-cc100-runtime:build
      - run: pnpm nx run wago-cc100-runtime:build-simulator
      - name: Start simulator against RabbitMQ
        env:
          WAGO_ENROLLMENT_SECRET: ci-enrollment-secret
          WAGO_ENROLLMENT_USERNAME: attraccess
          WAGO_ENROLLMENT_PASSWORD: password
        run: |
          docker compose -f apps/plugins/wago/cc100-runtime/docker-compose.simulator.yml up --build --detach
          for attempt in {1..30}; do
            logs="$(docker compose -f apps/plugins/wago/cc100-runtime/docker-compose.simulator.yml logs cc100-simulator)"
            if [[ "$logs" == *"WAGO CC100 simulator enrollment connected"* ]]; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              docker compose -f apps/plugins/wago/cc100-runtime/docker-compose.simulator.yml logs cc100-simulator
              echo "Simulator did not become ready within 150 seconds"
              exit 1
            fi
            sleep 5
          done
      - name: Stop simulator integration stack
        if: always()
        run: WAGO_ENROLLMENT_SECRET=cleanup WAGO_ENROLLMENT_USERNAME=cleanup WAGO_ENROLLMENT_PASSWORD=cleanup docker compose -f apps/plugins/wago/cc100-runtime/docker-compose.simulator.yml down --volumes
      - uses: actions/upload-artifact@v4
        with:
          name: wago-cc100-runtime-manifest
          path: apps/plugins/wago/cc100-runtime/manifest.json
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: apps/plugins/wago/cc100-runtime/Dockerfile
          platforms: linux/arm/v7
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/attraccess/wago-cc100-runtime:${{ github.sha }}
      - name: Verify ARMv7 manifest and record immutable image
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/attraccess/wago-cc100-runtime:${{ github.sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE" --raw | jq -e '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm" and .platform.variant == "v7")] | length == 1'
          printf '%s@%s\n' "$IMAGE" "$DIGEST" | tee wago-cc100-runtime-image.txt
      - name: Create signed offline runtime bundle
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/attraccess/wago-cc100-runtime:${{ github.sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
          WAGO_RUNTIME_SIGNING_PRIVATE_KEY: ${{ secrets.WAGO_RUNTIME_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$WAGO_RUNTIME_SIGNING_PRIVATE_KEY"
          docker pull --platform linux/arm/v7 "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" "$IMAGE"
          docker save "$IMAGE" -o image.tar
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > image-reference
          tar --mtime='@0' -cf wago-cc100-runtime.tar image.tar image-reference
          rm -f image.tar image-reference
          sha256sum wago-cc100-runtime.tar > wago-cc100-runtime.tar.sha256
          umask 077
          printf '%s\n' "$WAGO_RUNTIME_SIGNING_PRIVATE_KEY" > signing-private-key
          ssh-keygen -Y sign -f signing-private-key -n attraccess-wago-runtime wago-cc100-runtime.tar
          rm -f signing-private-key
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: wago-cc100-runtime-image
          path: wago-cc100-runtime-image.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: wago-cc100-runtime-bundle
          path: |
            wago-cc100-runtime.tar
            wago-cc100-runtime.tar.sha256
            wago-cc100-runtime.tar.sig
