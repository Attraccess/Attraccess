name: WAGO CC100 Runtime

on:
  pull_request:
    paths:
      - 'apps/plugins/wago/cc100-runtime/**'
      - 'apps/plugins/wago/backend/protocol.ts'
      - 'apps/plugins/wago/backend/wago.service.ts'
      - 'apps/plugins/wago/scripts/package-runtime-artifact.mjs'
      - '.github/workflows/wago-cc100-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'apps/plugins/wago/cc100-runtime/**'
      - 'apps/plugins/wago/backend/protocol.ts'
      - 'apps/plugins/wago/backend/wago.service.ts'
      - 'apps/plugins/wago/scripts/package-runtime-artifact.mjs'
      - '.github/workflows/wago-cc100-runtime.yml'

permissions:
  contents: read
  packages: write

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - run: pnpm nx run wago-cc100-runtime:typecheck
      - run: pnpm nx run wago-cc100-runtime:test
      - run: pnpm nx run wago-cc100-runtime:build
      - uses: actions/upload-artifact@v4
        with:
          name: wago-cc100-runtime-manifest
          path: apps/plugins/wago/cc100-runtime/manifest.json
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: apps/plugins/wago/cc100-runtime/Dockerfile
          platforms: linux/arm/v7
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/attraccess/wago-cc100-runtime:${{ github.sha }}
      - name: Verify ARMv7 manifest and record immutable image
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/attraccess/wago-cc100-runtime:${{ github.sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE" --raw | jq -e '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm" and .platform.variant == "v7")] | length == 1'
          printf '%s@%s\n' "$IMAGE" "$DIGEST" | tee wago-cc100-runtime-image.txt
      - name: Create signed offline runtime bundle
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/attraccess/wago-cc100-runtime:${{ github.sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
          WAGO_RUNTIME_SIGNING_PRIVATE_KEY: ${{ secrets.WAGO_RUNTIME_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$WAGO_RUNTIME_SIGNING_PRIVATE_KEY"
          docker pull --platform linux/arm/v7 "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" "$IMAGE"
          docker save "$IMAGE" -o image.tar
          umask 077
          printf '%s\n' "$WAGO_RUNTIME_SIGNING_PRIVATE_KEY" > signing-private-key
          trap 'rm -f signing-private-key image.tar' EXIT
          VERSION=$(node -p "require('./apps/plugins/wago/cc100-runtime/manifest.json').runtimeVersion")
          node -e "if(require('./apps/plugins/wago/cc100-runtime/manifest.json').deployment.hardwareProfile !== 'cc100-751-9301-fw31-digital-v1') throw new Error('Integrate the ATT-1056 hardware runtime before publishing commissioning artifacts')"
          node apps/plugins/wago/scripts/package-runtime-artifact.mjs --image-archive image.tar --image "$IMAGE@$DIGEST" --version "$VERSION" --signing-key signing-private-key --out runtime-release
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: wago-cc100-runtime-image
          path: wago-cc100-runtime-image.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: wago-cc100-runtime-bundle
          path: |
            runtime-release/cc100-*/wago-cc100-runtime.tar
            runtime-release/cc100-*/wago-cc100-runtime.tar.sha256
            runtime-release/cc100-*/wago-cc100-runtime.tar.sig
