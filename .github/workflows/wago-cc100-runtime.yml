name: WAGO CC100 Runtime

on:
  pull_request:
    paths:
      - 'apps/plugins/wago/**'
      - 'nx.json'
      - 'eslint.config.cjs'
      - 'eslint.base.config.cjs'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'apps/plugins/wago/scripts/package-runtime-artifact.mjs'
      - '.github/workflows/wago-cc100-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'apps/plugins/wago/**'
      - 'nx.json'
      - 'eslint.config.cjs'
      - 'eslint.base.config.cjs'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'apps/plugins/wago/scripts/package-runtime-artifact.mjs'
      - '.github/workflows/wago-cc100-runtime.yml'

permissions:
  contents: read
  packages: write

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - run: pnpm nx run plugin-wago:typecheck-cc100-runtime
      - run: pnpm nx run plugin-wago:test-cc100-runtime
      - run: pnpm nx run plugin-wago:build-cc100-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: wago-cc100-runtime-manifest
          path: apps/plugins/wago/cc100-runtime/manifest.json
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: apps/plugins/wago/cc100-runtime/Dockerfile
          platforms: linux/arm/v7
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/attraccess/wago-cc100-runtime:${{ github.sha }}
      - name: Verify ARMv7 manifest and record immutable image
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/attraccess/wago-cc100-runtime:${{ github.sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE" --raw | jq -e '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm" and .platform.variant == "v7")] | length == 1'
          printf '%s@%s\n' "$IMAGE" "$DIGEST" | tee wago-cc100-runtime-image.txt
      - name: Create offline runtime bundle
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/attraccess/wago-cc100-runtime:${{ github.sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker pull --platform linux/arm/v7 "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" "$IMAGE"
          docker save "$IMAGE" -o image.tar
          trap 'rm -f image.tar' EXIT
          VERSION=$(node -p "require('./apps/plugins/wago/cc100-runtime/manifest.json').runtimeVersion")
          PROFILE=$(node -p "require('./apps/plugins/wago/cc100-runtime/manifest.json').deployment.hardwareProfile")
          node apps/plugins/wago/scripts/package-runtime-artifact.mjs --image-archive image.tar --image "$IMAGE@$DIGEST" --version "$VERSION" --hardware-profile "$PROFILE" --out runtime-release
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: wago-cc100-runtime-image
          path: wago-cc100-runtime-image.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: wago-cc100-runtime-bundle
          path: |
            runtime-release/cc100-*/wago-cc100-runtime.tar
            runtime-release/cc100-*/wago-cc100-runtime.tar.sha256
