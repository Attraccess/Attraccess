name: Build and Test Attractap Firmware

on:
  workflow_call:
  workflow_dispatch:

env:
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_CACHE_TOKEN_RO && vars.NX_CACHE_URL || '' }}
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'release') && secrets.NX_CACHE_TOKEN_RW || secrets.NX_CACHE_TOKEN_RO }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/build-attractap-firmware

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: attractap-firmware-${{ github.run_id }}
          path: apps/attractap/firmware/firmware_output/
          if-no-files-found: error
          retention-days: 14
