name: Pull Requests

on:
  pull_request:
    types: [opened, synchronize]

env:
  GHCR_IMAGE_NAME: ${{ vars.GHCR_IMAGE_NAME }}
  DOCKERHUB_IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE_NAME }}
  DOCKER_BUILDKIT: 1

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  precommit-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Run precommit checks
        run: pnpm precommit
      - name: Ensure precommit does not modify files
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "pnpm precommit modified files. Please run it locally and commit the changes."
            git status --porcelain
            git --no-pager diff
            exit 1
          fi

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm exec commitlint

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Lint affected projects
        run: pnpm nx affected --target=lint --parallel=5 --base=origin/${{ github.event.pull_request.base.ref }} --exclude=tag:scope:hardware,tag:type:plugin
      - name: Typecheck affected projects
        run: pnpm nx affected --target=typecheck --parallel=5 --base=origin/${{ github.event.pull_request.base.ref }} --exclude=tag:scope:hardware,tag:type:plugin

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Test affected projects
        run: pnpm nx affected --target=test,e2e --parallel=5 --base=origin/${{ github.event.pull_request.base.ref }} --exclude=tag:scope:hardware,tag:type:plugin

  plugins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Lint plugin apps
        run: pnpm nx run-many --target=lint --parallel=3 --projects=tag:type:plugin
      - name: Build + zip plugin apps
        run: pnpm nx run-many --target=package --parallel=3 --projects=tag:type:plugin

      - name: Upload plugin ZIPs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugins-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: apps/plugins/**/dist/*.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Build PR comment body
        id: comment-body
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          out="$(mktemp)"
          {
            echo "## Plugin artifacts"
            echo ""
            echo "Commit \`${{ github.event.pull_request.head.sha }}\` · workflow run [\`${{ github.run_id }}\`](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ""
            found=false
            for zip in apps/plugins/**/dist/*.zip; do
              found=true
              size="$(du -h "$zip" | cut -f1)"
              echo "- \`$(basename "$zip")\` (${size})"
            done
            if [ "$found" = false ]; then
              echo "_No plugin ZIPs were produced for this PR._"
            else
              echo ""
              echo "Download the ZIPs from the [workflow artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            fi
          } > "$out"
          {
            echo 'body<<EOF_BODY'
            cat "$out"
            echo 'EOF_BODY'
          } >> "$GITHUB_OUTPUT"

      - name: Post sticky PR comment with plugin artifacts
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: plugin-artifacts
          message: ${{ steps.comment-body.outputs.body }}

  fail2ban-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Run fail2ban smoke test
        run: ./scripts/fail2ban-smoke.sh

  containerize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get Node.js Version
        id: node-version
        run: echo "NODE_VERSION=$(cat .nvmrc | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Get short SHA
        id: vars
        run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@b66d8774c665b789105b440514f0c97e6f19b06f
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_IMAGE_NAME }}:pr-${{ github.event.number }}-${{ steps.vars.outputs.SHORT_SHA }}
            ${{ env.DOCKERHUB_IMAGE_NAME }}:pr-${{ github.event.number }}-${{ steps.vars.outputs.SHORT_SHA }}
          build-args: |
            NODE_VERSION=${{ steps.node-version.outputs.NODE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Post image URL comment to PR
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🐳 Docker images built and pushed:

            GitHub Container Registry: \`ghcr.io/${{ env.GHCR_IMAGE_NAME }}:pr-${{ github.event.number }}-${{ steps.vars.outputs.SHORT_SHA }}\`
            Docker Hub: \`${{ env.DOCKERHUB_IMAGE_NAME }}:pr-${{ github.event.number }}-${{ steps.vars.outputs.SHORT_SHA }}\`

            Image Digest: \`${{ steps.build-and-push.outputs.digest }}\``
            })
