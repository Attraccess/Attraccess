name: Pull Requests

on:
  pull_request:
    types: [opened, synchronize]
  merge_group:
    types: [checks_requested]

env:
  GHCR_IMAGE_NAME: ${{ vars.GHCR_IMAGE_NAME }}
  DOCKERHUB_IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE_NAME }}
  DOCKER_BUILDKIT: 1
  # merge_group has no pull_request payload; base_sha is the queue target (main).
  NX_AFFECTED_BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.event.pull_request.base.ref) }}
  # Self-hosted Nx remote cache (jappyjan/nx-cache-server). Fork PRs get no
  # secrets, so the server URL resolves to '' and caching turns itself off.
  # PR and merge-queue builds only ever get the read-only token: only the four
  # workflows in nx.json sharedGlobals are part of the Nx hash, so a PR that
  # could write would be able to plant an artifact under a hash main later
  # restores (CVE-2025-36852).
  # Kill switch: clear the NX_CACHE_URL repo variable to disable the cache
  # everywhere. Nx exits 1 when the server is unreachable or rejects a token —
  # it does not degrade to "no cache" — so clear it before taking the server
  # down or rotating tokens.
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_CACHE_TOKEN_RO && vars.NX_CACHE_URL || '' }}
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_CACHE_TOKEN_RO }}

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  precommit-check:
    # Lint/typecheck/test/e2e already run as dedicated jobs below. This job is a
    # gate, not a runner: re-running the same graph here would double
    # the work (the remote cache turns the repeat into restores, not into
    # nothing — a gate should not be walking the task graph). `pnpm precommit`
    # remains the local hook, where `--uncommitted` is the right selector; on CI
    # it is always empty.
    #
    # `if: always()` is load-bearing: with plain `needs:` an upstream failure
    # *skips* this job, and a skipped job reports Success to branch protection.
    # `test` is not itself a required check, so this gate is what makes a test
    # failure block a merge.
    #
    # Everything in `needs` is gated, so adding a job here is the whole change.
    # Only `lint-and-typecheck` is a required check in its own right; the rest
    # would otherwise be able to fail without blocking a merge. `plugins` is the
    # sharpest of those — lint/typecheck/test all `--exclude=tag:type:plugin`,
    # so it is the only job in this workflow that compiles the plugin apps.
    #
    # Deliberately NOT gated:
    #   `commitlint`   — `if: github.event_name == 'pull_request'`, so it reports
    #                    `skipped` in the merge queue and would deadlock it. It
    #                    is a required check already.
    #   `containerize` — required already, and its Docker build would serialize
    #                    a 3-second gate behind ~45 minutes. It covers `pnpm
    #                    precommit`'s `build` step. Note it is
    #                    deliverable/test dependencies + `if: ... && !failure()`,
    #                    so upstream failures *skip* it and it reports Success
    #                    — which is why those jobs are gated here too.
    #
    # Every gated job runs unconditionally under both `pull_request` and
    # `merge_group`, so a strict `== success` cannot trip over a legitimately
    # skipped dependency.
    needs:
      [
        lint-and-typecheck,
        test,
        browser-e2e,
        crap-score,
        build-companion,
        build-attractap-firmware,
        build-attractap-desktop,
        plugins,
        attractap-firmware-version,
        wago-runtime-version,
        balena-compose-check,
        fail2ban-smoke,
        grafana-provisioning-smoke,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on every upstream job
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "$results"
          for result in $results; do [[ "$result" == "success" ]] || exit 1; done

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm exec commitlint

  attractap-firmware-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test Attractap firmware version check
        run: ./scripts/attractap-firmware-version-check.spec.sh
      - name: Ensure Attractap firmware version was bumped
        run: ./scripts/check-attractap-firmware-version.sh "${{ env.NX_AFFECTED_BASE }}"

  wago-runtime-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Test CC100 runtime version check
        run: node --test scripts/wago-runtime-version-check.test.mjs
      - name: Ensure CC100 runtime version was increased
        run: node scripts/check-wago-runtime-version.mjs "${{ env.NX_AFFECTED_BASE }}"

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Enforce file size limits
        run: pnpm lint:files
      - name: Lint affected projects
        run: pnpm nx affected --target=lint --parallel=5 --base=${{ env.NX_AFFECTED_BASE }} --exclude=tag:scope:hardware,tag:type:plugin
      - name: Typecheck affected projects
        run: pnpm nx affected --target=typecheck --parallel=5 --base=${{ env.NX_AFFECTED_BASE }} --exclude=tag:scope:hardware,tag:type:plugin

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Test all core projects
        run: node scripts/ci-test-projects.mjs --group=core

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-node-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Cross-site browser test
        run: pnpm nx run api:browser-e2e

  crap-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Enforce CRAP score limit for affected JS/TS projects
        run: pnpm crap-score:affected --base=${{ env.NX_AFFECTED_BASE }}
      - name: Upload CRAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crap-score-reports
          path: coverage/crap/
          if-no-files-found: ignore
          retention-days: 14

  plugins:
    # RabbitMQ plugin E2E tests use Testcontainers and require Docker, which is
    # available on the stable Ubuntu runner image.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'

      - name: Test plugin build and package tooling
        run: |
          pnpm exec vitest run --config apps/plugins/scripts/vitest.config.mts
          node --test apps/plugins/scripts/*.test.mjs

      # Lint the affected set, but test and pack every plugin on every CI run.
      - name: Lint affected plugin apps
        run: pnpm nx affected --target=lint --parallel=3 --base=${{ env.NX_AFFECTED_BASE }} --exclude='*,!tag:type:plugin'
      - uses: ./.github/actions/setup-browser-tests
      - name: Test and pack all plugin apps
        run: node scripts/ci-test-projects.mjs --group=plugins
      # The cross-project HeroUI guard (generators:no-fields-in-cards) also scans plugin
      # sources, but `generators` deliberately does not list plugin projects as implicit
      # dependencies (core tooling must not know plugin names). Run it here whenever any
      # plugin is affected so plugin UI changes cannot slip past the guard.
      - name: Detect affected plugin apps
        id: plugin-affected
        run: |
          count=$(pnpm nx show projects --affected --base=${{ env.NX_AFFECTED_BASE }} --exclude='*,!tag:type:plugin' | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Run cross-project UI guard for plugin changes
        if: steps.plugin-affected.outputs.count != '0'
        run: pnpm nx run generators:test
      # The reliability harness runs the real server plugin on the host's real MQTT services against a
      # RabbitMQ 4 container, so it also depends on host code. It fails only on a lost command, lost
      # state, a host queue drop or a recovery over 180 s. Simulator measurement, not hardware evidence.
      - name: Detect whether WAGO reliability applies
        id: wago-reliability
        run: |
          if pnpm nx show projects --affected --base=${{ env.NX_AFFECTED_BASE }} | grep -Eqx 'plugin-wago|api'; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "affected=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run WAGO reliability (short mode)
        if: steps.wago-reliability.outputs.affected == 'true'
        run: pnpm nx run plugin-wago:reliability:short
      - name: Test packed Hello World fixture
        run: pnpm --dir examples/plugin-hello-world run pack-test

  fail2ban-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run fail2ban smoke test
        run: ./scripts/fail2ban-smoke.sh

  grafana-provisioning-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Test Grafana provisioning prepare (Pushover opt-in)
        run: ./scripts/grafana-provisioning-prepare.spec.sh
      - name: Test managed Grafana provisioning sync
        run: ./scripts/grafana-managed-sync.spec.sh
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Test legacy Pushover contact point cleanup
        run: node --test scripts/grafana-pushover-cleanup.test.mjs

  balena-compose-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Validate docker-compose.balena.yml with balena's parser
        run: pnpm nx run @attraccess/source:check-balena-compose

  build-companion:
    uses: ./.github/workflows/build-companion-binaries.yml
    secrets: inherit

  build-attractap-firmware:
    uses: ./.github/workflows/attractap-firmware.yml
    secrets: inherit

  build-attractap-desktop:
    uses: ./.github/workflows/build-attractap-desktop.yml

  containerize:
    # Build the preview image while core/plugin/simulator checks run. The
    # precommit gate above still requires every deliverable's tests to pass.
    needs: [build-companion, build-attractap-firmware]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/download-attractap-firmware

      - uses: ./.github/actions/download-companion

      - name: Get short SHA
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set image tag suffix
        id: image-tag
        run: |
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            echo "suffix=mq-${{ steps.vars.outputs.SHORT_SHA }}" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=pr-${{ github.event.pull_request.number }}-${{ steps.vars.outputs.SHORT_SHA }}" >> "$GITHUB_OUTPUT"
          fi

      # Fork PRs get no repository secrets and no repository variables
      # (GHCR_IMAGE_NAME resolves to ''), and their GITHUB_TOKEN is read-only,
      # so no registry push is possible — not even to GHCR. Build the image
      # without pushing so the Dockerfile and the bundled firmware/companion
      # artifacts still get validated.
      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          suffix="${{ steps.image-tag.outputs.suffix }}"
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "tags=attraccess:${suffix}" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
            {
              echo "tags<<EOF"
              echo "ghcr.io/${{ env.GHCR_IMAGE_NAME }}:${suffix}"
              echo "${{ env.DOCKERHUB_IMAGE_NAME }}:${suffix}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        id: build-and-push
        uses: ./.github/actions/docker-build-push
        with:
          tags: ${{ steps.tags.outputs.tags }}
          push: ${{ steps.tags.outputs.push }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      # Fork PRs only get a read-only GITHUB_TOKEN, so posting the comment
      # would fail with "Resource not accessible by integration" — skip it there.
      - name: Post image URL comment to PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🐳 Docker images built and pushed:

            GitHub Container Registry: \`ghcr.io/${{ env.GHCR_IMAGE_NAME }}:${{ steps.image-tag.outputs.suffix }}\`
            Docker Hub: \`${{ env.DOCKERHUB_IMAGE_NAME }}:${{ steps.image-tag.outputs.suffix }}\`

            Image Digest: \`${{ steps.build-and-push.outputs.digest }}\``
            })
