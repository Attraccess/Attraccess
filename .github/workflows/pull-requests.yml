name: Pull Requests

on:
  pull_request:
    types: [opened, synchronize]
  merge_group:
    types: [checks_requested]

env:
  GHCR_IMAGE_NAME: ${{ vars.GHCR_IMAGE_NAME }}
  DOCKERHUB_IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE_NAME }}
  DOCKER_BUILDKIT: 1
  # merge_group has no pull_request payload; base_sha is the queue target (main).
  NX_AFFECTED_BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.event.pull_request.base.ref) }}

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  precommit-check:
    # Lint/typecheck/test/e2e already run as dedicated jobs below (`pnpm
    # precommit` also runs `build`, covered by `containerize`). This job is a
    # gate, not a runner: re-running the same affected graph here would double
    # the work (every job is a cold-Nx-cache runner). `pnpm precommit` remains
    # the local hook, where `--uncommitted` is the right selector; on CI it is
    # always empty.
    #
    # `if: always()` is load-bearing: with plain `needs:` an upstream failure
    # *skips* this job, and a skipped job reports Success to branch protection.
    needs: [lint-and-typecheck, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on lint, typecheck, test and e2e
        run: |
          echo "lint-and-typecheck=${{ needs.lint-and-typecheck.result }} test=${{ needs.test.result }}"
          [[ "${{ needs.lint-and-typecheck.result }}" == "success" && "${{ needs.test.result }}" == "success" ]]

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm exec commitlint

  attractap-firmware-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test Attractap firmware version check
        run: ./scripts/attractap-firmware-version-check.spec.sh
      - name: Ensure Attractap firmware version was bumped
        run: ./scripts/check-attractap-firmware-version.sh "${{ env.NX_AFFECTED_BASE }}"

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Lint affected projects
        run: pnpm nx affected --target=lint --parallel=5 --base=${{ env.NX_AFFECTED_BASE }} --exclude=tag:scope:hardware,tag:type:plugin
      - name: Typecheck affected projects
        run: pnpm nx affected --target=typecheck --parallel=5 --base=${{ env.NX_AFFECTED_BASE }} --exclude=tag:scope:hardware,tag:type:plugin

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Test affected projects
        run: pnpm nx affected --target=test,e2e --parallel=5 --base=${{ env.NX_AFFECTED_BASE }} --exclude=tag:scope:hardware,tag:type:plugin

  plugins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'

      # Only affected plugins are linted/packaged. The `*,!tag:type:plugin`
      # exclude keeps the affected set restricted to plugin apps, so a PR that
      # touches no plugin (or shared global) runs nothing here.
      - name: Lint affected plugin apps
        run: pnpm nx affected --target=lint --parallel=3 --base=${{ env.NX_AFFECTED_BASE }} --exclude='*,!tag:type:plugin'
      - name: Build + zip affected plugin apps
        run: pnpm nx affected --target=package --parallel=3 --base=${{ env.NX_AFFECTED_BASE }} --exclude='*,!tag:type:plugin'

      - name: Collect plugin ZIPs into a flat directory
        id: collect
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          mkdir -p dist/plugin-zips
          for zip in apps/plugins/**/dist/*.zip; do
            cp "$zip" dist/plugin-zips/
          done
          zips=(dist/plugin-zips/*.zip)
          if [[ ${#zips[@]} -gt 0 ]]; then
            echo "has_plugins=true" >> "$GITHUB_OUTPUT"
            echo "Collected ${#zips[@]} plugin ZIP(s)."
          else
            echo "has_plugins=false" >> "$GITHUB_OUTPUT"
            echo "No plugin ZIPs produced — no plugins affected by this PR."
          fi

      - name: Upload plugin ZIPs
        uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && always() && steps.collect.outputs.has_plugins == 'true'
        with:
          name: plugins-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: dist/plugin-zips/*.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Build PR comment body
        id: comment-body
        if: github.event_name == 'pull_request' && always()
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          out="$(mktemp)"
          {
            echo "## Plugin artifacts"
            echo ""
            echo "Commit \`${{ github.event.pull_request.head.sha }}\` · workflow run [\`${{ github.run_id }}\`](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ""
            if [[ "${{ steps.collect.outputs.has_plugins }}" != "true" ]]; then
              echo "_No plugin changes detected in this PR — skipped plugin build._"
            else
              for zip in dist/plugin-zips/*.zip; do
                size="$(du -h "$zip" | cut -f1)"
                echo "- \`$(basename "$zip")\` (${size})"
              done
              echo ""
              echo "Download the ZIPs from the [workflow artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            fi
          } > "$out"
          {
            echo 'body<<EOF_BODY'
            cat "$out"
            echo 'EOF_BODY'
          } >> "$GITHUB_OUTPUT"

      - name: Post sticky PR comment with plugin artifacts
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: plugin-artifacts
          message: ${{ steps.comment-body.outputs.body }}

  fail2ban-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run fail2ban smoke test
        run: ./scripts/fail2ban-smoke.sh

  grafana-provisioning-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Test Grafana provisioning prepare (Pushover opt-in)
        run: ./scripts/grafana-provisioning-prepare.spec.sh

  balena-compose-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Validate docker-compose.balena.yml with balena's parser
        run: node scripts/check-balena-compose.mjs

  build-companion:
    uses: ./.github/workflows/build-companion-binaries.yml
    secrets: inherit

  containerize:
    needs: [build-companion]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pre-build the Attractap firmware on the runner: the Dockerfile has no
      # ESP-IDF and fails loudly if no firmware is bundled (ATT-715).
      - uses: ./.github/actions/build-attractap-firmware

      - uses: ./.github/actions/download-companion

      - name: Get short SHA
        id: vars
        run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set image tag suffix
        id: image-tag
        run: |
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            echo "suffix=mq-${{ steps.vars.outputs.SHORT_SHA }}" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=pr-${{ github.event.pull_request.number }}-${{ steps.vars.outputs.SHORT_SHA }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        id: build-and-push
        uses: ./.github/actions/docker-build-push
        with:
          tags: |
            ghcr.io/${{ env.GHCR_IMAGE_NAME }}:${{ steps.image-tag.outputs.suffix }}
            ${{ env.DOCKERHUB_IMAGE_NAME }}:${{ steps.image-tag.outputs.suffix }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Post image URL comment to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🐳 Docker images built and pushed:

            GitHub Container Registry: \`ghcr.io/${{ env.GHCR_IMAGE_NAME }}:${{ steps.image-tag.outputs.suffix }}\`
            Docker Hub: \`${{ env.DOCKERHUB_IMAGE_NAME }}:${{ steps.image-tag.outputs.suffix }}\`

            Image Digest: \`${{ steps.build-and-push.outputs.digest }}\``
            })
