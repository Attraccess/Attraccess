name: Balena Manual Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git ref to checkout (e.g., main or feature branch)
        required: true
        type: string
      version:
        description: Version to write into balena.yml (replaces {{VERSION_TO_BE_REPLACED}})
        required: true
        type: string
      draft:
        description: Push as draft release
        required: false
        default: true
        type: boolean
      note:
        description: Optional note for Balena release
        required: false
        type: string

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: 1

jobs:
  balena:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: ./.github/actions/balena-push
        with:
          version: ${{ inputs.version }}
          balena-token: ${{ secrets.BALENA_TOKEN }}
          balena-fleet: ${{ secrets.BALENA_FLEET }}
          draft: ${{ inputs.draft }}
          note: ${{ inputs.note }}
