name: Balena Manual Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git ref to checkout (e.g., main or feature branch)
        required: true
        type: string
      version:
        description: Version to write into balena.yml (replaces {{VERSION_TO_BE_REPLACED}})
        required: true
        type: string
      draft:
        description: Push as draft release
        required: false
        default: true
        type: boolean
      note:
        description: Optional note for Balena release
        required: false
        type: string

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: 1

jobs:
  build-companion:
    uses: ./.github/workflows/build-companion-binaries.yml
    with:
      ref: ${{ inputs.branch }}
    secrets: inherit

  build-attractap-firmware:
    uses: ./.github/workflows/attractap-firmware.yml
    with:
      ref: ${{ inputs.branch }}
    secrets: inherit

  build-attractap-desktop:
    uses: ./.github/workflows/build-attractap-desktop.yml
    with:
      ref: ${{ inputs.branch }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-browser-tests
      - name: Test all core projects and plugins
        run: node scripts/ci-test-projects.mjs --group=software
      - name: Test packed Hello World fixture
        run: pnpm --dir examples/plugin-hello-world run pack-test

  balena:
    needs: [build-companion, build-attractap-firmware, build-attractap-desktop, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - uses: ./.github/actions/download-attractap-firmware

      - uses: ./.github/actions/build-cc100-runtime

      - uses: ./.github/actions/download-companion

      - uses: ./.github/actions/balena-push
        with:
          version: ${{ inputs.version }}
          balena-token: ${{ secrets.BALENA_TOKEN }}
          balena-fleet: ${{ secrets.BALENA_FLEET }}
          draft: ${{ inputs.draft }}
          note: ${{ inputs.note }}
