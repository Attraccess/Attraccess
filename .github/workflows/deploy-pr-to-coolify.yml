# Deploys the PR's Docker image to Coolify (mirrors .cursor/skills/deploy-pr-to-coolify).
#
# Required secrets:
#   COOLIFY_URL       - Coolify instance URL (e.g. https://coolify.apps.janjaap.de)
#   COOLIFY_API_TOKEN - API token from Coolify Security → API Tokens
#
# Optional variables:
#   COOLIFY_APP_NAME     - Application name in Coolify (default: attraccess)
#   DEPLOY_ALLOWED_USERS - Comma-separated GitHub usernames who may trigger (required)
#
# Usage:
#   - From PR: comment "/deploy" on the PR to trigger deployment
#   - Manual: Actions → Deploy PR to Coolify → Run workflow
name: Deploy PR to Coolify

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to deploy (optional; uses PR for selected branch if empty)'
        required: false
        type: number
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  # Only run when: allowed user + (manual trigger, or comment "/deploy" on a PR)
  filter:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.filter.outputs.pr_number }}
      should_run: ${{ steps.filter.outputs.should_run }}
    steps:
      - name: Filter
        id: filter
        env:
          DEPLOY_ALLOWED_USERS: ${{ vars.DEPLOY_ALLOWED_USERS }}
        run: |
          ALLOWED="$DEPLOY_ALLOWED_USERS"
          if [ -z "$ALLOWED" ]; then
            echo "::error::DEPLOY_ALLOWED_USERS variable is not set. Add it in repo Settings → Variables."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACTOR="${{ github.actor }}"
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            ACTOR="${{ github.event.comment.user.login }}"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if ! echo ",$ALLOWED," | grep -q ",$ACTOR,"; then
            echo "::error::User $ACTOR is not allowed to trigger deployment. Allowed: $ALLOWED"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "pr_number=${{ inputs.pr_number }}" >> $GITHUB_OUTPUT
            echo "should_run=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            if [ -z "${{ github.event.issue.pull_request }}" ]; then
              echo "should_run=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            if ! echo "${{ github.event.comment.body }}" | grep -qiE '(^|\n)\s*/deploy(\s|$)'; then
              echo "should_run=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "pr_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: filter
    if: needs.filter.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve PR number
        id: pr
        run: |
          PR="${{ needs.filter.outputs.pr_number }}"
          [ -z "$PR" ] && PR="${{ inputs.pr_number }}"
          [ -z "$PR" ] && PR=$(gh pr view --json number -q '.number' 2>/dev/null || echo "")
          if [ -z "$PR" ]; then
            echo "::error::No PR found. Comment /deploy on a PR, or run manually with pr_number from a PR branch."
            exit 1
          fi
          echo "number=$PR" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get image tag
        id: tag
        run: |
          PR=${{ steps.pr.outputs.number }}
          SHORT_SHA=$(gh pr view $PR --json headRefOid -q '.headRefOid' | cut -c1-7)
          echo "tag=pr-${PR}-${SHORT_SHA}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install coolify-cli
        run: |
          curl -sL "https://github.com/coollabsio/coolify-cli/releases/download/v1.4.0/coolify-cli_1.4.0_linux_amd64.tar.gz" -o coolify.tar.gz
          tar -xzf coolify.tar.gz
          sudo mv coolify /usr/local/bin/

      - name: Get app UUID
        id: app
        env:
          COOLIFY_APP_NAME: ${{ vars.COOLIFY_APP_NAME }}
        run: |
          APP_NAME="${COOLIFY_APP_NAME:-attraccess}"
          APPS=$(coolify --host "${{ secrets.COOLIFY_URL }}" --token "${{ secrets.COOLIFY_API_TOKEN }}" app list --format=json)
          UUID=$(echo "$APPS" | jq -r --arg name "$APP_NAME" '.[] | select(.name==$name) | .uuid')
          if [ -z "$UUID" ] || [ "$UUID" == "null" ]; then
            echo "::error::App '$APP_NAME' not found in Coolify"
            exit 1
          fi
          echo "uuid=$UUID" >> $GITHUB_OUTPUT

      - name: Update app image tag
        run: |
          coolify --host "${{ secrets.COOLIFY_URL }}" --token "${{ secrets.COOLIFY_API_TOKEN }}" app update "${{ steps.app.outputs.uuid }}" --docker-tag "${{ steps.tag.outputs.tag }}"

      - name: Deploy
        env:
          COOLIFY_APP_NAME: ${{ vars.COOLIFY_APP_NAME }}
        run: |
          APP_NAME="${COOLIFY_APP_NAME:-attraccess}"
          coolify --host "${{ secrets.COOLIFY_URL }}" --token "${{ secrets.COOLIFY_API_TOKEN }}" deploy name "$APP_NAME" --force
