name: Main Nx Cache

# Fills the Nx remote cache from every push to main, so pull requests start
# from the latest main. The full nightly (docker-nightly-latest.yml) runs only
# once a night because it needs the lab readers; this runs the same lint,
# typecheck, test and build commands without readers and publishes nothing.

on:
  push:
    branches: [main]

# Only the newest main commit's cache matters.
concurrency:
  group: main-nx-cache
  cancel-in-progress: true

env:
  # Main is the only branch that writes the cache. Falls back to the read-only
  # token if RW is missing, so a rotation gap degrades to reads.
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_CACHE_TOKEN_RO && vars.NX_CACHE_URL || '' }}
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_CACHE_TOKEN_RW || secrets.NX_CACHE_TOKEN_RO }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Lint all projects
        run: |
          exclude="$(node scripts/ci-nx-exclude.mjs lint)"
          echo "Excluding: $exclude"
          pnpm nx run-many --target=lint --parallel=5 --exclude="$exclude"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Typecheck all projects
        run: |
          exclude="$(node scripts/ci-nx-exclude.mjs typecheck)"
          echo "Excluding: $exclude"
          pnpm nx run-many --target=typecheck --parallel=5 --exclude="$exclude"

  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_TYPE: postgres
      DATABASE_URL: postgres://attraccess:attraccess@127.0.0.1:5432/attraccess
      # Admin connection the tests create one database per test from.
      TEST_DATABASE_URL: postgres://attraccess:attraccess@127.0.0.1:5432/postgres
    steps:
      - name: Start PostgreSQL
        # A service container cannot raise max_connections; every test gets its own database and connections.
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=attraccess -e POSTGRES_PASSWORD=attraccess -e POSTGRES_DB=attraccess \
            postgres:18.6-alpine -c max_connections=1000 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          for i in $(seq 1 60); do
            docker exec postgres pg_isready -U attraccess -d attraccess && exit 0
            sleep 2
          done
          docker logs postgres
          exit 1
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          esp-idf: 'false'
      - name: Test all projects
        run: node scripts/ci-test-projects.mjs --group=core

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Build all projects
        env:
          NODE_ENV: production
        run: |
          exclude="$(node scripts/ci-nx-exclude.mjs build)"
          echo "Excluding: $exclude"
          pnpm nx run-many --target=build --parallel=5 --exclude="$exclude"
