name: DependencyTrack SBOM

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SBOM
        run: pnpm exec cdxgen --spec-version 1.6 -o bom.json .

      - name: Determine project version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "PROJECT_VERSION=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "PROJECT_VERSION=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SBOM to Dependency-Track
        uses: DependencyTrack/gh-upload-sbom@v3
        with:
          serverHostname: ${{ vars.DEPENDENCYTRACK_HOSTNAME }}
          apiKey: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
          projectName: ${{ github.event.repository.name }}
          projectVersion: ${{ steps.version.outputs.PROJECT_VERSION }}
          bomFilename: bom.json
          autoCreate: 'true'
