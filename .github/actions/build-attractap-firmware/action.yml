name: 'Build Attractap Firmware'
description: >
  Install Python, esptool, and the ESP-IDF v5.5 toolchain (cached), then build
  all Attractap firmware variants into apps/attractap/firmware/firmware_output.
  Image builds (Docker/Balena) must run this first: the Dockerfile itself has no
  ESP-IDF, so the in-container firmware build is skipped and the pre-built
  firmware_output from the build context is bundled into the API assets instead.

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install ESP tools
      run: |
        python -m pip install --upgrade pip
        pip install esptool
      shell: bash

    - name: Cache ESP-IDF
      id: cache-esp-idf
      uses: actions/cache@v4
      with:
        path: |
          ~/esp/esp-idf
          ~/.espressif
        key: esp-idf-v5.5-esp32s3-${{ runner.os }}

    - name: Install ESP-IDF v5.5
      if: steps.cache-esp-idf.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/esp
        git clone --depth 1 --shallow-submodules --recursive -b v5.5 \
          https://github.com/espressif/esp-idf.git ~/esp/esp-idf
        ~/esp/esp-idf/install.sh esp32s3
      shell: bash

    - name: Build all firmware variants
      run: |
        cd apps/attractap/firmware
        python3 build_firmwares.py
      shell: bash
