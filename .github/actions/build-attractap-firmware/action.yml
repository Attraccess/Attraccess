name: 'Build Attractap Firmware'
description: >
  Install Python, esptool, and the ESP-IDF v5.5 toolchain (cached), then build
  all Attractap firmware variants into apps/attractap/firmware/firmware_output.
  Image builds (Docker/Balena) must run this first: the Dockerfile itself has no
  ESP-IDF, so the in-container firmware build is skipped and the pre-built
  firmware_output from the build context is bundled into the API assets instead.

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        # Pinned: ESP-IDF v5.5 supports Python up to 3.13. `3.x` drifted to
        # 3.14, which no longer matches the cached IDF virtualenv
        # (idf5.5_py3.13_env) and breaks the firmware build.
        python-version: '3.13'

    - name: Install ESP tools
      run: |
        python -m pip install --upgrade pip
        pip install esptool
      shell: bash

    - name: Cache ESP-IDF
      id: cache-esp-idf
      uses: actions/cache@v6
      with:
        path: |
          ~/esp/esp-idf
          ~/.espressif
        key: esp-idf-v5.5-esp32s3-py3.13-${{ runner.os }}

    - name: Install ESP-IDF v5.5
      # Always run, not just on cache miss: `install.sh` is idempotent and
      # repairs a cache restore that is missing the Python virtualenv. The
      # toolchain and the venv live in separate parts of ~/.espressif, and a
      # truncated/raced save can drop the venv while keeping the toolchain.
      run: |
        if [ ! -d ~/esp/esp-idf/.git ]; then
          mkdir -p ~/esp
          git clone --depth 1 --shallow-submodules --recursive -b v5.5 \
            https://github.com/espressif/esp-idf.git ~/esp/esp-idf
        fi
        ~/esp/esp-idf/install.sh esp32s3
      shell: bash

    - name: Build all firmware variants
      run: |
        cd apps/attractap/firmware
        python3 build_firmwares.py
      shell: bash
