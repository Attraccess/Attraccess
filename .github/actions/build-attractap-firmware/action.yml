name: 'Build and Test Attractap Firmware'
description: >
  Test host firmware code and build all active variants once with the cached
  ESP-IDF toolchain and Nx build cache. Image jobs download the output artifacts.

runs:
  using: 'composite'
  steps:
    - uses: ./.github/actions/setup
      with:
        esp-idf: 'true'

    - name: Build all firmware variants
      run: pnpm nx run attractap-firmware:build
      shell: bash

    - name: Generate firmware test certificates
      # A cached build restores firmware_output, but not generated CA headers.
      # Host websocket tests include those headers even when no build ran here.
      run: python3 tools/build_individual_ca_certs.py
      working-directory: apps/attractap/firmware
      shell: bash

    - name: Test firmware
      run: pnpm nx run attractap-firmware:test
      shell: bash
