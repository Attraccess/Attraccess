name: Setup Browser Tests
description: 'Install Python Playwright and reuse Chromium downloads for plugin acceptance tests.'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.15'
    - name: Install Playwright
      shell: bash
      run: python -m pip install playwright
    - name: Resolve Playwright version
      id: playwright
      shell: bash
      run: python -c "from importlib.metadata import version; print('version=' + version('playwright'))" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - name: Install Chromium and system dependencies
      shell: bash
      run: python -m playwright install --with-deps chromium
