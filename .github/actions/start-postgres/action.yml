name: 'Start PostgreSQL'
description: >-
  Start a throwaway PostgreSQL 18 container (user, password and database `attraccess`) and wait until it accepts
  connections. Must be called after actions/checkout. The job sets DATABASE_TYPE, DATABASE_URL and, for tests,
  TEST_DATABASE_URL (the admin connection the tests create one database per test from).

inputs:
  port:
    description: 'Host port the container listens on'
    required: false
    default: '5432'
  container-name:
    description: 'Docker container name'
    required: false
    default: 'postgres'

runs:
  using: 'composite'
  steps:
    - name: Start PostgreSQL
      shell: bash
      # A service container cannot raise max_connections; every test gets its own database and connections.
      # pg_isready goes over TCP: during first-start initialisation the image runs a socket-only server.
      env:
        POSTGRES_PORT: ${{ inputs.port }}
        POSTGRES_CONTAINER: ${{ inputs.container-name }}
      run: |
        docker run -d --name "$POSTGRES_CONTAINER" -p "$POSTGRES_PORT:5432" \
          -e POSTGRES_USER=attraccess -e POSTGRES_PASSWORD=attraccess -e POSTGRES_DB=attraccess \
          postgres:18.6-alpine -c max_connections=1000 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
        for _ in $(seq 1 60); do
          docker exec "$POSTGRES_CONTAINER" pg_isready -h 127.0.0.1 -U attraccess -d attraccess && exit 0
          sleep 2
        done
        docker logs "$POSTGRES_CONTAINER"
        exit 1
