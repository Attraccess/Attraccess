name: 'Setup Workspace'
description: 'Install Node.js, pnpm, dependencies, Python, and the ESP-IDF toolchain. Must be called after actions/checkout.'

inputs:
  esp-idf:
    description: 'Install the ESP-IDF toolchain (needed for jobs that build the Attractap firmware)'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup PNPM
      uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        # Pinned: ESP-IDF v5.5 supports Python up to 3.13. `3.x` drifted to
        # 3.14, which no longer matches the cached IDF virtualenv
        # (idf5.5_py3.13_env) and breaks the firmware build.
        python-version: '3.13'

    - name: Install ESP tools
      run: |
        python -m pip install --upgrade pip
        pip install esptool
      shell: bash

    - name: Cache ESP-IDF
      if: inputs.esp-idf == 'true'
      id: cache-esp-idf
      uses: actions/cache@v6
      with:
        path: |
          ~/esp/esp-idf
          ~/.espressif
        key: esp-idf-v5.5-esp32s3-py3.13-${{ runner.os }}

    - name: Install ESP-IDF v5.5
      # Always run, not just on cache miss: `install.sh` is idempotent and
      # repairs a cache restore that is missing the Python virtualenv. The
      # toolchain and the venv live in separate parts of ~/.espressif, and a
      # truncated/raced save can drop the venv while keeping the toolchain.
      if: inputs.esp-idf == 'true'
      run: |
        if [ ! -d ~/esp/esp-idf/.git ]; then
          mkdir -p ~/esp
          git clone --depth 1 --shallow-submodules --recursive -b v5.5 \
            https://github.com/espressif/esp-idf.git ~/esp/esp-idf
        fi
        ~/esp/esp-idf/install.sh esp32s3
      shell: bash
