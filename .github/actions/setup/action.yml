name: 'Setup Workspace'
description: 'Install Node.js, pnpm, dependencies, Python, and the ESP-IDF toolchain. Must be called after actions/checkout.'

inputs:
  esp-idf:
    description: 'Install the ESP-IDF toolchain (needed for jobs that build the Attractap firmware)'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup PNPM
      uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        # Pinned: the IDF virtualenv is named after the interpreter
        # (idf6.0_py3.13_env), so `3.x` drifting to 3.14 no longer matches the
        # cached env and breaks the firmware build.
        python-version: '3.13'

    - name: Install ESP tools
      run: |
        python -m pip install --upgrade pip
        pip install esptool
      shell: bash

    - uses: ./.github/actions/esp-idf-toolchain
      if: inputs.esp-idf == 'true'
