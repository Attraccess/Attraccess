name: Build-owned CC100 runtime
description: Build one offline ARMv7 runtime from the checked-out server source, outside the npm plugin archive.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v4
    - name: Identify checked-out build
      id: source
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - uses: docker/build-push-action@v6
      with:
        context: .
        file: apps/plugins/wago/cc100-runtime/Dockerfile
        platforms: linux/arm/v7
        load: true
        tags: ghcr.io/attraccess/wago-cc100-runtime:${{ steps.source.outputs.sha }}
        cache-from: type=gha,scope=cc100-runtime
        cache-to: type=gha,scope=cc100-runtime,mode=max,ignore-error=true
    - name: Package server assets
      shell: bash
      env:
        CC100_BUILD_ID: ${{ steps.source.outputs.sha }}
      run: node apps/plugins/wago/scripts/build-owned-runtime.mjs
