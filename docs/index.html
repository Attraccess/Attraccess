<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Attraccess Dokumentation</title>
  <meta name="description" content="Offizielle Dokumentation für Attraccess – Zugangsverwaltung für Makerspaces und Werkstätten">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" href="_media/favicon.ico">

  <!-- Docsify Themeable -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0.9.0/dist/css/theme-simple.css" integrity="sha384-IuZucGNxm+6VGvZLv3+oxh1kE70WlIXci7p3g/Dtchij0oKFb9s8zG9GYnIkl8CB" crossorigin="anonymous">

  <style>
    /* ===== Attraccess Light Theme (default) ===== */
    :root {
      --theme-color: #006FEE;

      /* Cover */
      --cover-background-image: none;
      --cover-background-color: #006FEE;
      --cover-color: #fff;
      --cover-heading-color: #fff;
      --cover-blockquote-color: rgba(255,255,255,0.85);
      --cover-button-background: #006FEE;
      --cover-button-border: none;
      --cover-button-color: #fff;
      --cover-button-primary-background: #fff;
      --cover-button-primary-border: none;
      --cover-button-primary-color: #006FEE;

      /* Sidebar — matches app bg-gray-100 */
      --sidebar-background: #f3f4f6;
      --sidebar-border-color: #e4e4e7;
      --sidebar-width: 260px;
      --sidebar-name-color: #006FEE;
      --sidebar-name-font-weight: 700;
      --sidebar-nav-link-color: #374151;
      --sidebar-nav-link-color--active: #006FEE;
      --sidebar-nav-link-font-weight--active: 600;
      --sidebar-nav-link-border-color--active: #006FEE;
      --sidebar-toggle-background: #006FEE;

      /* Content — matches app text-gray-900 on bg-white */
      --base-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --base-font-size: 16px;
      --base-line-height: 1.7;
      --base-color: #111827;
      --base-background-color: #ffffff;
      --heading-color: #111827;
      --heading-h1-color: #111827;
      --heading-h2-color: #111827;
      --heading-h3-color: #111827;
      --heading-h4-color: #111827;
      --link-color: #006FEE;
      --link-color--hover: #005bc4;
      --blockquote-border-color: #006FEE;
      --blockquote-color: #4b5563;

      /* Code */
      --code-font-family: "SF Mono", "Fira Code", "Fira Mono", Menlo, Consolas, monospace;
      --code-inline-background: #f4f4f5;
      --code-inline-color: #7828c8;
      --code-block-background: #18181b;
      --code-block-color: #ECEDEE;

      /* Table — matches app card styling */
      --table-head-background: #f3f4f6;
      --table-head-color: #111827;
      --table-body-background: #ffffff;
      --table-row-odd-background: #f9fafb;
      --table-cell-border-color: #e4e4e7;

      /* Notice / Alerts */
      --notice-tip-border-color: #17c964;
      --notice-important-border-color: #006FEE;

      /* Pagination */
      --pagination-border-color: #e4e4e7;
      --pagination-title-color: #006FEE;

      /* Search */
      --search-background: #f3f4f6;
      --search-input-background: #ffffff;
      --search-input-border-color: #e4e4e7;
      --search-result-keyword-color: #006FEE;
    }

    /* ===== Attraccess Dark Theme ===== */
    /* Applied on html element so :root variables are overridden */
    html[data-theme="dark"] {
      --theme-color: #006FEE;

      /* Cover */
      --cover-background-color: #000;
      --cover-heading-color: #fff;
      --cover-button-background: #006FEE;
      --cover-button-primary-background: #fff;
      --cover-button-primary-color: #006FEE;

      /* Sidebar — matches app dark:bg-gray-900 */
      --sidebar-background: #111827;
      --sidebar-border-color: #1f2937;
      --sidebar-name-color: #006FEE;
      --sidebar-nav-link-color: #d1d5db;
      --sidebar-nav-link-color--active: #006FEE;
      --sidebar-nav-link-border-color--active: #006FEE;
      --sidebar-toggle-background: #006FEE;

      /* Content — matches app dark:text-white on dark:bg-gray-800 */
      --base-color: #ECEDEE;
      --base-background-color: #000000;
      --heading-color: #ffffff;
      --heading-h1-color: #ffffff;
      --heading-h2-color: #f4f4f5;
      --heading-h3-color: #e4e4e7;
      --heading-h4-color: #d4d4d8;
      --link-color: #338ef7;
      --link-color--hover: #66aaf9;
      --blockquote-border-color: #006FEE;
      --blockquote-color: #9ca3af;

      /* Code */
      --code-inline-background: #1f2937;
      --code-inline-color: #c084fc;
      --code-block-background: #111827;
      --code-block-color: #ECEDEE;

      /* Table — matches app dark cards */
      --table-head-background: #1f2937;
      --table-head-color: #ECEDEE;
      --table-body-background: #000000;
      --table-row-odd-background: #111827;
      --table-cell-border-color: #1f2937;

      /* Notice */
      --notice-tip-border-color: #17c964;
      --notice-important-border-color: #006FEE;

      /* Pagination */
      --pagination-border-color: #1f2937;
      --pagination-title-color: #338ef7;

      /* Search */
      --search-background: #111827;
      --search-input-background: #1f2937;
      --search-input-border-color: #374151;
      --search-result-keyword-color: #338ef7;
    }

    /* ===== Cover Page — fullscreen with parallax ===== */
    section.cover {
      background: none !important;
    }
    section.cover::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 0;
      background: var(--cover-bg-image) center / cover no-repeat;
    }
    section.cover::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(135deg, rgba(0,111,238,0.82) 0%, rgba(120,40,200,0.68) 100%);
    }
    section.cover .mask {
      display: none !important;
    }
    section.cover .cover-main {
      position: relative;
      z-index: 2;
      max-width: 700px;
    }
    section.cover .cover-main > p:last-child a {
      border-radius: 8px;
      padding: 10px 28px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    section.cover .cover-main > p:last-child a:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0,111,238,0.3);
    }
    section.cover img {
      width: 120px;
      border-radius: 16px;
    }

    /* ===== Language Switcher ===== */
    .lang-switcher {
      position: fixed;
      top: 12px;
      right: 80px;
      z-index: 100;
      display: flex;
      gap: 4px;
      background: var(--sidebar-background);
      border: 1px solid var(--sidebar-border-color);
      border-radius: 8px;
      padding: 3px;
      font-size: 13px;
    }
    .lang-switcher a {
      padding: 4px 10px;
      border-radius: 6px;
      text-decoration: none;
      color: var(--sidebar-nav-link-color);
      transition: all 0.15s ease;
    }
    .lang-switcher a.active {
      background: var(--theme-color);
      color: #fff;
    }
    .lang-switcher a:hover:not(.active) {
      background: var(--table-head-background);
    }

    /* ===== Dark Mode Toggle ===== */
    .theme-toggle {
      position: fixed;
      top: 12px;
      right: 16px;
      z-index: 100;
      background: var(--sidebar-background);
      border: 1px solid var(--sidebar-border-color);
      border-radius: 8px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      transition: all 0.15s ease;
    }
    .theme-toggle:hover {
      background: var(--table-head-background);
    }

    /* ===== Content Styling ===== */
    .markdown-section {
      max-width: 820px;
    }
    .markdown-section h1 {
      font-weight: 700;
      color: var(--heading-h1-color) !important;
      border-bottom: 2px solid var(--theme-color);
      padding-bottom: 8px;
    }
    .markdown-section h2 {
      font-weight: 600;
      color: var(--heading-h2-color) !important;
      margin-top: 2.5em;
    }
    .markdown-section h3 {
      font-weight: 600;
      color: var(--heading-h3-color) !important;
    }
    .markdown-section h4 {
      font-weight: 600;
      color: var(--heading-h4-color) !important;
    }
    .markdown-section p,
    .markdown-section li {
      color: var(--base-color);
    }
    .markdown-section strong {
      color: var(--heading-color);
    }
    .markdown-section a {
      color: var(--link-color) !important;
    }
    .markdown-section a:hover {
      color: var(--link-color--hover) !important;
    }
    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: collapse;
    }
    .markdown-section table th {
      font-weight: 600;
      text-align: left;
      background: var(--table-head-background);
      color: var(--table-head-color);
    }
    .markdown-section table td {
      color: var(--base-color);
    }
    .markdown-section table td,
    .markdown-section table th {
      padding: 10px 14px;
      border: 1px solid var(--table-cell-border-color);
    }
    .markdown-section table tr:nth-child(odd) td {
      background: var(--table-row-odd-background);
    }
    .markdown-section img {
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .markdown-section blockquote {
      color: var(--blockquote-color);
      border-left-color: var(--blockquote-border-color);
    }
    .markdown-section code {
      background: var(--code-inline-background) !important;
      color: var(--code-inline-color) !important;
    }
    .markdown-section pre code {
      background: var(--code-block-background) !important;
      color: var(--code-block-color) !important;
    }

    /* Alert/callout boxes */
    .markdown-section .tip,
    .markdown-section .warn,
    .markdown-section .note {
      border-radius: 8px;
      padding: 16px 20px;
    }

    /* Flexible alerts dark mode */
    html[data-theme="dark"] .markdown-section .alert {
      background-color: #111827;
      color: #ECEDEE;
    }
    html[data-theme="dark"] .markdown-section .alert p {
      color: #d1d5db;
    }

    /* Sidebar logo */
    .app-name-link img {
      max-width: 32px;
      vertical-align: middle;
      margin-right: 8px;
    }

    /* Dark mode: force sidebar and toggle colors */
    html[data-theme="dark"] .sidebar {
      background: #111827 !important;
      border-right-color: #1f2937 !important;
    }
    html[data-theme="dark"] .sidebar-toggle {
      background: #111827 !important;
    }
    html[data-theme="dark"] .search input {
      background: var(--search-input-background) !important;
      border-color: var(--search-input-border-color) !important;
      color: #ECEDEE !important;
    }
    html[data-theme="dark"] .search .matching-post {
      border-color: #1f2937 !important;
    }

    /* Sidebar top-level nav items — pointer cursor for collapsible sections */
    .sidebar-nav > ul > li > p {
      cursor: pointer;
    }

    /* GitHub corner — move to top-left to avoid overlap with lang/theme toggles */
    .github-corner {
      position: fixed !important;
      top: 0;
      right: auto !important;
      left: 0;
      z-index: 30;
    }
    .github-corner svg {
      transform: scaleX(-1);
    }

    /* ===== Mobile Responsive ===== */
    /* Use 767px to avoid conflict with Docsify's 768px sidebar breakpoint */
    @media (max-width: 767px) {
      /* Hide GitHub corner on mobile — it overlaps sidebar toggle and content */
      .github-corner {
        display: none !important;
      }

      /* Push content right to clear the sidebar toggle strip (32px wide) */
      section.content {
        padding-left: 40px !important;
        padding-right: 8px !important;
      }
      .markdown-section {
        padding: 0 8px !important;
        max-width: 100% !important;
        font-size: 15px;
      }

      /* Scale down headings for small screens */
      .markdown-section h1 {
        font-size: 1.6em;
        word-break: break-word;
      }
      .markdown-section h2 {
        font-size: 1.3em;
        margin-top: 1.8em;
      }
      .markdown-section h3 {
        font-size: 1.15em;
      }
      .markdown-section h4 {
        font-size: 1.05em;
      }

      /* Tables: horizontal scroll on overflow */
      .markdown-section table {
        display: block;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        width: 100%;
      }
      .markdown-section table th,
      .markdown-section table td {
        padding: 8px 10px;
        font-size: 14px;
        white-space: nowrap;
      }

      /* Code blocks: prevent overflow */
      .markdown-section pre {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        border-radius: 6px;
        padding: 12px !important;
        font-size: 13px;
      }
      .markdown-section code {
        word-break: break-word;
      }

      /* Images: constrain to viewport */
      .markdown-section img {
        max-width: 100%;
        height: auto;
      }

      /* Cover page refinements */
      section.cover {
        padding: 20px 16px !important;
      }
      section.cover .cover-main {
        max-width: 100%;
        padding: 0 8px;
      }
      section.cover .cover-main h1 {
        font-size: 2em !important;
      }
      section.cover img {
        width: 80px;
        border-radius: 12px;
      }
      section.cover .cover-main > p:last-child a {
        display: block;
        margin: 8px 0;
        text-align: center;
        padding: 12px 20px;
      }

      /* Lang switcher + theme toggle: bottom bar on mobile */
      .lang-switcher,
      .theme-toggle {
        position: fixed;
        top: auto;
        bottom: 16px;
        z-index: 100;
      }
      .lang-switcher {
        right: 16px;
        left: auto;
      }
      .theme-toggle {
        right: auto;
        left: 16px;
        padding: 6px 12px;
      }

      /* Alert/callout boxes: tighter padding */
      .markdown-section .tip,
      .markdown-section .warn,
      .markdown-section .note {
        padding: 12px 14px;
      }

      /* Blockquotes */
      .markdown-section blockquote {
        margin-left: 0;
        margin-right: 0;
        padding: 8px 14px;
      }

      /* Bottom padding so pagination clears the floating toggles */
      .docsify-pagination-container {
        margin-bottom: 56px !important;
      }
    }

    /* Tablet adjustments (768px = Docsify sidebar visible breakpoint) */
    @media (min-width: 768px) and (max-width: 1024px) {
      .markdown-section {
        max-width: 100%;
        padding-right: 24px !important;
      }
      .markdown-section h1 {
        font-size: 1.8em;
      }
    }
  </style>
</head>
<body>
  <div id="app">Laden...</div>

  <!-- Language Switcher -->
  <div class="lang-switcher" id="langSwitcher">
    <a href="#" data-lang="de" class="active">DE</a>
    <a href="#" data-lang="en">EN</a>
  </div>

  <!-- Dark Mode Toggle -->
  <button class="theme-toggle" id="themeToggle" type="button" title="Farbmodus wechseln" aria-label="Farbmodus wechseln" aria-pressed="false">🌙</button>

  <script>
    // ===== i18n: language detected from localStorage or browser =====
    var currentLang = (function() {
      var stored = localStorage.getItem('attraccess-docs-lang');
      if (stored === 'de' || stored === 'en') return stored;
      var browserLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
      return browserLang.startsWith('de') ? 'de' : 'en';
    })();
    localStorage.setItem('attraccess-docs-lang', currentLang);

    // Strip language prefix from hash if present (basePath handles language routing)
    (function() {
      var hash = window.location.hash || '';
      var match = hash.match(/^#\/(de|en)(\/.*)?$/);
      if (match) {
        currentLang = match[1];
        localStorage.setItem('attraccess-docs-lang', currentLang);
        var rest = match[2] || '/';
        window.location.replace(window.location.pathname + '#' + rest);
      }
    })();

    // ===== Dark Mode — set on html element so :root CSS variables work =====
    var savedTheme = localStorage.getItem('attraccess-docs-theme');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = savedTheme || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);

    // ===== Resolve base path: works at site root (GitHub Pages) and under /docs/ (Docker) =====
    var docsBase = (function() {
      var path = window.location.pathname;
      if (path.charAt(path.length - 1) !== '/') path += '/';
      return path;
    })();
    document.documentElement.style.setProperty('--cover-bg-image', "url('" + docsBase + "_media/login-wallpaper-blue.jpg')");

    // ===== Docsify Configuration =====
    window.$docsify = {
      name: '<img src="' + docsBase + '_media/logo.png" alt="Logo" width="28"> Attraccess',
      repo: 'https://github.com/Attraccess/Attraccess',
      homepage: 'home.md',
      loadSidebar: '_sidebar.md',
      loadNavbar: false,
      coverpage: 'coverpage.md',
      onlyCover: false,
      subMaxLevel: 3,
      auto2top: true,
      basePath: docsBase + currentLang + '/',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: currentLang === 'de' ? 'Suchen...' : 'Search...',
        noData: currentLang === 'de' ? 'Keine Ergebnisse' : 'No results',
        depth: 4,
        hideOtherSidebarContent: false,
        namespace: 'attraccess-docs-' + currentLang
      },
      pagination: {
        previousText: currentLang === 'de' ? 'Zurück' : 'Previous',
        nextText: currentLang === 'de' ? 'Weiter' : 'Next',
        crossChapter: true,
        crossChapterText: true
      },
      copyCode: {
        buttonText: currentLang === 'de' ? 'Kopieren' : 'Copy',
        errorText: currentLang === 'de' ? 'Fehler' : 'Error',
        successText: currentLang === 'de' ? 'Kopiert!' : 'Copied!'
      },
      themeable: {
        readyTransition: true,
        responsiveTables: true
      },
      tabs: {
        persist: true,
        sync: true,
        theme: 'classic'
      },
      routerMode: 'hash',
      plugins: [
        function(hook, vm) {
          hook.doneEach(function() {
            updateLangSwitcher();
          });
        }
      ]
    };

    // ===== Language Switching =====
    function updateLangSwitcher() {
      var links = document.querySelectorAll('.lang-switcher a');
      links.forEach(function(link) {
        link.classList.toggle('active', link.getAttribute('data-lang') === currentLang);
      });
    }
    updateLangSwitcher();

    document.getElementById('langSwitcher').addEventListener('click', function(e) {
      e.preventDefault();
      var langEl = e.target.closest ? e.target.closest('a[data-lang]') : e.target;
      var lang = langEl ? langEl.getAttribute('data-lang') : null;
      if (!lang || lang === currentLang) return;
      localStorage.setItem('attraccess-docs-lang', lang);
      window.location.reload();
    });

    // ===== Theme Toggle — set on html element =====
    var toggleBtn = document.getElementById('themeToggle');
    toggleBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
    toggleBtn.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
    toggleBtn.setAttribute('aria-label', currentLang === 'de' ? 'Farbmodus wechseln' : 'Toggle color mode');

    toggleBtn.addEventListener('click', function() {
      var current = document.documentElement.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('attraccess-docs-theme', next);
      toggleBtn.textContent = next === 'dark' ? '☀️' : '🌙';
      toggleBtn.setAttribute('aria-pressed', next === 'dark' ? 'true' : 'false');
    });
  </script>

  <!-- Docsify -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js" integrity="sha384-KaHhgnx/OTLoJ4J33SSJsF4x1pk4I7q3s5ZOfIDHJYl6IG7Oyn2vNDsHiWJe46fD" crossorigin="anonymous"></script>

  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js" integrity="sha384-LthJPBJ4RGco78kBY+EmKz5rmISZ5vrtAu3+l2ALQ2mrZHOe6Wyf6knyKjeC4cL6" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/zoom-image.min.js" integrity="sha384-fYBaBAsdPMjWt1AuA+txMoztHnl+zLgObSvwddIabbfUp+36gf/vNOKx88f37zix" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2.1.1/dist/docsify-copy-code.min.js" integrity="sha384-t4d9b4/0dEBkoJ5e77XEPBrqJ790jbFQFmEaTbBqIlTDeGosM1AbZvC1NQwqTg+5" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2.10.1/dist/docsify-pagination.min.js" integrity="sha384-uFEp18/1vv2dYlO64J2lOcnbhirAQZPtruqAZZ7PZYoXenm5c+tIs3AqSMjVMRe8" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1.5.2/dist/docsify-tabs.min.js" integrity="sha384-HDIipu8ms1FDLRotH7OldFKGJ9VBMz20a5b2xgQPSreYM7AGnFfRv3k9sKRgqRs5" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-plugin-flexible-alerts@1.1.1/dist/docsify-plugin-flexible-alerts.min.js" integrity="sha384-UwaoRTRxt1BoL/u+ucAgzz4PML/diz+5Jd69XmVMhl0pxqSUpm71h+4myV1gjm9h" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1.3.3/dist/docsify-sidebar-collapse.min.js" integrity="sha384-0QSd60AAYEZ+wryDHvqZ58jqMWuwUCbtfBsgg51Ks/1CjXMs1QJFk815X4w3nAbD" crossorigin="anonymous"></script>

  <!-- Syntax Highlighting -->
