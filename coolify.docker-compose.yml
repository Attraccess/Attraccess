# Coolify-ready production docker-compose for Attraccess.
# Uses Coolify magic env conventions: SERVICE_FQDN_*, SERVICE_URL_*,
# SERVICE_USER_*, SERVICE_PASSWORD_*, SERVICE_BASE64_*. See
# https://coolify.io/docs/knowledge-base/docker/compose for details.
#
# Stack: rabbitmq (AMQP+MQTT), zigbee2mqtt, attraccess, prometheus, grafana.

services:
  attraccess:
    image: ${ATTRACCESS_IMAGE:-ghcr.io/attraccess/attraccess:latest}
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_ATTRACCESS_3000
      - ATTRACCESS_URL=$SERVICE_FQDN_ATTRACCESS
      - ATTRACCESS_PUBLIC_INTERNET_URL=${ATTRACCESS_PUBLIC_INTERNET_URL:-$SERVICE_FQDN_ATTRACCESS}
      - AUTH_SESSION_SECRET=$SERVICE_BASE64_64_AUTHSESSION
      - LICENSE_KEY=${LICENSE_KEY}
      - TZ=${TZ:-UTC}
      - LOG_LEVELS=${LOG_LEVELS:-error,warn,log}
      - SMTP_SERVICE=${SMTP_SERVICE:-SMTP}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_SECURE=${SMTP_SECURE:-true}
    volumes:
      - attraccess-storage:/app/storage
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.3.0-management
    restart: unless-stopped
    hostname: rabbitmq
    command: '/bin/bash -c "rabbitmq-plugins enable --offline rabbitmq_mqtt rabbitmq_web_mqtt rabbitmq_amqp1_0; rabbitmq-server"'
    environment:
      - SERVICE_FQDN_RABBITMQ_15672
      - RABBITMQ_DEFAULT_USER=$SERVICE_USER_RABBITMQ
      - RABBITMQ_DEFAULT_PASS=$SERVICE_PASSWORD_RABBITMQ
      - RABBITMQ_HOST=%
    ports:
      - '${RABBITMQ_MQTT_PORT:-1883}:1883'
      - '${RABBITMQ_MQTT_WS_PORT:-15675}:15675'
      - '${RABBITMQ_AMQP_PORT:-5672}:5672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:2.10.1
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_ZIGBEE2MQTT_8080
      - TZ=${TZ:-UTC}
    volumes:
      - zigbee2mqtt-data:/app/data
      - /run/udev:/run/udev:ro
    depends_on:
      rabbitmq:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.11.3
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_PROMETHEUS_9090
    volumes:
      - prometheus-data:/prometheus
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}'
      - '--web.enable-lifecycle'
    depends_on:
      attraccess:
        condition: service_started

  grafana:
    image: grafana/grafana:13.0.1
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_GRAFANA_3000
      - GF_SERVER_ROOT_URL=$SERVICE_FQDN_GRAFANA
      - GF_SECURITY_ADMIN_USER=$SERVICE_USER_GRAFANA
      - GF_SECURITY_ADMIN_PASSWORD=$SERVICE_PASSWORD_GRAFANA
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  attraccess-storage:
  rabbitmq-data:
  zigbee2mqtt-data:
  prometheus-data:
  grafana-data:
