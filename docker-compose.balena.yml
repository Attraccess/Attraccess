version: '2.4'

services:
  proxy:
    image: 'jc21/nginx-proxy-manager:2.16.0'
    restart: unless-stopped
    ports:
      - '80:80' # HTTP
      - '81:81' # Proxy Manager Admin
      - '443:443' # HTTPS
      - '2883:1883' # MQTT
      - '8883:8883' # MQTT SSL
      - '8080:8080' # MQTT WS
      - '8081:8081' # MQTT WS SSL
    volumes:
      - proxy-data:/data
      - proxy-letsencrypt:/etc/letsencrypt
    environment:
      - INITIAL_ADMIN_EMAIL=admin@attraccess.org
      - INITIAL_ADMIN_PASSWORD=password
    env_file:
      - .env.docker-compose

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    expose:
      - '6379'
    volumes:
      - valkey-data:/data
    command: valkey-server --save 60 1 --loglevel warning
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3

  # PostgreSQL: the only database of Attraccess. Not published, only the other services of the app reach it.
  # Balena does not interpolate ${VAR} from device variables, so the credentials come from .env.docker-compose
  # (POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB and DATABASE_URL for the API). Set POSTGRES_PASSWORD and
  # DATABASE_URL (with the same password) as balena device variables (they override the file) BEFORE the first
  # start: the password is fixed when the data volume is initialised. The settings below suit small devices
  # (Raspberry Pi class, 1-2 GB RAM).
  postgres:
    image: 'postgres:18.6-alpine'
    restart: unless-stopped
    expose:
      - '5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    command:
      - postgres
      - '-c'
      - shared_buffers=64MB
      - '-c'
      - effective_cache_size=192MB
      - '-c'
      - work_mem=4MB
      - '-c'
      - maintenance_work_mem=32MB
      - '-c'
      - max_connections=50
      - '-c'
      - max_wal_size=512MB
      - '-c'
      - wal_compression=on
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    env_file:
      - .env.docker-compose

  attraccess:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - '3000'
    volumes:
      - attraccess-storage:/app/storage
      - backup-status:/backup-status:ro
    environment:
      - VALKEY_URL=redis://valkey:6379
    env_file:
      - .env.docker-compose
    # Attraccess only starts once the backup service reports its settings as present and valid (or BACKUP_DISABLED=true):
    # a device without backups must not go unnoticed. The backup service writes /backup-status/status after checking its
    # settings (not the target, so a boot without internet still starts) and removes it when it stops. Overriding the entrypoint drops the image's CMD, so the
    # command is repeated here. (No `$` on purpose: balena does not interpolate.)
    entrypoint: ['/bin/sh', '-c']
    command:
      - >
        while [ ! -s /backup-status/status ]; do
          echo 'attraccess: waiting for the backup service - backups are not set up. Configure BACKUP_REPOSITORY and BACKUP_PASSWORD, or set BACKUP_DISABLED=true (docs: installation/backup-restore).';
          sleep 30;
        done;
        if grep -qx disabled /backup-status/status; then echo 'attraccess: WARNING - backups are disabled (BACKUP_DISABLED=true).'; fi;
        exec /entrypoint.sh node dist/apps/api/main.js
    # Balena only supports the short-form depends_on (service_started); the
    # long-form `condition: service_healthy` is rejected (ATT-593-style). The app
    # retries the PostgreSQL and Valkey connections at startup, and
    # restart: unless-stopped covers startup races. The backup gate is the status file above.
    depends_on:
      - postgres
      - valkey
      - backup

  monitoring-init:
    build:
      context: .
      dockerfile: Dockerfile
    restart: 'no'
    entrypoint: ['/bin/sh', '-c']
    # PUSHOVER_API_TOKEN and PUSHOVER_USER_KEY must be set as balena device/fleet
    # variables (not service-specific) so balena auto-injects them into both
    # monitoring-init and grafana. Balena does not support ${VAR:-} syntax (ATT-593).
    #   balena env set PUSHOVER_API_TOKEN '<token>'   -d <uuid>
    #   balena env set PUSHOVER_USER_KEY  '<userkey>' -d <uuid>
    command:
      - >
        set -e &&
        if [ -f /app/share/monitoring/grafana/sync-managed-files.sh ]; then
          sh /app/share/monitoring/grafana/sync-managed-files.sh /app/share/monitoring/grafana/provisioning /grafana-provisioning /app/share/monitoring/grafana/dashboards /grafana-dashboards;
        else
          rm -rf /grafana-provisioning/* /grafana-provisioning/.[!.]* /grafana-provisioning/..?* /grafana-dashboards/* /grafana-dashboards/.[!.]* /grafana-dashboards/..?* 2>/dev/null || true;
          cp -rT /app/share/monitoring/grafana/provisioning /grafana-provisioning;
          cp -rT /app/share/monitoring/grafana/dashboards /grafana-dashboards;
        fi &&
        if [ -f /app/share/monitoring/grafana/prepare-provisioning.sh ]; then
          sh /app/share/monitoring/grafana/prepare-provisioning.sh /grafana-provisioning;
        fi
    volumes:
      - prometheus-config:/prometheus-config
      - grafana-provisioning:/grafana-provisioning
      - grafana-dashboards:/grafana-dashboards

  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    expose:
      - '8025'
      - '1025'
    env_file:
      - .env.docker-compose

  webhook-site:
    image: tarampampam/webhook-tester:2.3.0
    restart: unless-stopped
    expose:
      - '80'
    environment:
      - STORAGE_DRIVER=fs
      - FS_STORAGE_DIR=/storage
    volumes:
      - webhook-site:/storage
    env_file:
      - .env.docker-compose

  rabbitmq:
    image: rabbitmq:4.4.0-management
    hostname: rabbitmq
    restart: unless-stopped
    command: '/bin/bash -c "rabbitmq-plugins enable --offline rabbitmq_mqtt rabbitmq_web_mqtt rabbitmq_amqp1_0; rabbitmq-server"'
    expose:
      - '15672' # RabbitMQ Management UI
      - '5672' # RabbitMQ AMQP
      - '1883' # MQTT
      - '15675' # MQTT WebSocket
    ports:
      - '1883:1883' # MQTT direct (bypassing proxy)
      - '15675:15675' # MQTT WebSocket direct (bypassing proxy)
    environment:
      RABBITMQ_HOST: '%'
      RABBITMQ_DEFAULT_USER: attraccess
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - '-q'
        - ping
      retries: 3
      timeout: 5s
      interval: 30s

  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:2.14.3
    restart: unless-stopped
    expose:
      - '8080'
    volumes:
      - zigbee2mqtt:/app/data
    env_file:
      - .env.docker-compose

  hetzner-dns-updater:
    build:
      context: ./tools/hetzner-dns-updater
      dockerfile: Dockerfile
    restart: unless-stopped
    # Note: host networking is required to reliably read the machine's LAN IP on Linux hosts
    # Docker Desktop for Mac does not support host networking; if running on macOS, consider
    # passing the LAN IP via env var HETZNER_FORCE_IP or running this on a Linux host.
    network_mode: host
    #environment:
    #- HETZNER_DNS_UPDATER_ENABLED=${HETZNER_DNS_UPDATER_ENABLED}
    #- HETZNER_API_TOKEN=${HETZNER_API_TOKEN}
    #- HETZNER_ZONE_ID=${HETZNER_ZONE_ID}
    #- HETZNER_RECORD_NAME=${HETZNER_RECORD_NAME}
    #- HETZNER_TTL=${HETZNER_TTL:-300}
    #- HETZNER_FORCE_IP=${HETZNER_FORCE_IP}
    env_file:
      - .env.docker-compose

  config-ui:
    build:
      context: ./tools/config-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    # host networking + DNS_LISTEN_ADDRESS/bind-interfaces avoids the balenaOS host
    # dnsmasq port 53 conflict (127.0.0.2:53 / 10.114.102.1:53). Do NOT use `ports: 53:53`
    # in bridge mode — docker-proxy binds 0.0.0.0:53 and collides with host dnsmasq.
    network_mode: host
    expose:
      - 5380 # admin UI
      - 53/udp # DNS
      - 53/tcp # DNS
    volumes:
      - config-ui-data:/data
      - prometheus-config:/etc/prometheus
    env_file:
      - .env.docker-compose

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    expose:
      - '9100'
    # The backup service writes its metrics (backup.prom) into the backup-status volume; the textfile collector
    # publishes them for the backup alerts (BackupNotConfigured, BackupFailed, BackupTooOld, BackupsDisabled).
    command:
      - '--collector.textfile.directory=/backup-status'
    volumes:
      - backup-status:/backup-status:ro
    # io.balena.features.procfs/sysfs bind-mount the host OS /proc and /sys into
    # the container, giving node-exporter access to host CPU/RAM/network metrics
    # without privileged mode. Balena disallows arbitrary host bind mounts (e.g. /:/host),
    # so filesystem collector metrics are limited to what procfs/sysfs expose.
    labels:
      io.balena.features.procfs: '1'
      io.balena.features.sysfs: '1'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    restart: unless-stopped
    expose:
      - '8080'
    privileged: true
    # io.balena.features.balena-socket mounts the balena engine socket at both
    # /var/run/balena-engine.sock and /var/run/docker.sock (backwards-compat),
    # so cadvisor can discover and collect per-container metrics without config changes.
    # Balena disallows arbitrary host bind mounts (/:/rootfs, /dev/disk), so disk I/O
    # metrics come from procfs/sysfs only.
    labels:
      io.balena.features.procfs: '1'
      io.balena.features.sysfs: '1'
      io.balena.features.balena-socket: '1'

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    expose:
      - '9090'
    volumes:
      - prometheus-config:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on:
      - config-ui
      - monitoring-init
      - node-exporter
      - cadvisor
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    expose:
      - '3001'
    environment:
      # Balena does not support ${VAR:-default} syntax (ATT-593). Defaults are
      # hardcoded here; override by setting GF_SECURITY_ADMIN_USER /
      # GF_SECURITY_ADMIN_PASSWORD as balena device or fleet variables.
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=attraccess
      - GF_SERVER_HTTP_PORT=3001
      # PUSHOVER_API_TOKEN and PUSHOVER_USER_KEY are read from Balena device/fleet
      # variables (auto-injected) — set them at the device level, not service-
      # specific, so monitoring-init also sees them during provisioning setup.
    volumes:
      - grafana-provisioning:/etc/grafana/provisioning:ro
      - grafana-dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - monitoring-init

  grafana-contactpoints-cleanup:
    build:
      context: .
      dockerfile: Dockerfile
    restart: 'no'
    entrypoint: ['node', '/app/share/monitoring/grafana/cleanup-legacy-pushover.mjs']
    environment:
      - GRAFANA_URL=http://grafana:3001
      # Keep defaults/overrides consistent with the grafana service above.
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=attraccess
      # PUSHOVER_* are auto-injected from device/fleet variables (ATT-593).
    depends_on:
      - grafana

  # Scheduled restic backups of the database (pg_dump) and of the volumes below (docker/backup/README.md).
  # Without its settings this service exits with an error and the attraccess service does not start: set
  # BACKUP_REPOSITORY, BACKUP_PASSWORD and the target's credentials (e.g. AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) as
  # balena device variables, or BACKUP_DISABLED=true to run without backups on purpose. Optional: BACKUP_SCHEDULE
  # (cron, default '0 3 * * *'), BACKUP_KEEP_DAILY/WEEKLY/MONTHLY (7/4/6) and BACKUP_MAX_AGE_HOURS (30, BackupTooOld).
  # It writes backup.prom (metrics) to the backup-status volume; node-exporter publishes it for the Grafana backup alerts.
  # One repository per device: BACKUP_REPOSITORY as a fleet variable would share it; then set BACKUP_HOST per device.
  # Restore (stop the other services first): `docker compose run --rm backup restore [snapshot]`, on a balena device
  # `balena-engine exec -it <backup container> attraccess-backup restore [snapshot]`.
  # The volumes are mounted writable only because `restore` writes them back; a backup run only reads them.
  backup:
    build:
      context: ./docker/backup
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - backup-state:/var/lib/backup
      - backup-status:/var/lib/backup-status
      # mount volumes of all services that should be backed up
      - proxy-data:/external-storage/proxy/data
      - proxy-letsencrypt:/external-storage/proxy/letsencrypt
      - attraccess-storage:/external-storage/attraccess
      - webhook-site:/external-storage/webhook-site
      - rabbitmq_data:/external-storage/rabbitmq
      - zigbee2mqtt:/external-storage/zigbee2mqtt
      - prometheus-data:/external-storage/prometheus
      - grafana-data:/external-storage/grafana
      - config-ui-data:/external-storage/config-ui
    depends_on:
      - postgres
    env_file:
      - .env.docker-compose

volumes:
  postgres-data:
  backup-state:
  backup-status:
  proxy-data:
  proxy-letsencrypt:
  attraccess-storage:
  valkey-data:
  webhook-site:
  rabbitmq_data:
  zigbee2mqtt:
  config-ui-data:
  prometheus-config:
  prometheus-data:
  grafana-data:
  grafana-provisioning:
  grafana-dashboards:
