title: >-
  Do not embed secrets in frontend code or environment variable names exposed by
  Vite
rule: >-
  Avoid committing API keys, service role keys, database credentials, or other
  secrets into source files, React components, Vite environment variables, or
  any value prefixed with VITE_. Use only public, non-sensitive configuration in
  browser code and reference secret material through server-side or deployment
  configuration where possible.
severity: critical
scope: pull-request
path: '**/*'
examples:
  - snippet: >-
      const supabase = createClient(import.meta.env.VITE_SUPABASE_URL,
      import.meta.env.VITE_SUPABASE_SERVICE_ROLE_KEY);
    isCorrect: false
  - snippet: >-
      const supabase = createClient(import.meta.env.VITE_SUPABASE_URL,
      import.meta.env.VITE_SUPABASE_ANON_KEY);
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
