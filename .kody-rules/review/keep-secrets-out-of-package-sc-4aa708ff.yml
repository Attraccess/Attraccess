title: Keep secrets out of package scripts and committed config
rule: >-
  Do not hardcode API keys, tokens, passwords, or other secrets in package.json
  scripts, source files, or committed configuration. Load runtime secrets from
  environment variables or an uncommitted `.env` file, and ensure `.env` is
  ignored by version control.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      {
        "scripts": {
          "start": "API_KEY=sk_live_123 node dist/index.js"
        }
      }
    isCorrect: false
  - snippet: |-
      {
        "scripts": {
          "start": "node --env-file=.env dist/index.js"
        }
      }
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
