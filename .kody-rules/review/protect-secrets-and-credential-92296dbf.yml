title: Protect secrets and credentials in OpenHands code and configuration
rule: >-
  Never hard-code API keys, tokens, passwords, JWT secrets, database
  credentials, cloud credentials, or webhook secrets in Python source, TOML,
  YAML, JSON, or environment files. Load secrets only from environment
  variables, secret managers, or runtime-provided configuration. Do not log,
  include in error messages, or serialize secrets into traces, responses, or
  test fixtures.
severity: critical
scope: pull-request
path: '**/*'
examples:
  - snippet: |-
      import os

      OPENAI_API_KEY = os.environ['OPENAI_API_KEY']
      JWT_SECRET = os.environ['JWT_SECRET']
    isCorrect: true
  - snippet: |-
      OPENAI_API_KEY = 'sk-1234567890abcdef'
      JWT_SECRET = 'super-secret-value'
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
