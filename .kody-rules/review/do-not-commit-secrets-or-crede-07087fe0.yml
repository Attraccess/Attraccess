title: Do not commit secrets or credentials in code or configuration
rule: >-
  Never hardcode API keys, tokens, passwords, private keys, or other credentials
  in source files, generated clients, examples, or configuration. Load secrets
  only from environment variables or external secret managers, and ensure
  generated Swagger/Axios client code does not embed authorization values
  directly.
severity: critical
scope: pull-request
path: '**/*'
examples:
  - snippet: |-
      const client = createClient({
        baseURL: 'https://api.example.com',
        headers: { Authorization: `Bearer ${process.env.API_TOKEN}` }
      });
    isCorrect: true
  - snippet: |-
      const client = createClient({
        baseURL: 'https://api.example.com',
        headers: { Authorization: 'Bearer sk_live_1234567890abcdef' }
      });
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
