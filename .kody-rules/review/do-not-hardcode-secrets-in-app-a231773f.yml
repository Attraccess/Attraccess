title: Do not hardcode secrets in application code or frontend bundles
rule: >-
  Secrets such as JWT signing keys, session secrets, database credentials, SMTP
  credentials, OAuth/OpenID client secrets, WebAuthn secrets, web-push keys, and
  API tokens must be read from environment configuration or a secret manager,
  not hardcoded in source files. In NestJS, prefer @nestjs/config and typed
  configuration validation. In frontend code, only expose non-secret public
  configuration values.
severity: critical
scope: pull-request
path: '**/*'
examples:
  - snippet: |-
      JwtModule.register({
        secret: 'super-secret-jwt-key',
        signOptions: { expiresIn: '1h' },
      })
    isCorrect: false
  - snippet: |-
      JwtModule.register({
        secret: configService.getOrThrow('JWT_SECRET'),
        signOptions: { expiresIn: '1h' },
      })
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
