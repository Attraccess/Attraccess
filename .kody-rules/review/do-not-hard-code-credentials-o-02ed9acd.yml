title: Do not hard-code credentials or environment-specific secrets in tests or utils
rule: >-
  Integration tests and shared utilities must read credentials, tokens, API
  keys, and connection strings from environment variables or a local secrets
  file excluded from version control. Never commit literal secrets, production
  endpoints with embedded credentials, or test accounts with broad permissions
  into repository code.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      import os

      API_TOKEN = os.environ["API_TOKEN"]
      BASE_URL = os.environ.get("API_BASE_URL", "http://localhost:8080")
    isCorrect: true
  - snippet: |-
      API_TOKEN = "sk-live-1234567890abcdef"
      BASE_URL = "https://admin:password@api.internal.example.com"
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
