title: Do not embed secrets or runtime credentials in frontend code
rule: >-
  Because this is a Vite/TypeScript frontend, never commit API keys, tokens,
  passwords, webhook signatures, or private URLs into source code, `.env` files,
  Vite config, or sample data. Use runtime configuration or server-side proxies
  for privileged credentials, and avoid logging credentials or tokens.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: const apiUrl = import.meta.env.VITE_PUBLIC_API_URL;
    isCorrect: true
  - snippet: const LINEAR_API_KEY = "lin_api_1234567890abcdef";
    isCorrect: false
  - snippet: console.log("auth token:", accessToken);
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
