title: Do not embed secrets or SDK credentials in Vite client code
rule: >-
  Because this is a Vite + React frontend, any value exposed through
  import.meta.env.VITE_* or hard-coded in src/ is shipped to the browser. Never
  place API keys, device pairing secrets, tokens, or private endpoints for
  @evenrealities/even_hub_sdk in client-side code. Use un-prefixed environment
  variables only for local build-time configuration that is safe to expose, or
  route sensitive operations through a trusted backend/service.
severity: critical
scope: pull-request
path: '**/*'
examples:
  - snippet: >-
      const client = createHubClient({ apiKey: import.meta.env.VITE_EVEN_API_KEY
      });
    isCorrect: false
  - snippet: |-
      const HUB_TOKEN = "sk_live_123456";
      export const hub = connectHub(HUB_TOKEN);
    isCorrect: false
  - snippet: |-
      const hubUrl = import.meta.env.VITE_PUBLIC_HUB_URL;
      export const hub = connectHub(hubUrl);
    isCorrect: true
  - snippet: |-
      async function pairDevice() {
        const res = await fetch("/api/hub/pair", { method: "POST" });
        return res.json();
      }
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
