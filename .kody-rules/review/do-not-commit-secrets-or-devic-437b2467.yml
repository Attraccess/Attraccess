title: Do not commit secrets or device credentials in client-side code
rule: >-
  Because this is a Vite/React browser application, never hardcode API keys,
  tokens, passwords, private keys, or device/hub credentials in source files,
  Vite config, or committed environment files. Use only public, build-time
  environment variables prefixed with `VITE_` for non-secret configuration, and
  validate that secret-looking values are not embedded in the bundle or
  repository.
severity: critical
scope: pull-request
path: '**/*'
examples:
  - snippet: |-
      const apiUrl = import.meta.env.VITE_PUBLIC_API_URL;

      if (!apiUrl) {
        throw new Error("VITE_PUBLIC_API_URL is not defined");
      }
    isCorrect: true
  - snippet: |-
      const HUB_TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...";
      await connectHub(HUB_TOKEN);
    isCorrect: false
  - snippet: |-
      define: {
        "process.env.DEVICE_SECRET": JSON.stringify(process.env.DEVICE_SECRET)
      }
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
