title: Do not log or persist secrets from Strapi configuration
rule: >-
  This plugin may read Strapi configuration or schema metadata. Never log,
  include in generated files, or otherwise persist secrets such as API tokens,
  database credentials, JWT secrets, admin tokens, or environment variables. If
  configuration values are needed for code generation, explicitly filter
  sensitive keys and redact values in errors and logs.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: console.log('Strapi config:', strapi.config);
    isCorrect: false
  - snippet: >-
      const publicSchema = sanitizeSchema(schema, { omit: ['secret', 'token',
      'password'] });

      console.log('Generating types for schema:',
      publicSchema.info?.singularName);
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
