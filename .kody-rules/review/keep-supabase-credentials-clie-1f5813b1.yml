title: Keep Supabase credentials client-safe and out of source
rule: >-
  Supabase configuration may only use Vite environment variables
  (`import.meta.env.VITE_SUPABASE_URL` and `VITE_SUPABASE_ANON_KEY`). Never
  hardcode URLs, keys, tokens, or service-role secrets in source, and never
  import or expose server-only Supabase credentials in browser code.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      export const supabase = createClient(
        import.meta.env.VITE_SUPABASE_URL,
        import.meta.env.VITE_SUPABASE_ANON_KEY
      );
    isCorrect: true
  - snippet: |-
      export const supabase = createClient(
        'https://project.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      );
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
