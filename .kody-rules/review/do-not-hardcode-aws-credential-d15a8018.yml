title: Do not hardcode AWS credentials or secret values in CDKTF or application code
rule: >-
  AWS credentials, DynamoDB secret values, tokens, API keys, and other sensitive
  configuration must not be hardcoded in TypeScript/JavaScript source or CDKTF
  infrastructure definitions. Use runtime environment variables, AWS Secrets
  Manager, SSM Parameter Store, or IAM roles instead. This is especially
  important in CDKTF stacks where provider configuration can accidentally embed
  credentials or create overly permissive IAM policies.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      const provider = new AwsProvider(this, 'aws', {
        region: 'eu-central-1',
        accessKey: 'AKIAEXAMPLE',
        secretKey: 'secret123',
      });
    isCorrect: false
  - snippet: const apiKey = 'sk-live-1234567890abcdef';
    isCorrect: false
  - snippet: |-
      const provider = new AwsProvider(this, 'aws', {
        region: process.env.AWS_REGION,
      });
    isCorrect: true
  - snippet: const apiKey = process.env.API_KEY;
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
