title: Keep credentials out of code and logs
rule: >-
  Read FTP credentials, API keys, and other secrets only from environment
  variables. Never hardcode secrets, and never log full credentials, connection
  strings, or raw request/response bodies that may contain them. When logging
  FTP or job errors, include only non-sensitive context such as operation, host,
  and sanitized file name.
severity: critical
scope: pull-request
path: '**/*'
examples:
  - snippet: |-
      const ftpConfig = {
        host: process.env.FTP_HOST,
        user: process.env.FTP_USER,
        password: process.env.FTP_PASSWORD,
      };

      logger.info({ host: ftpConfig.host }, "Connecting to printer FTP");
    isCorrect: true
  - snippet: |-
      const ftpConfig = {
        host: "printer.local",
        user: "admin",
        password: "hunter2",
      };

      console.log("FTP config:", ftpConfig);
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
