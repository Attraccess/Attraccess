title: Prevent logging secrets or full webhook payloads
rule: >-
  When logging requests, errors, or outbound webhook deliveries, never log
  environment variables, authorization headers, tokens, signatures, or full raw
  request/response bodies. Log only non-sensitive metadata such as event type,
  id, status code, timestamp, and error message. If a payload must be logged for
  debugging, redact sensitive fields first.
severity: high
scope: pull-request
path: '**/*'
examples:
  - snippet: >-
      console.log('Webhook received', ctx.request.headers.authorization,
      ctx.request.body);
    isCorrect: false
  - snippet: >-
      console.log('Webhook received', { eventType: ctx.request.body?.type,
      eventId: ctx.request.body?.id });
    isCorrect: true
  - snippet: >-
      console.log('Outbound request', { url: targetUrl, headers:
      axiosConfig.headers });
    isCorrect: false
  - snippet: >-
      console.log('Outbound request', { url: targetUrl, status: response.status
      });
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
