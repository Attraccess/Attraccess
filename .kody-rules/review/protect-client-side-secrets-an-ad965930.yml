title: Protect client-side secrets and validate input with Zod
rule: >-
  Do not embed secret keys, tokens, or credentials in frontend code or in any
  Vite-exposed environment variable (VITE_*). Use Zod schemas to validate and
  parse all external input, including form values, route parameters, and API
  responses before use.
severity: critical
scope: pull-request
path: '**/*'
examples:
  - snippet: const apiKey = import.meta.env.VITE_SECRET_API_KEY;
    isCorrect: false
  - snippet: >-
      const UserSchema = z.object({ id: z.string(), email: z.string().email()
      });

      const response = await fetch('/api/user');

      const user = UserSchema.parse(await response.json());
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
