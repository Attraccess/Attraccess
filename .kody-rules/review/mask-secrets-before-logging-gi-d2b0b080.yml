title: Mask secrets before logging GitHub Action inputs or API responses
rule: >-
  Never log raw GitHub tokens, Authorization headers, or action inputs that may
  contain secrets. Use @actions/core's setSecret() to mask sensitive values
  before any logging, and avoid logging full API request/response objects that
  may include tokens.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      import * as core from '@actions/core';

      const token = core.getInput('token', { required: true });
      core.setSecret(token);
      core.info(`Token length: ${token.length}`);
    isCorrect: true
  - snippet: |-
      import * as core from '@actions/core';

      const token = core.getInput('token', { required: true });
      core.info(`Using token: ${token}`);
    isCorrect: false
  - snippet: |-
      import * as core from '@actions/core';

      const token = core.getInput('token', { required: true });
      core.setSecret(token);
      // Log sanitized context only
      core.info('Token configured successfully');
    isCorrect: true
  - snippet: console.log('API response:', JSON.stringify(octokitResponse));
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
