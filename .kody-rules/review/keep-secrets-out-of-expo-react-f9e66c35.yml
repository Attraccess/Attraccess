title: Keep secrets out of Expo/React Native client code
rule: >-
  Do not embed API secret keys, private keys, signing secrets, database
  credentials, or service-account credentials in app code, Expo config, or
  environment variables bundled into the client. Use only public identifiers for
  third-party services, and route privileged calls through a backend. If local
  sensitive values are needed on device, store them with expo-secure-store
  rather than AsyncStorage or plain storage.
severity: critical
scope: pull-request
path: '**/*'
examples:
  - snippet: |-
      const STRIPE_SECRET_KEY = "sk_live_1234567890";

      export async function createPayment() {
        const res = await fetch("https://api.example.com/pay", {
          headers: { Authorization: `Bearer ${STRIPE_SECRET_KEY}` },
        });
        return res.json();
      }
    isCorrect: false
  - snippet: |-
      import * as SecureStore from "expo-secure-store";

      export async function getDeviceToken() {
        return SecureStore.getItemAsync("userToken");
      }
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
