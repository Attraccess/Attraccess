title: Prevent secrets and credentials in MCP server logs and error responses
rule: >-
  This repository implements a Playwright-based MCP server that may expose
  browser automation over HTTP/SSE. Do not log, serialize, or return environment
  variables, API keys, tokens, cookies, authorization headers, or browser
  session credentials in server logs, MCP tool results, stack traces, or HTTP
  error bodies. Redact sensitive fields before logging and return generic error
  messages to clients while preserving detailed diagnostics server-side only.
severity: critical
scope: pull-request
path: '**/*'
examples:
  - snippet: >-
      console.log('Starting MCP server with config', { apiKey:
      process.env.API_KEY, token });
    isCorrect: false
  - snippet: >-
      console.log('Starting MCP server', { hasApiKey:
      Boolean(process.env.API_KEY) });
    isCorrect: true
  - snippet: >-
      res.status(500).json({ error: error.message, stack: error.stack, env:
      process.env });
    isCorrect: false
  - snippet: |-
      logger.error('Request failed', { requestId, error: error.message });
      res.status(500).json({ error: 'Internal server error' });
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
