title: >-
  Block secret-bearing environment variables from Backstage runtime and app
  config
rule: >-
  Do not embed secrets, tokens, or credentials in app-config*.yaml, TypeScript
  config files, or frontend-visible environment variables. Only explicitly
  allowed non-secret variables may be exposed to the app via
  BACKSTAGE_FRONTEND_ENV_VARS or process.env; all other credentials must remain
  server-side or supplied through secure secret management.
severity: critical
scope: pull-request
path: '**/*'
examples:
  - snippet: |-
      app:
        baseUrl: http://localhost:3000
      backend:
        database:
          password: ${DB_PASSWORD}
    isCorrect: true
  - snippet: |-
      app:
        baseUrl: http://localhost:3000
      backend:
        database:
          password: hunter2
    isCorrect: false
  - snippet: |-
      export const config = {
        githubToken: process.env.GITHUB_TOKEN,
      };
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
