title: Validate all external input with Zod at boundaries
rule: >-
  Use Zod schemas to parse and validate data from network responses, URL
  parameters, localStorage, and user-submitted forms before consuming it. Do not
  cast untrusted JSON with `as` or assume response shapes. In React Hook Form,
  always pair forms with a Zod resolver.
severity: high
scope: pull-request
path: '**/*'
examples:
  - snippet: >-
      const userSchema = z.object({ id: z.string(), email: z.string().email()
      });

      const response = await fetch('/api/user');

      const data = userSchema.parse(await response.json());
    isCorrect: true
  - snippet: |-
      const response = await fetch('/api/user');
      const data = await response.json() as User;
    isCorrect: false
  - snippet: |-
      const form = useForm<z.infer<typeof loginSchema>>({
        resolver: zodResolver(loginSchema),
      });
    isCorrect: true
  - snippet: |-
      const form = useForm({
        defaultValues: { email: '', password: '' },
      });
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
