title: Avoid logging secrets or raw device credentials
rule: >-
  Do not log MQTT credentials, HomeKit pairing codes, API keys, or full device
  responses that may contain tokens. Use structured logs with redaction or log
  only non-sensitive identifiers and status codes.
severity: medium
scope: file
path: '**/*'
examples:
  - snippet: this.log.debug('MQTT config:', JSON.stringify(config));
    isCorrect: false
  - snippet: this.log.debug(`MQTT connected to ${config.host}`);
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
