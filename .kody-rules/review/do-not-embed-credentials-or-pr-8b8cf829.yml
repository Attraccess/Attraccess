title: Do not embed credentials or private indexes in dependency files
rule: >-
  Python dependency manifests and pip configuration must not contain
  credentials, tokens, private hostnames, or internal index URLs. Use
  environment-specific configuration or secret management instead so dependency
  files can be safely committed.
severity: high
scope: file
path: '**/*'
examples:
  - snippet: |
      --index-url https://pypi.org/simple
    isCorrect: true
  - snippet: |
      --index-url https://user:token@private.pypi.example/simple
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
