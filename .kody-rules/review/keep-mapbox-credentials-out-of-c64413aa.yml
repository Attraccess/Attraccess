title: Keep Mapbox credentials out of client-side code
rule: >-
  Mapbox access tokens are embedded in frontend bundles when referenced
  directly. Load Mapbox credentials only from Vite environment variables and
  ensure they are prefixed with VITE_ so they are intentionally exposed, or
  proxy map requests through a server-side token holder. Never hardcode tokens
  in source files, components, or Vite config.
severity: critical
scope: pull-request
path: '**/*'
examples:
  - snippet: 'const map = new mapboxgl.Map({ accessToken: ''pk.eyJ1IjoiZXhhbXBsZ...'' });'
    isCorrect: false
  - snippet: >-
      const map = new mapboxgl.Map({ accessToken:
      import.meta.env.VITE_MAPBOX_TOKEN });
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
