title: Keep secrets and credentials out of gateway configuration and examples
rule: >-
  Do not hard-code JWT secrets, API keys, tokens, certificates, or credentials
  in source files, examples, benchmarks, or tests. Load secrets from environment
  variables or a secret manager, and ensure example configs use non-production
  placeholder values only.
severity: critical
scope: pull-request
path: '**/*'
examples:
  - snippet: |-
      const jwtSecret = process.env.JWT_SECRET;
      if (!jwtSecret) {
        throw new Error("JWT_SECRET environment variable is required");
      }
    isCorrect: true
  - snippet: const jwtSecret = "super-secret-production-key-123";
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
