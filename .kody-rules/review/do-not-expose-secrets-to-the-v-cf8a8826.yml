title: Do not expose secrets to the Vite browser bundle or client code
rule: >-
  Server-only secrets must be read from process.env in server code and never
  imported into React/Vite client code. Only variables explicitly prefixed with
  VITE_ are exposed to the browser; never name secrets with VITE_, and never
  embed API keys, tokens, or credentials in frontend source, PWA config, or
  static assets.
severity: critical
scope: pull-request
path: '**/*'
examples:
  - snippet: |-
      // server/index.js
      const apiKey = process.env.TASKBOT_API_KEY;
      if (!apiKey) {
        throw new Error('TASKBOT_API_KEY is required');
      }
    isCorrect: true
  - snippet: |-
      // src/api.js
      const apiKey = import.meta.env.VITE_OPENAI_API_KEY;

      export async function completeTask(prompt) {
        return fetch('/api/complete', {
          headers: { Authorization: `Bearer ${apiKey}` }
        });
      }
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
