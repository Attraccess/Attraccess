title: Keep authentication secrets out of source code
rule: >-
  JWT secrets, session secrets, SAML/OIDC credentials, WebAuthn RP configuration
  secrets, mail credentials, and database credentials must be loaded from
  environment configuration only. Never hardcode secrets in
  TypeScript/JavaScript source, fixtures, or committed configuration files.
severity: critical
scope: pull-request
path: '**/*'
examples:
  - snippet: |-
      JwtModule.registerAsync({
        useFactory: (config: ConfigService) => ({
          secret: config.getOrThrow('JWT_SECRET'),
          signOptions: { expiresIn: config.getOrThrow('JWT_EXPIRES_IN') },
        }),
        inject: [ConfigService],
      })
    isCorrect: true
  - snippet: |-
      JwtModule.register({
        secret: 'super-secret-key',
        signOptions: { expiresIn: '1h' },
      })
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
