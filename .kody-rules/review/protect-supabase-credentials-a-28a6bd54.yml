title: Protect Supabase credentials and enforce RLS-safe client usage
rule: >-
  Only expose the Supabase URL and anon/public key in client code via explicitly
  public Vite env vars. Never place service_role keys, JWT secrets, database
  passwords, or other privileged credentials in frontend bundles, source files,
  Storybook config, or test fixtures. When using @supabase/supabase-js in
  browser apps, construct the client from import.meta.env.VITE_SUPABASE_URL and
  import.meta.env.VITE_SUPABASE_ANON_KEY only, and rely on Postgres RLS rather
  than client-side privilege escalation.
severity: critical
scope: pull-request
path: '**/*'
examples:
  - snippet: |-
      import { createClient } from '@supabase/supabase-js';

      export const supabase = createClient(
        import.meta.env.VITE_SUPABASE_URL,
        import.meta.env.VITE_SUPABASE_ANON_KEY
      );
    isCorrect: true
  - snippet: |-
      import { createClient } from '@supabase/supabase-js';

      export const supabase = createClient(
        'https://xyzcompany.supabase.co',
        process.env.SUPABASE_SERVICE_ROLE_KEY
      );
    isCorrect: false
  - snippet: |-
      VITE_SUPABASE_URL=https://xyzcompany.supabase.co
      VITE_SUPABASE_ANON_KEY=public-anon-key
      SUPABASE_SERVICE_ROLE_KEY=secret-service-role-key
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
