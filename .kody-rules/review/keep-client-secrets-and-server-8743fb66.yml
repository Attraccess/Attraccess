title: Keep client secrets and server-only values out of browser-facing Vue code
rule: >-
  In this Vue CLI app, only variables prefixed with VUE_APP_ are injected into
  the client bundle, and anything placed in client-side code becomes publicly
  extractable. Do not put API keys, tokens, credentials, or other sensitive
  server-only values in VUE_APP_ variables, .env files consumed by the browser
  bundle, Vuex state, component data, or plain client modules. If a value must
  remain secret, route the call through the Express server or a backend proxy
  instead.
severity: critical
scope: pull-request
path: '**/*'
examples:
  - snippet: |-
      // src/store/api.ts
      export const API_KEY = process.env.VUE_APP_INTERNAL_API_KEY;
      axios.defaults.headers.common['X-Api-Key'] = API_KEY;
    isCorrect: false
  - snippet: |-
      // src/store/api.ts
      // No secret in the client bundle; the server proxies authenticated calls.
      export function fetchBuilds() {
        return axios.get('/api/builds');
      }
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
