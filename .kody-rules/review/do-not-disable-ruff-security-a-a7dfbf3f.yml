title: Do not disable Ruff security and bugbear lint rules
rule: >-
  Ruff is configured to enforce bugbear and related correctness rules. Do not
  add global ignores, per-file ignores, noqa comments, or configuration changes
  that disable B, F, or S-family lint checks outside narrowly scoped test or
  generated-file exceptions.
severity: medium
scope: pull-request
path: '**/*'
examples:
  - snippet: |-
      [tool.ruff.lint]
      ignore = ["B", "F"]
    isCorrect: false
  - snippet: |-
      [tool.ruff.lint.per-file-ignores]
      "**/*.py" = ["B"]
    isCorrect: false
  - snippet: |-
      [tool.ruff.lint]
      select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
