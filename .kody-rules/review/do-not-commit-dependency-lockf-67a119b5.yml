title: Do not commit dependency lockfile noise without dependency changes
rule: >-
  Avoid adding or modifying yarn.lock, package-lock.json, or similar dependency
  manifests unless an actual dependency declaration changes. For this
  repository, the lockfile should remain empty or unchanged unless package.json
  dependencies are introduced.
severity: low
scope: pull-request
path: '**/*'
examples:
  - snippet: |
      # THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
      # yarn lockfile v1
    isCorrect: true
  - snippet: |
      # THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
      # yarn lockfile v1

      left-pad@^1.3.0:
        version "1.3.0"
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
