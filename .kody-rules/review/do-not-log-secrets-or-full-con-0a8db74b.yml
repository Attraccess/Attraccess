title: Do not log secrets or full config objects
rule: >-
  When logging configuration or connection details, never log tokens, passwords,
  API keys, or entire config objects. Log only non-sensitive identifiers or
  redacted summaries.
severity: medium
scope: file
path: '**/*'
examples:
  - snippet: this.log.info('Loaded config:', JSON.stringify(config));
    isCorrect: false
  - snippet: >-
      this.log.info(`Connecting to ${config.host} as user
      '${config.username}'`);
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
