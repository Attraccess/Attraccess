title: Do not commit hardcoded secrets in scripts or runtime configuration
rule: >-
  Scripts, apps, and packages in this repository may run desktop, web, and mock
  server processes. Do not commit hardcoded API keys, tokens, passwords, signing
  secrets, database credentials, or update-server credentials. Load runtime
  secrets from environment variables, local env files excluded from version
  control, or platform secret storage. Mock or development-only placeholders
  must be clearly marked and must not resemble production credentials.
severity: critical
scope: pull-request
path: '**/*'
examples:
  - snippet: const updateServerToken = process.env.UPDATE_SERVER_TOKEN;
    isCorrect: true
  - snippet: const updateServerToken = "sk_live_9f8a7b6c5d4e3f2a1b0c";
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
