title: Keep generated API clients and build out of source control
rule: >-
  Generated artifacts such as OpenAPI clients, TypeScript build output, coverage
  reports, bundle outputs, and temporary service files must not be committed. If
  a file is produced by code generation, build tooling, or test coverage, it
  should be ignored and regenerated from source manifests instead of edited
  manually.
severity: medium
scope: pull-request
path: '**/*'
examples:
  - snippet: |-
      // Manually edited generated OpenAPI client file
      export interface ApiUser {
        id: string;
        email: string;
        customField?: string;
      }
    isCorrect: false
  - snippet: >-
      // Generated by swagger-typescript-api or openapi codegen; do not edit
      manually

      export interface ApiUser {
        id: string;
        email: string;
      }
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
