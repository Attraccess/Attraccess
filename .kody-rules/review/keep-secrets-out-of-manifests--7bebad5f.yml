title: >-
  Keep secrets out of manifests, source code, and browser-accessible
  configuration
rule: >-
  Do not commit API keys, tokens, passwords, signing credentials, webhook
  secrets, database URLs, or other sensitive values into package.json, workspace
  manifests, source files, Vite/extension configuration, test fixtures, or
  sample data. Secrets must be loaded from environment variables or a secret
  manager at runtime. For browser extension and frontend builds, only
  non-sensitive public configuration may be exposed through import.meta.env or
  manifest fields; anything secret must remain server-side and never be bundled
  into extension assets or client JavaScript.
severity: critical
scope: pull-request
path: '**/*'
examples:
  - snippet: >-
      const wsClient = new
      WebSocket('wss://controller.local?token=eyJhbGciOiJIUzI1NiJ9.secret-token');
    isCorrect: false
  - snippet: |-
      const controllerUrl = import.meta.env.VITE_CONTROLLER_URL;

      if (!controllerUrl) {
        throw new Error('VITE_CONTROLLER_URL is not configured');
      }

      const wsClient = new WebSocket(controllerUrl);
    isCorrect: true
  - snippet: |-
      {
        "name": "@jappyjan/powerslides",
        "config": {
          "serviceToken": "sk_live_51N8exampleSecret"
        }
      }
    isCorrect: false
  - snippet: |-
      const serviceToken = process.env.POWERSLIDES_SERVICE_TOKEN;

      if (!serviceToken) {
        throw new Error('POWERSLIDES_SERVICE_TOKEN is required');
      }
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
