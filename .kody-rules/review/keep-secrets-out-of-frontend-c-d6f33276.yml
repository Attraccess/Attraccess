title: Keep secrets out of frontend code and Vite env exposure
rule: >-
  Never place API secret keys, service account credentials, JWT signing secrets,
  database URLs, or other server-only secrets in source files, Vite environment
  variables, localStorage, sessionStorage, or client-side configuration. Vite
  exposes all VITE_* variables to the browser bundle. Use public identifiers
  only and route privileged operations through a backend API.
severity: critical
scope: pull-request
path: '**/*'
examples:
  - snippet: |-
      const envSchema = z.object({
        VITE_API_URL: z.string().url(),
        VITE_STRIPE_PUBLISHABLE_KEY: z.string().startsWith('pk_'),
      });
    isCorrect: true
  - snippet: |-
      const envSchema = z.object({
        VITE_API_URL: z.string().url(),
        VITE_STRIPE_SECRET_KEY: z.string().startsWith('sk_'),
      });
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
