title: Never expose secrets through Vite environment variables
rule: >-
  Only variables prefixed with `VITE_` are embedded into the client bundle.
  Treat every `VITE_` value as public. Do not store API secret keys, private
  tokens, database URLs, or signing secrets in `.env` variables that are exposed
  to the browser. Use a backend or serverless proxy for privileged operations.
severity: critical
scope: pull-request
path: '**/*'
examples:
  - snippet: |-
      VITE_PUBLIC_API_URL=https://api.example.com
      VITE_STRIPE_PUBLISHABLE_KEY=pk_test_...
    isCorrect: true
  - snippet: |-
      VITE_STRIPE_SECRET_KEY=sk_live_...
      VITE_DATABASE_URL=postgres://admin:password@db.internal
    isCorrect: false
  - snippet: const apiUrl = import.meta.env.VITE_PUBLIC_API_URL;
    isCorrect: true
  - snippet: const secret = import.meta.env.VITE_INTERNAL_SECRET;
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
