title: Keep secrets out of Vite, Storybook, and build-time configuration
rule: >-
  Do not read or embed secret values in Vite config, Storybook config,
  PostCSS/Tailwind config, Nx target options, or package scripts unless they are
  explicitly required public, non-sensitive settings. Build-time configuration
  may reference environment variables, but it must not inline tokens, API keys,
  database URLs with credentials, webhook secrets, or private registry auth
  values. Use local untracked .env files for development secrets and keep only
  public VITE_-prefixed variables in client-facing configuration.
severity: high
scope: pull-request
path: '**/*'
examples:
  - snippet: |-
      import { defineConfig } from 'vite';

      export default defineConfig({
        define: {
          __APP_ENV__: JSON.stringify(process.env.APP_ENV ?? 'development'),
        },
      });
    isCorrect: true
  - snippet: |-
      import { defineConfig } from 'vite';

      export default defineConfig({
        define: {
          __DB_PASSWORD__: JSON.stringify(process.env.DB_PASSWORD),
          __API_TOKEN__: JSON.stringify('sk_live_abc123'),
        },
      });
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
