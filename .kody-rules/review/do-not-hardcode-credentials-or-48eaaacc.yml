title: >-
  Do not hardcode credentials or connection secrets in database test and
  replication code
rule: >-
  RxDB includes replication and storage integrations for CouchDB, MongoDB,
  Firestore, GraphQL, WebSockets, and remote storage. Test fixtures, example
  servers, replication configurations, and helper scripts must not embed real
  passwords, API keys, tokens, or private connection strings. Use local
  defaults, environment variables, or clearly marked throwaway local credentials
  only.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      const replicationOptions = {
        remote: 'http://localhost:5984/test-db',
        username: process.env.COUCHDB_USER,
        password: process.env.COUCHDB_PASSWORD
      };
    isCorrect: true
  - snippet: |-
      const replicationOptions = {
        remote: 'https://prod-db.example.com/test-db',
        username: 'service-account',
        password: 'SuperSecret123!'
      };
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
