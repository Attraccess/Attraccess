title: Use Paramiko AutoAddPolicy only with host key verification
rule: >-
  When using Paramiko SSH clients, do not blindly accept unknown host keys with
  AutoAddPolicy in production code. Prefer loading known host keys and use
  RejectPolicy or explicit verification unless a documented, limited exception
  exists.
severity: high
scope: file
path: '**/*'
examples:
  - snippet: |-
      client = paramiko.SSHClient()
      client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
      client.connect(hostname, username=username, password=password)
    isCorrect: false
  - snippet: |-
      client = paramiko.SSHClient()
      client.load_system_host_keys()
      client.load_host_keys(os.path.expanduser('~/.ssh/known_hosts'))
      client.set_missing_host_key_policy(paramiko.RejectPolicy())
      client.connect(hostname, username=username)
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
