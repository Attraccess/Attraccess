<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Attraccess Dokumentation</title>
  <meta name="description" content="Offizielle Dokumentation für Attraccess – Zugangsverwaltung für Makerspaces und Werkstätten">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" href="_media/favicon.ico">

  <!-- Docsify Themeable -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">

  <style>
    /* ===== Attraccess Theme ===== */
    :root {
      /* Primary: Attraccess Blue */
      --theme-color: #006FEE;
      --theme-color-secondary: #7828c8;
      --theme-color-success: #17c964;
      --theme-color-warning: #f5a524;
      --theme-color-danger: #f31260;

      /* Cover */
      --cover-background-image: url('_media/login-wallpaper-blue.jpg');
      --cover-background-color: #006FEE;
      --cover-color: #fff;
      --cover-heading-color: #fff;
      --cover-blockquote-color: rgba(255,255,255,0.8);
      --cover-button-background: #006FEE;
      --cover-button-border: none;
      --cover-button-color: #fff;
      --cover-button-primary-background: #fff;
      --cover-button-primary-border: none;
      --cover-button-primary-color: #006FEE;

      /* Sidebar */
      --sidebar-background: #f8f9fa;
      --sidebar-border-color: #e4e4e7;
      --sidebar-name-color: #006FEE;
      --sidebar-name-font-weight: 700;
      --sidebar-nav-link-color: #3f3f46;
      --sidebar-nav-link-color--active: #006FEE;
      --sidebar-nav-link-font-weight--active: 600;
      --sidebar-nav-link-border-color--active: #006FEE;
      --sidebar-toggle-background: #006FEE;

      /* Content */
      --base-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --base-font-size: 16px;
      --base-line-height: 1.7;
      --base-color: #11181C;
      --base-background-color: #ffffff;
      --heading-color: #11181C;
      --link-color: #006FEE;
      --link-color--hover: #005bc4;
      --blockquote-border-color: #006FEE;

      /* Code */
      --code-font-family: "SF Mono", "Fira Code", "Fira Mono", Menlo, Consolas, monospace;
      --code-inline-background: #f4f4f5;
      --code-inline-color: #7828c8;
      --code-block-background: #18181b;
      --code-block-color: #ECEDEE;

      /* Table */
      --table-head-background: #f4f4f5;
      --table-head-color: #11181C;
      --table-row-odd-background: #fafafa;
      --table-cell-border-color: #e4e4e7;

      /* Notice / Alerts */
      --notice-tip-border-color: #17c964;
      --notice-important-border-color: #006FEE;

      /* Pagination */
      --pagination-border-color: #e4e4e7;
      --pagination-title-color: #006FEE;

      /* Search */
      --search-background: #f4f4f5;
      --search-input-background: #ffffff;
      --search-input-border-color: #e4e4e7;
      --search-result-keyword-color: #006FEE;
    }

    /* ===== Dark Mode ===== */
    [data-theme="dark"] {
      --theme-color: #338ef7;

      --cover-background-color: #000;
      --cover-heading-color: #fff;
      --cover-button-background: #338ef7;
      --cover-button-primary-background: #fff;
      --cover-button-primary-color: #338ef7;

      --sidebar-background: #0a0a0a;
      --sidebar-border-color: #27272a;
      --sidebar-name-color: #338ef7;
      --sidebar-nav-link-color: #a1a1aa;
      --sidebar-nav-link-color--active: #338ef7;
      --sidebar-nav-link-border-color--active: #338ef7;
      --sidebar-toggle-background: #338ef7;

      --base-color: #ECEDEE;
      --base-background-color: #0a0a0a;
      --heading-color: #ECEDEE;
      --link-color: #338ef7;
      --link-color--hover: #66aaf9;
      --blockquote-border-color: #338ef7;

      --code-inline-background: #27272a;
      --code-inline-color: #9353d3;
      --code-block-background: #18181b;
      --code-block-color: #ECEDEE;

      --table-head-background: #18181b;
      --table-head-color: #ECEDEE;
      --table-row-odd-background: #0f0f0f;
      --table-cell-border-color: #27272a;

      --notice-tip-border-color: #17c964;
      --notice-important-border-color: #338ef7;

      --pagination-border-color: #27272a;
      --pagination-title-color: #338ef7;

      --search-background: #18181b;
      --search-input-background: #0a0a0a;
      --search-input-border-color: #27272a;
      --search-result-keyword-color: #338ef7;
    }

    /* ===== Cover Page ===== */
    .cover-main {
      background-size: cover;
      background-position: center left;
    }
    .cover-main::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0,111,238,0.85) 0%, rgba(120,40,200,0.7) 100%);
      z-index: 0;
    }
    .cover-main > * {
      position: relative;
      z-index: 1;
    }
    section.cover .cover-main > p:last-child a {
      border-radius: 8px;
      padding: 10px 28px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    section.cover .cover-main > p:last-child a:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0,111,238,0.3);
    }
    section.cover img {
      width: 120px;
      border-radius: 16px;
    }

    /* ===== Language Switcher ===== */
    .lang-switcher {
      position: fixed;
      top: 12px;
      right: 80px;
      z-index: 100;
      display: flex;
      gap: 4px;
      background: var(--sidebar-background);
      border: 1px solid var(--sidebar-border-color);
      border-radius: 8px;
      padding: 3px;
      font-size: 13px;
    }
    .lang-switcher a {
      padding: 4px 10px;
      border-radius: 6px;
      text-decoration: none;
      color: var(--sidebar-nav-link-color);
      transition: all 0.15s ease;
    }
    .lang-switcher a.active {
      background: var(--theme-color);
      color: #fff;
    }
    .lang-switcher a:hover:not(.active) {
      background: var(--table-head-background);
    }

    /* ===== Dark Mode Toggle ===== */
    .theme-toggle {
      position: fixed;
      top: 12px;
      right: 16px;
      z-index: 100;
      background: var(--sidebar-background);
      border: 1px solid var(--sidebar-border-color);
      border-radius: 8px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      transition: all 0.15s ease;
    }
    .theme-toggle:hover {
      background: var(--table-head-background);
    }

    /* ===== General Polish ===== */
    .markdown-section {
      max-width: 820px;
    }
    .markdown-section h1 {
      font-weight: 700;
      border-bottom: 2px solid var(--theme-color);
      padding-bottom: 8px;
    }
    .markdown-section h2 {
      font-weight: 600;
      margin-top: 2.5em;
    }
    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: collapse;
    }
    .markdown-section table th {
      font-weight: 600;
      text-align: left;
    }
    .markdown-section table td,
    .markdown-section table th {
      padding: 10px 14px;
      border: 1px solid var(--table-cell-border-color);
    }
    .markdown-section img {
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    /* Alert/callout boxes */
    .markdown-section .tip,
    .markdown-section .warn,
    .markdown-section .note {
      border-radius: 8px;
      padding: 16px 20px;
    }

    /* Sidebar logo */
    .app-name-link img {
      max-width: 32px;
      vertical-align: middle;
      margin-right: 8px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .lang-switcher {
        top: auto;
        bottom: 12px;
        right: 12px;
      }
      .theme-toggle {
        top: auto;
        bottom: 12px;
        right: 140px;
      }
    }

    /* Docsify-specific dark class override */
    body[data-theme="dark"] .sidebar,
    body[data-theme="dark"] .sidebar-toggle {
      background: #0a0a0a;
      border-color: #27272a;
    }
  </style>
</head>
<body>
  <div id="app">Laden...</div>

  <!-- Language Switcher -->
  <div class="lang-switcher" id="langSwitcher">
    <a href="#" data-lang="de" class="active">DE</a>
    <a href="#" data-lang="en">EN</a>
  </div>

  <!-- Dark Mode Toggle -->
  <button class="theme-toggle" id="themeToggle" title="Farbmodus wechseln">🌙</button>

  <script>
    // ===== i18n Routing =====
    var currentLang = (function() {
      var hash = window.location.hash || '';
      var match = hash.match(/^#\/(de|en)\//);
      if (match) return match[1];
      var stored = localStorage.getItem('attraccess-docs-lang');
      if (stored) return stored;
      var browserLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
      return browserLang.startsWith('de') ? 'de' : browserLang.startsWith('en') ? 'en' : 'de';
    })();

    localStorage.setItem('attraccess-docs-lang', currentLang);

    // Ensure hash starts with lang prefix
    if (window.location.hash && !window.location.hash.match(/^#\/(de|en)\//)) {
      var path = window.location.hash.replace(/^#\/?/, '');
      window.location.hash = '#/' + currentLang + '/' + path;
    } else if (!window.location.hash || window.location.hash === '#/' || window.location.hash === '#') {
      window.location.hash = '#/' + currentLang + '/';
    }

    // ===== Dark Mode =====
    var savedTheme = localStorage.getItem('attraccess-docs-theme');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = savedTheme || (prefersDark ? 'dark' : 'light');
    document.body.setAttribute('data-theme', theme);

    // ===== Docsify Configuration =====
    window.$docsify = {
      name: '<img src="_media/logo.png" alt="Logo" width="28"> Attraccess',
      repo: 'https://github.com/Attraccess/Attraccess',
      homepage: 'home.md',
      loadSidebar: '_sidebar.md',
      loadNavbar: false,
      coverpage: 'coverpage.md',
      onlyCover: false,
      subMaxLevel: 3,
      auto2top: true,
      basePath: '/' + currentLang + '/',
      alias: {
        '/.*/_sidebar.md': '/' + currentLang + '/_sidebar.md',
        '/.*/_coverpage.md': '/' + currentLang + '/coverpage.md'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: currentLang === 'de' ? 'Suchen...' : 'Search...',
        noData: currentLang === 'de' ? 'Keine Ergebnisse' : 'No results',
        depth: 4,
        hideOtherSidebarContent: false,
        namespace: 'attraccess-docs-' + currentLang
      },
      pagination: {
        previousText: currentLang === 'de' ? 'Zurück' : 'Previous',
        nextText: currentLang === 'de' ? 'Weiter' : 'Next',
        crossChapter: true,
        crossChapterText: true
      },
      copyCode: {
        buttonText: currentLang === 'de' ? 'Kopieren' : 'Copy',
        errorText: currentLang === 'de' ? 'Fehler' : 'Error',
        successText: currentLang === 'de' ? 'Kopiert!' : 'Copied!'
      },
      themeable: {
        readyTransition: true,
        responsiveTables: true
      },
      tabs: {
        persist: true,
        sync: true,
        theme: 'classic'
      },
      // Handle navigation to add lang prefix
      routerMode: 'hash',
      plugins: [
        function(hook, vm) {
          // Update language switcher state
          hook.doneEach(function() {
            updateLangSwitcher();
          });

          // Add lang prefix to all relative links
          hook.afterEach(function(html) {
            return html;
          });
        }
      ]
    };

    // ===== Language Switching =====
    function updateLangSwitcher() {
      var links = document.querySelectorAll('.lang-switcher a');
      links.forEach(function(link) {
        link.classList.toggle('active', link.getAttribute('data-lang') === currentLang);
      });
    }

    document.getElementById('langSwitcher').addEventListener('click', function(e) {
      e.preventDefault();
      var lang = e.target.getAttribute('data-lang');
      if (!lang || lang === currentLang) return;

      var oldLang = currentLang;
      currentLang = lang;
      localStorage.setItem('attraccess-docs-lang', lang);

      // Switch to same page in other language
      var hash = window.location.hash || '#/';
      var newHash = hash.replace('#/' + oldLang + '/', '#/' + lang + '/');
      if (newHash === hash) {
        newHash = '#/' + lang + '/';
      }
      window.location.href = window.location.pathname + newHash;
      window.location.reload();
    });

    // ===== Theme Toggle =====
    var toggleBtn = document.getElementById('themeToggle');
    toggleBtn.textContent = theme === 'dark' ? '☀️' : '🌙';

    toggleBtn.addEventListener('click', function() {
      var current = document.body.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      document.body.setAttribute('data-theme', next);
      localStorage.setItem('attraccess-docs-theme', next);
      toggleBtn.textContent = next === 'dark' ? '☀️' : '🌙';
    });
  </script>

  <!-- Docsify -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1"></script>
  <script src="https://unpkg.com/docsify-plugin-flexible-alerts"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1/dist/docsify-sidebar-collapse.min.js"></script>

  <!-- Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-docker.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
</body>
</html>
