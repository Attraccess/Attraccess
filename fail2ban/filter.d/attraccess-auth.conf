# Fail2ban filter for the Attraccess auth audit log.
#
# Matches lines emitted by the AuthAudit logger context, regardless of whether
# they are tailed directly or read through the Docker json-file log driver
# (the substring search succeeds on either format).
#
# Log format (slice D, ATT-306):
#   auth.failed type=login outcome=invalid_credentials ip=1.2.3.4 user_id=42 \
#       username=alice ts=2026-05-15T12:34:56.000Z reason=bad_password

[Definition]

failregex = auth\.failed\s+type=(?:login|register|password_reset_request|password_reset_complete)\s+outcome=\S+\s+ip=<HOST>(?:\s|$)

ignoreregex =

datepattern = ts=%%Y-%%m-%%dT%%H:%%M:%%S
