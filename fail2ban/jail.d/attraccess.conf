# Fail2ban jail watching the Attraccess API audit log for repeated auth
# failures from the same client IP.
#
# Placeholder tokens (@@VAR@@) are substituted at container start by
# fail2ban/entrypoint.sh from the F2B_ATTRACCESS_* environment variables.
# See docs/en/installation/docker-compose.md for tuning.

[attraccess-auth]
enabled  = true
filter   = attraccess-auth
backend  = polling
logpath  = /var/lib/docker/containers/*/*-json.log
maxretry = @@MAXRETRY@@
findtime = @@FINDTIME@@
bantime  = @@BANTIME@@
chain    = DOCKER-USER
action   = %(action_)s
