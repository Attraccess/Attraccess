version: '2.4'

services:
  proxy:
    image: 'jc21/nginx-proxy-manager:2.14.0'
    restart: unless-stopped
    ports:
      - '80:80' # HTTP
      - '81:81' # Proxy Manager Admin
      - '443:443' # HTTPS
      - '2883:1883' # MQTT
      - '8883:8883' # MQTT SSL
      - '8080:8080' # MQTT WS
      - '8081:8081' # MQTT WS SSL
    volumes:
      - proxy-data:/data
      - proxy-letsencrypt:/etc/letsencrypt
    environment:
      - INITIAL_ADMIN_EMAIL=admin@attraccess.org
      - INITIAL_ADMIN_PASSWORD=password
    env_file:
      - .env.docker-compose

  attraccess:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - '3000'
    volumes:
      - attraccess-storage:/app/storage
    env_file:
      - .env.docker-compose

  monitoring-init:
    build:
      context: .
      dockerfile: Dockerfile
    restart: 'no'
    entrypoint: ['/bin/sh', '-c']
    command:
      - >
        set -e &&
        cp -rT /app/share/monitoring/grafana/provisioning /grafana-provisioning &&
        cp -rT /app/share/monitoring/grafana/dashboards /grafana-dashboards
    volumes:
      - prometheus-config:/prometheus-config
      - grafana-provisioning:/grafana-provisioning
      - grafana-dashboards:/grafana-dashboards

  mailpit:
    image: axllent/mailpit:v1.29.7
    restart: unless-stopped
    expose:
      - '8025'
      - '1025'
    env_file:
      - .env.docker-compose

  webhook-site:
    image: tarampampam/webhook-tester:2.3.0
    restart: unless-stopped
    expose:
      - '80'
    environment:
      - STORAGE_DRIVER=fs
      - FS_STORAGE_DIR=/storage
    volumes:
      - webhook-site:/storage
    env_file:
      - .env.docker-compose

  rabbitmq:
    image: rabbitmq:4.3.0-management
    hostname: rabbitmq
    restart: unless-stopped
    command: '/bin/bash -c "rabbitmq-plugins enable --offline rabbitmq_mqtt rabbitmq_web_mqtt rabbitmq_amqp1_0; rabbitmq-server"'
    expose:
      - '15672' # RabbitMQ Management UI
      - '5672' # RabbitMQ AMQP
      - '1883' # MQTT
      - '15675' # MQTT WebSocket
    ports:
      - '1883:1883' # MQTT direct (bypassing proxy)
      - '15675:15675' # MQTT WebSocket direct (bypassing proxy)
    environment:
      RABBITMQ_HOST: '%'
      RABBITMQ_DEFAULT_USER: attraccess
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - '-q'
        - ping
      retries: 3
      timeout: 5s
      interval: 30s

  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:2.10.1
    restart: unless-stopped
    expose:
      - '8080'
    volumes:
      - zigbee2mqtt:/app/data
    env_file:
      - .env.docker-compose

  hetzner-dns-updater:
    build:
      context: ./tools/hetzner-dns-updater
      dockerfile: Dockerfile
    restart: unless-stopped
    # Note: host networking is required to reliably read the machine's LAN IP on Linux hosts
    # Docker Desktop for Mac does not support host networking; if running on macOS, consider
    # passing the LAN IP via env var HETZNER_FORCE_IP or running this on a Linux host.
    network_mode: host
    #environment:
    #- HETZNER_DNS_UPDATER_ENABLED=${HETZNER_DNS_UPDATER_ENABLED}
    #- HETZNER_API_TOKEN=${HETZNER_API_TOKEN}
    #- HETZNER_ZONE_ID=${HETZNER_ZONE_ID}
    #- HETZNER_RECORD_NAME=${HETZNER_RECORD_NAME}
    #- HETZNER_TTL=${HETZNER_TTL:-300}
    #- HETZNER_FORCE_IP=${HETZNER_FORCE_IP}
    env_file:
      - .env.docker-compose

  config-ui:
    build:
      context: ./tools/config-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    # host networking + DNS_LISTEN_ADDRESS/bind-interfaces avoids the balenaOS host
    # dnsmasq port 53 conflict (127.0.0.2:53 / 10.114.102.1:53). Do NOT use `ports: 53:53`
    # in bridge mode — docker-proxy binds 0.0.0.0:53 and collides with host dnsmasq.
    network_mode: host
    expose:
      - 5380 # admin UI
      - 53/udp # DNS
      - 53/tcp # DNS
    volumes:
      - config-ui-data:/data
      - prometheus-config:/etc/prometheus
    env_file:
      - .env.docker-compose

  prometheus:
    image: prom/prometheus:v3.11.3
    restart: unless-stopped
    expose:
      - '9090'
    volumes:
      - prometheus-config:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on:
      - config-ui
      - monitoring-init
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:13.0.1
    restart: unless-stopped
    expose:
      - '3001'
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-attraccess}
      - GF_SERVER_HTTP_PORT=3001
    volumes:
      - grafana-provisioning:/etc/grafana/provisioning:ro
      - grafana-dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - monitoring-init

  # fail2ban is opt-in via the `fail2ban` Compose profile to keep developers
  # from getting their own IP banned during local testing. Enable with:
  #   docker compose --profile fail2ban up -d
  # See docs/en/installation/docker-compose.md for tuning + Linux-only caveats.
  fail2ban:
    image: crazymax/fail2ban:1.1.0
    profiles: ['fail2ban']
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - attraccess
    volumes:
      - ./fail2ban/jail.d:/etc/attraccess/jail.d:ro
      - ./fail2ban/filter.d:/etc/attraccess/filter.d:ro
      - ./fail2ban/entrypoint.sh:/usr/local/bin/attraccess-fail2ban-entrypoint.sh:ro
      - fail2ban-data:/data
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - F2B_LOG_LEVEL=${F2B_LOG_LEVEL:-INFO}
      - F2B_DB_PURGE_AGE=${F2B_DB_PURGE_AGE:-1d}
      - F2B_IPTABLES_CHAIN=${F2B_IPTABLES_CHAIN:-DOCKER-USER}
      - F2B_ATTRACCESS_MAXRETRY=${F2B_ATTRACCESS_MAXRETRY:-5}
      - F2B_ATTRACCESS_FINDTIME=${F2B_ATTRACCESS_FINDTIME:-900}
      - F2B_ATTRACCESS_BANTIME=${F2B_ATTRACCESS_BANTIME:-900}
    entrypoint:
      - /usr/local/bin/attraccess-fail2ban-entrypoint.sh

  duplicati:
    image: duplicati/duplicati:2.3.0.1-stable
    expose:
      - '8200'
    volumes:
      - duplicati:/data
      # mount volumes of all services that should be backed up
      - proxy-data:/external-storage/proxy/data
      - proxy-letsencrypt:/external-storage/proxy/letsencrypt
      - attraccess-storage:/external-storage/attraccess
      - webhook-site:/external-storage/webhook-site
      - rabbitmq_data:/external-storage/rabbitmq
      - zigbee2mqtt:/external-storage/zigbee2mqtt
      - prometheus-data:/external-storage/prometheus
      - grafana-data:/external-storage/grafana
      - config-ui-data:/external-storage/config-ui
    env_file:
      - .env.docker-compose

volumes:
  proxy-data:
  proxy-letsencrypt:
  attraccess-storage:
  webhook-site:
  rabbitmq_data:
  zigbee2mqtt:
  config-ui-data:
  prometheus-config:
  prometheus-data:
  grafana-data:
  grafana-provisioning:
  grafana-dashboards:
  duplicati:
  fail2ban-data:
