version: '2.4'

services:
  proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      - '80:80' # HTTP
      - '81:81' # Proxy Manager Admin
      - '443:443' # HTTPS
      - '1900:1900' # MQTT
    volumes:
      - proxy-data:/data
      - proxy-letsencrypt:/etc/letsencrypt
    environment:
      - INITIAL_ADMIN_EMAIL=admin@attraccess.org
      - INITIAL_ADMIN_PASSWORD=password
    env_file:
      - .env.docker-compose

  attraccess:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - '3000'
    volumes:
      - attraccess-storage:/app/storage
    env_file:
      - .env.docker-compose

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    expose:
      - '8025'
      - '1025'
    env_file:
      - .env.docker-compose

  webhook-site:
    image: tarampampam/webhook-tester:latest
    restart: unless-stopped
    expose:
      - '80'
    environment:
      - STORAGE_DRIVER=fs
      - FS_STORAGE_DIR=/storage
    volumes:
      - webhook-site:/storage
    env_file:
      - .env.docker-compose

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    command: '/bin/bash -c "rabbitmq-plugins enable --offline rabbitmq_mqtt rabbitmq_web_mqtt rabbitmq_amqp1_0; rabbitmq-server"'
    expose:
      - '15672' # RabbitMQ Management UI
      - '5672' # RabbitMQ AMQP
      - '1883' # MQTT
      - '15675' # MQTT WebSocket
    ports:
      - '1883:1883'
    environment:
      RABBITMQ_HOST: '%'
      RABBITMQ_DEFAULT_USER: attraccess
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - '-q'
        - ping
      retries: 3
      timeout: 5s
      interval: 30s

  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt
    restart: unless-stopped
    expose:
      - '8080'
    volumes:
      - zigbee2mqtt:/app/data
    env_file:
      - .env.docker-compose

volumes:
  attraccess-storage:
  bunkerm_mosquitto_data:
  bunkerm_mosquitto_conf:
  bunkerm_auth_data:
  webhook-site:
  zigbee2mqtt:
  proxy-data:
  proxy-letsencrypt:
  rabbitmq_data:
