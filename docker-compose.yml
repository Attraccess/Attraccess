version: '2.4'

services:
  attraccess:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '80:3000'
    volumes:
      - attraccess-storage:/app/storage
    depends_on:
      - bunkerm

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '8025:8025'
      - '1025:1025'

  webhook-site:
    image: tarampampam/webhook-tester:latest
    restart: unless-stopped
    environment:
      - STORAGE_DRIVER=fs
      - FS_STORAGE_DIR=/storage
    ports:
      - '8084:8080'
    volumes:
      - webhook-site:/storage

  bunkerm: #BunkerM is an MQTT Broker
    image: bunkeriot/bunkerm:latest
    restart: unless-stopped
    ports:
      - '1883:1883' # MQTT broker port
      - '9001:9001' # WebSocket port (if needed)
      - '2000:2000' # Web UI
      - '1900:1900' # Internal admin API
    #environment:
    #  - HOST_ADDRESS=mqtt.attraccess.demo
    #  - FRONTEND_URL=http://mqtt.attraccess.demo
    #  - ALLOWED_ORIGINS=http://mqtt.attraccess.demo
    volumes:
      - bunkerm_mosquitto_data:/var/lib/mosquitto
      - bunkerm_mosquitto_conf:/etc/mosquitto
      - bunkerm_auth_data:/data

  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - zigbee2mqtt:/app/data
    #environment:
    #  - TZ=Europe/Amsterdam

volumes:
  attraccess-storage:
  bunkerm_mosquitto_data:
  bunkerm_mosquitto_conf:
  bunkerm_auth_data:
  webhook-site:
  zigbee2mqtt:
