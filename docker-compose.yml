version: '2.4'

services:
  proxy:
    image: 'jc21/nginx-proxy-manager:2.14.0'
    restart: unless-stopped
    ports:
      - '80:80' # HTTP
      - '81:81' # Proxy Manager Admin
      - '443:443' # HTTPS
      - '2883:1883' # MQTT
      - '8883:8883' # MQTT SSL
      - '8080:8080' # MQTT WS
      - '8081:8081' # MQTT WS SSL
    volumes:
      - proxy-data:/data
      - proxy-letsencrypt:/etc/letsencrypt
    environment:
      - INITIAL_ADMIN_EMAIL=admin@attraccess.org
      - INITIAL_ADMIN_PASSWORD=password
    env_file:
      - .env.docker-compose

  attraccess:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - '3000'
    volumes:
      - attraccess-storage:/app/storage
    env_file:
      - .env.docker-compose

  mailpit:
    image: axllent/mailpit:v1.29.7
    restart: unless-stopped
    expose:
      - '8025'
      - '1025'
    env_file:
      - .env.docker-compose

  webhook-site:
    image: tarampampam/webhook-tester:2.3.0
    restart: unless-stopped
    expose:
      - '80'
    environment:
      - STORAGE_DRIVER=fs
      - FS_STORAGE_DIR=/storage
    volumes:
      - webhook-site:/storage
    env_file:
      - .env.docker-compose

  rabbitmq:
    image: rabbitmq:4.2.5-management
    hostname: rabbitmq
    restart: unless-stopped
    command: '/bin/bash -c "rabbitmq-plugins enable --offline rabbitmq_mqtt rabbitmq_web_mqtt rabbitmq_amqp1_0; rabbitmq-server"'
    expose:
      - '15672' # RabbitMQ Management UI
      - '5672' # RabbitMQ AMQP
      - '1883' # MQTT
      - '15675' # MQTT WebSocket
    ports:
      - '1883:1883' # MQTT direct (bypassing proxy)
      - '15675:15675' # MQTT WebSocket direct (bypassing proxy)
    environment:
      RABBITMQ_HOST: '%'
      RABBITMQ_DEFAULT_USER: attraccess
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - '-q'
        - ping
      retries: 3
      timeout: 5s
      interval: 30s

  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:2.9.2
    restart: unless-stopped
    expose:
      - '8080'
    volumes:
      - zigbee2mqtt:/app/data
    env_file:
      - .env.docker-compose

  hetzner-dns-updater:
    build:
      context: ./tools/hetzner-dns-updater
      dockerfile: Dockerfile
    restart: unless-stopped
    # Note: host networking is required to reliably read the machine's LAN IP on Linux hosts
    # Docker Desktop for Mac does not support host networking; if running on macOS, consider
    # passing the LAN IP via env var HETZNER_FORCE_IP or running this on a Linux host.
    network_mode: host
    #environment:
    #- HETZNER_DNS_UPDATER_ENABLED=${HETZNER_DNS_UPDATER_ENABLED}
    #- HETZNER_API_TOKEN=${HETZNER_API_TOKEN}
    #- HETZNER_ZONE_ID=${HETZNER_ZONE_ID}
    #- HETZNER_RECORD_NAME=${HETZNER_RECORD_NAME}
    #- HETZNER_TTL=${HETZNER_TTL:-300}
    #- HETZNER_FORCE_IP=${HETZNER_FORCE_IP}
    env_file:
      - .env.docker-compose

  dns-server:
    build:
      context: ./tools/dns-server
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    expose:
      - 5380 # admin UI
      - 53/udp # DNS
      - 53/tcp # DNS
    volumes:
      - dns-server-data:/data
    env_file:
      - .env.docker-compose

  duplicati:
    image: duplicati/duplicati:2.3.0.0-stable
    expose:
      - '8200'
    volumes:
      - duplicati:/data
      # mount volumes of all services that should be backed up
      - proxy-data:/external-storage/proxy/data
      - proxy-letsencrypt:/external-storage/proxy/letsencrypt
      - attraccess-storage:/external-storage/attraccess
      - webhook-site:/external-storage/webhook-site
      - rabbitmq_data:/external-storage/rabbitmq
      - zigbee2mqtt:/external-storage/zigbee2mqtt
      - dns-server-data:/external-storage/dns-server
    env_file:
      - .env.docker-compose

volumes:
  proxy-data:
  proxy-letsencrypt:
  attraccess-storage:
  webhook-site:
  rabbitmq_data:
  zigbee2mqtt:
  duplicati:
  dns-server-data:
