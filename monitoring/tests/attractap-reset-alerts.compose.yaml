# Only disposable local services; no production contacts or persistent volumes.
services:
  prometheus:
    image: prom/prometheus:v3.15.0
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ${RESET_ALERT_TEST_DIR}/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '127.0.0.1::9090'
  grafana:
    image: grafana/grafana:13.2.3
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: local-reset-test
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
    volumes:
      - ${RESET_ALERT_TEST_DIR}/provisioning:/etc/grafana/provisioning:ro
    ports:
      - '127.0.0.1::3000'
