groups:
  - name: attraccess
    rules:
      - alert: AttractapServiceDown
        expr: up{job="attraccess"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Attraccess service is down"
          description: "The Attraccess API has been unreachable for more than 2 minutes."

      - alert: HighHttpErrorRate
        expr: sum(rate(attraccess_http_requests_total{job="attraccess", status_code=~"5.."}[5m])) / sum(rate(attraccess_http_requests_total{job="attraccess"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "More than 5% of HTTP requests are returning 5xx errors over the last 5 minutes."

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(attraccess_http_request_duration_seconds_bucket{job="attraccess"}[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High request latency (p95 > 2s)"
          description: "The 95th percentile request latency has exceeded 2 seconds for the last 5 minutes."

      - alert: ScrapeFailures
        expr: up{job="attraccess"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus scrape failures"
          description: "Prometheus has been unable to scrape the Attraccess metrics endpoint for 5 minutes."

      - alert: HighFailedLoginRate
        expr: sum(increase(attraccess_auth_login_total{job="attraccess", status="fail"}[5m])) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High number of failed login attempts"
          description: "More than 10 failed login attempts in the last 5 minutes — possible brute-force or credential-stuffing attack."

      - alert: OverdueMaintenance
        expr: attraccess_resource_maintenance_overdue{job="attraccess"} > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Resources with overdue maintenance"
          description: "{{ $value }} resources have overdue maintenance."
