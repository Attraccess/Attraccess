# NOTE: When using the config-ui service, this file is dynamically generated
# and overwritten on startup. Manual edits here will be lost unless config-ui
# is not in use.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting rules are managed by Grafana (monitoring/grafana/provisioning/alerting),
# not by Prometheus rule_files.

scrape_configs:
  - job_name: 'attraccess'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['attraccess:3000']
    scrape_interval: 10s
    # The metrics endpoint requires an API key configured in Attraccess settings.
    # Uncomment and set the bearer_token to the API key you configured:
    # bearer_token: '<your-metrics-api-key>'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s
