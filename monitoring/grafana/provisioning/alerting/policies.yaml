apiVersion: 1

# Root notification policy: route everything to Pushover. This replaces the
# default policy for orgId 1, so the manually-created UI policy is no longer
# needed (provisioning takes ownership and makes it read-only in the UI).
policies:
  - orgId: 1
    receiver: Pushover
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
