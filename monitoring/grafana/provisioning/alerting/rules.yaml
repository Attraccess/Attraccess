apiVersion: 1

# Grafana-managed alert rules that query the Prometheus datasource and route to
# Pushover via the notification policy. These are the single source of truth for
# alerting (Prometheus rule_files are not used).
# The PromQL comparison is moved into a Grafana threshold expression (refId C) so
# the query (refId A) returns the raw value Grafana can evaluate.
groups:
  - orgId: 1
    name: attraccess
    folder: Attraccess Alerts
    interval: 1m
    rules:
      - uid: attractap-service-down
        title: AttractapServiceDown
        condition: C
        for: 2m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Attraccess service is down"
          description: "The Attraccess API has been unreachable for more than 2 minutes."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: attraccess-prometheus
            model:
              refId: A
              expr: 'up{job="attraccess"}'
              instant: true
              range: false
              datasource:
                type: prometheus
                uid: attraccess-prometheus
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []

      - uid: high-http-error-rate
        title: HighHttpErrorRate
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "More than 5% of HTTP requests are returning 5xx errors over the last 5 minutes."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: attraccess-prometheus
            model:
              refId: A
              expr: 'sum(rate(attraccess_http_requests_total{job="attraccess", status_code=~"5.."}[5m])) / sum(rate(attraccess_http_requests_total{job="attraccess"}[5m]))'
              instant: true
              range: false
              datasource:
                type: prometheus
                uid: attraccess-prometheus
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0.05]
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []

      - uid: high-request-latency
        title: HighRequestLatency
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "High request latency (p95 > 2s)"
          description: "The 95th percentile request latency has exceeded 2 seconds for the last 5 minutes."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: attraccess-prometheus
            model:
              refId: A
              expr: 'histogram_quantile(0.95, sum(rate(attraccess_http_request_duration_seconds_bucket{job="attraccess"}[5m])) by (le))'
              instant: true
              range: false
              datasource:
                type: prometheus
                uid: attraccess-prometheus
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [2]
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []

      - uid: scrape-failures
        title: ScrapeFailures
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Prometheus scrape failures"
          description: "Prometheus has been unable to scrape the Attraccess metrics endpoint for 5 minutes."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: attraccess-prometheus
            model:
              refId: A
              expr: 'up{job="attraccess"}'
              instant: true
              range: false
              datasource:
                type: prometheus
                uid: attraccess-prometheus
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []

      - uid: high-failed-login-rate
        title: HighFailedLoginRate
        condition: C
        for: 2m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "High number of failed login attempts"
          description: "More than 10 failed login attempts in the last 5 minutes — possible brute-force or credential-stuffing attack."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: attraccess-prometheus
            model:
              refId: A
              expr: 'sum(increase(attraccess_auth_login_total{job="attraccess", status="fail"}[5m]))'
              instant: true
              range: false
              datasource:
                type: prometheus
                uid: attraccess-prometheus
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [10]
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []

      - uid: overdue-maintenance
        title: OverdueMaintenance
        condition: C
        for: 1h
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Resources with overdue maintenance"
          description: "{{ $values.A.Value }} resources have overdue maintenance."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: attraccess-prometheus
            model:
              refId: A
              expr: 'attraccess_resource_maintenance_overdue{job="attraccess"}'
              instant: true
              range: false
              datasource:
                type: prometheus
                uid: attraccess-prometheus
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []

      - uid: attractap-all-readers-offline
        title: AttractapAllReadersOffline
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "All Attractap readers offline"
          description: "No Attractap readers have been connected for 5 minutes, but at least one was connected within the last hour. Check reader power/network."
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: attraccess-prometheus
            model:
              refId: A
              expr: 'sum((attraccess_attractap_devices_connected{job="attraccess"} == bool 0) * (max_over_time(attraccess_attractap_devices_connected{job="attraccess"}[1h]) > bool 0)) or vector(0)'
              instant: true
              range: false
              datasource:
                type: prometheus
                uid: attraccess-prometheus
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []

      - uid: attractap-reader-crashes
        title: AttractapReaderCrashes
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Attractap readers crashing"
          description: "More than 3 reader crash reports were received in the last hour."
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: attraccess-prometheus
            model:
              refId: A
              expr: 'sum(increase(attraccess_attractap_crash_reports_total{job="attraccess"}[1h])) or vector(0)'
              instant: true
              range: false
              datasource:
                type: prometheus
                uid: attraccess-prometheus
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [3]
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []

      - uid: cron-job-failing
        title: CronJobFailing
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Cron job failing"
          description: "Cron job {{ $labels.job_name }} has recorded failures in the last 15 minutes."
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: attraccess-prometheus
            model:
              refId: A
              expr: 'sum by (job_name) (increase(attraccess_cron_job_runs_total{job="attraccess", status="failure"}[15m]))'
              instant: true
              range: false
              datasource:
                type: prometheus
                uid: attraccess-prometheus
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []

      - uid: cron-job-stale
        title: CronJobStale
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Cron job has not succeeded recently"
          description: "Cron job {{ $labels.job_name }} has not completed successfully in over 25 hours."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: attraccess-prometheus
            model:
              refId: A
              expr: 'time() - attraccess_cron_job_last_success_timestamp_seconds{job="attraccess"}'
              instant: true
              range: false
              datasource:
                type: prometheus
                uid: attraccess-prometheus
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [90000]
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []

      - uid: flow-execution-failures
        title: FlowExecutionFailures
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Resource flow executions failing"
          description: "Flow trigger {{ $labels.trigger_type }} is failing at more than 0.1/s over the last 15 minutes."
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: attraccess-prometheus
            model:
              refId: A
              expr: 'sum by (trigger_type) (rate(attraccess_flow_executions_total{job="attraccess", status="failure"}[15m]))'
              instant: true
              range: false
              datasource:
                type: prometheus
                uid: attraccess-prometheus
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0.1]
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []

      - uid: external-call-errors
        title: ExternalCallErrors
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "External service call errors"
          description: "Outbound calls to {{ $labels.target }} are erroring at more than 0.2/s over the last 5 minutes."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: attraccess-prometheus
            model:
              refId: A
              expr: 'sum by (target) (rate(attraccess_external_call_errors_total{job="attraccess"}[5m]))'
              instant: true
              range: false
              datasource:
                type: prometheus
                uid: attraccess-prometheus
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0.2]
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []

      - uid: mqtt-servers-unhealthy
        title: MqttServersUnhealthy
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "MQTT servers unhealthy"
          description: "One or more configured MQTT servers are not healthy."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: attraccess-prometheus
            model:
              refId: A
              expr: '(attraccess_mqtt_servers_total{job="attraccess"} - attraccess_mqtt_servers_healthy{job="attraccess"})'
              instant: true
              range: false
              datasource:
                type: prometheus
                uid: attraccess-prometheus
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []

      - uid: email-delivery-failures
        title: EmailDeliveryFailures
        condition: C
        for: 15m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Email delivery failing"
          description: "Email sending is failing at more than 0.1/s over the last 15 minutes."
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: attraccess-prometheus
            model:
              refId: A
              expr: 'sum(rate(attraccess_email_sent_total{job="attraccess", status="fail"}[15m]))'
              instant: true
              range: false
              datasource:
                type: prometheus
                uid: attraccess-prometheus
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0.1]
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []

      - uid: high-event-loop-lag
        title: HighEventLoopLag
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "High Node.js event loop lag"
          description: "The Node.js event loop lag has exceeded 0.5s for 5 minutes — the API may be CPU-saturated."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: attraccess-prometheus
            model:
              refId: A
              expr: 'nodejs_eventloop_lag_seconds{job="attraccess"}'
              instant: true
              range: false
              datasource:
                type: prometheus
                uid: attraccess-prometheus
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0.5]
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []

      - uid: high-host-memory-usage
        title: HighHostMemoryUsage
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "High host memory usage"
          description: "Host RAM usage has been above 90% for 10 minutes."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: attraccess-prometheus
            model:
              refId: A
              expr: '1 - (node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"})'
              instant: true
              range: false
              datasource:
                type: prometheus
                uid: attraccess-prometheus
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0.9]
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []

      - uid: high-host-disk-usage
        title: HighHostDiskUsage
        condition: C
        for: 15m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "High host disk usage"
          description: "A persistent host filesystem has been above 85% usage for 15 minutes."
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: attraccess-prometheus
            model:
              refId: A
              expr: 'max by (instance, mountpoint) (1 - (node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|fuse.*|overlay|squashfs",mountpoint!~"/run.*|/var/lib/docker/.+"} / node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|fuse.*|overlay|squashfs",mountpoint!~"/run.*|/var/lib/docker/.+"}))'
              instant: true
              range: false
              datasource:
                type: prometheus
                uid: attraccess-prometheus
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0.85]
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []

      - uid: high-attraccess-container-memory-usage
        title: HighAttraccessContainerMemoryUsage
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "High Attraccess container memory usage"
          description: "The Attraccess container memory working set has been above 90% of its container limit for 10 minutes."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: attraccess-prometheus
            model:
              refId: A
              expr: 'max((container_memory_working_set_bytes{job="cadvisor",container_label_com_docker_compose_service="attraccess",image!=""} / (container_spec_memory_limit_bytes{job="cadvisor",container_label_com_docker_compose_service="attraccess",image!=""} > 0)) or (container_memory_working_set_bytes{job="cadvisor",container_label_io_balena_service_name="attraccess",image!=""} / (container_spec_memory_limit_bytes{job="cadvisor",container_label_io_balena_service_name="attraccess",image!=""} > 0)))'
              instant: true
              range: false
              datasource:
                type: prometheus
                uid: attraccess-prometheus
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0.9]
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []
