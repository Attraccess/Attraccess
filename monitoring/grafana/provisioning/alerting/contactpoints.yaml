apiVersion: 1

# Pushover contact point. Secrets are NOT stored here — they are read from the
# grafana container environment via Grafana's $__env{} interpolation. Set them
# as balena *device* or *fleet* variables (NOT service-specific) so that both
# the grafana and monitoring-init services see them (ATT-593 — balena does not
# support ${VAR:-} compose syntax so these cannot be passed via compose env):
#   balena env set PUSHOVER_API_TOKEN '<token>'   -d <uuid>
#   balena env set PUSHOVER_USER_KEY  '<userkey>' -d <uuid>
contactPoints:
  - orgId: 1
    name: Pushover
    receivers:
      - uid: pushover-attraccess
        type: pushover
        settings:
          apiToken: $__env{PUSHOVER_API_TOKEN}
          userKey: $__env{PUSHOVER_USER_KEY}
          # Human-readable formatting (templates defined in templates.yaml).
          title: '{{ template "attraccess.pushover.title" . }}'
          message: '{{ template "attraccess.pushover.message" . }}'
        disableResolveMessage: false
