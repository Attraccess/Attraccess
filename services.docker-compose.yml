services:
  mailpit:
    image: axllent/mailpit:v1.29.4
    ports:
      - '8025:8025'
      - '1025:1025'

  bunkerm:
    image: bunkeriot/bunkerm:v1.2.0
    restart: unless-stopped
    ports:
      - '1883:1883' # MQTT broker port
      - '9001:9001' # WebSocket port (if needed)
      - '2000:2000' # Web UI
      - '1900:1900' # Internal admin API
    volumes:
      - bunkerm:/bunkerm/data # persistent data storage

  webhook-site:
    image: tarampampam/webhook-tester:2.2.6
    environment:
      - STORAGE_DRIVER=fs
      - FS_STORAGE_DIR=/storage
    ports:
      - '8084:8080'
    volumes:
      - webhook-site:/storage

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.6
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=dev-file
    ports:
      - '8090:8080'
    volumes:
      - keycloak:/opt/keycloak/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health/ready']
      interval: 10s
      timeout: 5s
      retries: 3

  authentik-postgresql:
    image: docker.io/library/postgres:16.13-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d authentik -U authentik']
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - authentik-database:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: super-secret
      POSTGRES_USER: authentik
      POSTGRES_DB: authentik

  authentik-redis:
    image: docker.io/library/redis:8.0.6-alpine
    command: --save 60 1 --loglevel warning
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep PONG']
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - authentik-redis:/data

  authentik-server:
    image: ghcr.io/goauthentik/server:2025.6.4
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: super-secret
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: super-secret
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
    ports:
      - '9000:9000'
      - '9443:9443'
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.6.4
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: super-secret
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: super-secret
    # `user: root` and the docker socket volume are optional.
    # See more for the docker socket integration here:
    # https://goauthentik.io/docs/outposts/integrations/docker
    # Removing `user: root` also prevents the worker from fixing the permissions
    # on the mounted folders, so when removing this make sure the folders have the correct UID/GID
    # (1000:1000 by default)
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - authentik-media:/media
      - authentik-certs:/certs
      - authentik-templates:/templates
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:2.9.1
    restart: unless-stopped
    expose:
      - '8080'
    volumes:
      - zigbee2mqtt:/app/data

  prometheus:
    image: prom/prometheus:v3.4.0
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'

  grafana:
    image: grafana/grafana:11.6.0
    ports:
      - '3001:3001'
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-attraccess}
      - GF_SERVER_HTTP_PORT=3001
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  authentik-database:
    driver: local
  authentik-redis:
    driver: local
  bunkerm:
    driver: local
  authentik-media:
    driver: local
  authentik-templates:
    driver: local
  authentik-certs:
    driver: local
  keycloak:
    driver: local
  webhook-site:
    driver: local
  zigbee2mqtt:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local