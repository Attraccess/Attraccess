services:
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.30.6
    ports:
      - '8025:8025'
      - '1025:1025'

  rabbitmq:
    image: rabbitmq:4.3.4-management
    hostname: rabbitmq
    restart: unless-stopped
    command: '/bin/bash -c "rabbitmq-plugins enable --offline rabbitmq_mqtt rabbitmq_web_mqtt rabbitmq_amqp1_0; rabbitmq-server"'
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # Management UI
      - '1883:1883' # MQTT
      - '15675:15675' # MQTT WebSocket
    environment:
      RABBITMQ_DEFAULT_USER: attraccess
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      retries: 3
      timeout: 5s
      interval: 30s

  webhook-site:
    image: tarampampam/webhook-tester:2.3.0
    environment:
      - STORAGE_DRIVER=fs
      - FS_STORAGE_DIR=/storage
    ports:
      - '8084:8080'
    volumes:
      - webhook-site:/storage

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=dev-file
    ports:
      - '8090:8080'
    volumes:
      - keycloak:/opt/keycloak/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health/ready']
      interval: 10s
      timeout: 5s
      retries: 3

  authentik-postgresql:
    image: docker.io/library/postgres:18.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d authentik -U authentik']
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - authentik-database:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: super-secret
      POSTGRES_USER: authentik
      POSTGRES_DB: authentik

  authentik-redis:
    image: docker.io/library/redis:8.8.1-alpine
    command: --save 60 1 --loglevel warning
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep PONG']
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - authentik-redis:/data

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.5.6
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: super-secret
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: super-secret
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
    ports:
      - '9000:9000'
      - '9443:9443'
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.5.6
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: super-secret
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: super-secret
    # `user: root` and the docker socket volume are optional.
    # See more for the docker socket integration here:
    # https://goauthentik.io/docs/outposts/integrations/docker
    # Removing `user: root` also prevents the worker from fixing the permissions
    # on the mounted folders, so when removing this make sure the folders have the correct UID/GID
    # (1000:1000 by default)
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - authentik-media:/media
      - authentik-certs:/certs
      - authentik-templates:/templates
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:2.12.1
    restart: unless-stopped
    expose:
      - '8080'
    volumes:
      - zigbee2mqtt:/app/data

  config-ui:
    build:
      context: ./tools/config-ui
      dockerfile: Dockerfile
    ports:
      - '127.0.0.1:5380:5380'
    environment:
      CONFIG_UI_USERNAME: ${CONFIG_UI_USERNAME:-admin}
      CONFIG_UI_PASSWORD: ${CONFIG_UI_PASSWORD:-attraccess-dev-only-password}
      CONFIG_UI_ALLOW_WEAK_PASSWORD: ${CONFIG_UI_ALLOW_WEAK_PASSWORD:-true}
    volumes:
      - config-ui-data:/data
      - prometheus-config:/etc/prometheus

  prometheus:
    image: prom/prometheus:v3.13.1
    ports:
      - '9090:9090'
    volumes:
      - prometheus-config:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on:
      - config-ui
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'

  # Copies provisioning into a writable volume and strips the opt-in Pushover
  # alerting files when the PUSHOVER_* secrets are unset, so Grafana starts even
  # without Pushover configured (ATT-539). Dashboards stay bind-mounted for live
  # editing; only provisioning is snapshotted here.
  grafana-provisioning-init:
    image: grafana/grafana:13.1.1
    restart: 'no'
    user: root
    entrypoint: ['/bin/sh', '-c']
    environment:
      - PUSHOVER_API_TOKEN=${PUSHOVER_API_TOKEN:-}
      - PUSHOVER_USER_KEY=${PUSHOVER_USER_KEY:-}
    command:
      - >
        set -e &&
        if [ -f /src/sync-managed-files.sh ]; then
          sh /src/sync-managed-files.sh /src/provisioning /grafana-provisioning;
        else
          rm -rf /grafana-provisioning/* /grafana-provisioning/.[!.]* /grafana-provisioning/..?* 2>/dev/null || true;
          cp -rT /src/provisioning /grafana-provisioning;
        fi &&
        sh /src/prepare-provisioning.sh /grafana-provisioning
    volumes:
      - ./monitoring/grafana:/src:ro
      - grafana-provisioning:/grafana-provisioning

  grafana:
    image: grafana/grafana:13.1.1
    ports:
      - '3001:3001'
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-attraccess}
      - GF_SERVER_HTTP_PORT=3001
      # Read by $__env{} interpolation in the provisioned Pushover contact point.
      - PUSHOVER_API_TOKEN=${PUSHOVER_API_TOKEN:-}
      - PUSHOVER_USER_KEY=${PUSHOVER_USER_KEY:-}
    depends_on:
      grafana-provisioning-init:
        condition: service_completed_successfully
    volumes:
      - grafana-provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  authentik-database:
    driver: local
  authentik-redis:
    driver: local
  rabbitmq_data:
    driver: local
  authentik-media:
    driver: local
  authentik-templates:
    driver: local
  authentik-certs:
    driver: local
  keycloak:
    driver: local
  webhook-site:
    driver: local
  zigbee2mqtt:
    driver: local
  config-ui-data:
    driver: local
  prometheus-config:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  grafana-provisioning:
    driver: local
  valkey-data:
    driver: local
