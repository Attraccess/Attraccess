; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env]
monitor_speed = 115200
monitor_echo = true
monitor_filters = esp32_exception_decoder
build_type = debug
extra_scripts =
    pre:tools/build_adaptive_certs_wrapper.py
build_flags =
	-D FIRMWARE_VERSION='"1.3.17"'

[env:attractap-touch]
board = esp32-s3-devkitc-1-n16r8v
platform = platformio/espressif32
framework = arduino

build_src_filter = +<*> -<display/images/> -<display/driver/qualia/>
board_build.sdkconfig_override = sdkconfig.defaults
board_build.partitions = partitions.csv

lib_deps =
	adafruit/Adafruit BusIO@^1.17.0
	arduino-libraries/Arduino_CRC32@^1.0.0
	lvgl/lvgl@9.3.0
	bblanchon/ArduinoJson@^7.4.2

build_flags =
	${env.build_flags}
	-D FIRMWARE_NAME='"attractap_touch"'
	-D FIRMWARE_FRIENDLY_NAME='"Attractap Touch"'
	-D FIRMWARE_VARIANT='"wifi"'
	-D FIRMWARE_VARIANT_FRIENDLY_NAME='"WiFi"'

	-D LOG_LEVEL=INFO
	-D LOGGER_LEVEL_NUM=3

	-D PIN_PN532_IRQ=0
	-D PIN_NFC_I2C_SDA=15
	-D PIN_NFC_I2C_SCL=7
	-D PIN_TOUCH_I2C_SDA=15
	-D PIN_TOUCH_I2C_SCL=7

	-D PIN_ETH_SPI_CS=-1
	-D PIN_W5500_INT=-1
	-D PIN_W5500_RESET=-1
	-D PIN_ETH_SPI_MOSI=-1
	-D PIN_ETH_SPI_MISO=-1
	-D PIN_ETH_SPI_SCK=-1

	-D HAS_LVGL_DISPLAY=1

	-D DISPLAY_DRIVER_GT911=1
	-D HAS_IO_EXPANDER=1

	; LVGL
	-D LV_CONF_PATH='"${PROJECT_DIR}/include/lv_conf.h"'
	-D USER_SETUP_LOADED=1

[env:attractap-touch-v2]
board = esp32-s3-devkitc-1-n16r8v
platform = platformio/espressif32
framework = arduino

build_src_filter = +<*> -<display/images/> -<display/driver/qualia/>
board_build.sdkconfig_override = sdkconfig.defaults
board_build.partitions = partitions.csv

lib_deps =
	adafruit/Adafruit BusIO@^1.17.0
	arduino-libraries/Arduino_CRC32@^1.0.0
	lvgl/lvgl@9.3.0
	bblanchon/ArduinoJson@^7.4.2

build_flags =
	${env.build_flags}
	-D FIRMWARE_NAME='"attractap_touch_v2"'
	-D FIRMWARE_FRIENDLY_NAME='"Attractap Touch V2"'
	-D FIRMWARE_VARIANT='"wifi"'
	-D FIRMWARE_VARIANT_FRIENDLY_NAME='"WiFi"'

	-D LOG_LEVEL=INFO
	-D LOGGER_LEVEL_NUM=3

	-D PIN_PN532_IRQ=0
	-D PIN_NFC_I2C_SDA=15
	-D PIN_NFC_I2C_SCL=7
	-D PIN_TOUCH_I2C_SDA=15
	-D PIN_TOUCH_I2C_SCL=7

	; PN532 behind DFRobot Fermion I2C Address Shifter (DFR1185)
	; Both DIP switches OFF → bit A6 inverted → 0x24 becomes 0x64
	-D PN532_I2C_ADDRESS=0x64

	; IO expander at shifted address on V4 hardware
	-D IOEXPANDER_I2C_ADDR=0x24

	-D PIN_ETH_SPI_CS=-1
	-D PIN_W5500_INT=-1
	-D PIN_W5500_RESET=-1
	-D PIN_ETH_SPI_MOSI=-1
	-D PIN_ETH_SPI_MISO=-1
	-D PIN_ETH_SPI_SCK=-1

	-D HAS_LVGL_DISPLAY=1

	-D DISPLAY_DRIVER_GT911=1
	-D HAS_IO_EXPANDER=1

	; V4 uses a 16-bit IO expander (PCA9555-compatible) at 0x24
	-D IO_EXPANDER_16BIT=1

	; LVGL
	-D LV_CONF_PATH='"${PROJECT_DIR}/include/lv_conf.h"'
	-D USER_SETUP_LOADED=1

[env:attractap-touch-ethernet]
board = adafruit_qualia_s3_rgb666_no_uf2
platform = platformio/espressif32
framework = arduino

build_src_filter = +<*> -<display/images/> -<display/driver/gt911/> -<ioexpander/>
board_build.sdkconfig_override = sdkconfig.defaults
board_build.partitions = partitions.csv

lib_deps =
	adafruit/Adafruit BusIO@^1.17.0
	arduino-libraries/Arduino_CRC32@^1.0.0
	lvgl/lvgl@9.3.0
	bblanchon/ArduinoJson@^7.4.2
	Adafruit FT6206 Library @ 1.1.0
	Adafruit CST8XX Library @ 1.1.1

build_flags =
	${env.build_flags}
	-D FIRMWARE_NAME='"attractap_touch"'
	-D FIRMWARE_FRIENDLY_NAME='"Attractap Touch"'
	-D FIRMWARE_VARIANT='"ethernet"'
	-D FIRMWARE_VARIANT_FRIENDLY_NAME='"Ethernet"'

	-D LOG_LEVEL=INFO
	-D LOGGER_LEVEL_NUM=3

	-D PIN_PN532_IRQ=0

	-D PIN_ETH_SPI_CS=15
	-D PIN_W5500_INT=A0
	-D PIN_W5500_RESET=-1
	-D PIN_ETH_SPI_MOSI=7
	-D PIN_ETH_SPI_MISO=6
	-D PIN_ETH_SPI_SCK=5

	-D HAS_LVGL_DISPLAY=1

	-D DISPLAY_DRIVER_QUALIA=1
	; Adafruit Qualia S3 RGB666 board uses a FocalTech FT6206 capacitive touch controller.
	; Setting this explicitly selects the FT6206 driver and skips the legacy try-both fallback
	; (FocalTouch then CST8XX) in qualia_ft_cst_driver.cpp.
	-D TOUCH_DRIVER_FT6206=1
	-D BEEPER_PIN=A1

	; LVGL
	-D LV_CONF_PATH='"${PROJECT_DIR}/include/lv_conf.h"'
	-D USER_SETUP_LOADED=1

[env:attractap-lite-ethernet]
board = adafruit_qualia_s3_rgb666_no_uf2
platform = platformio/espressif32
framework = arduino

build_src_filter = +<*> -<display> -<ioexpander/>
board_build.sdkconfig_override = sdkconfig.defaults
board_build.partitions = partitions.csv

lib_deps =
	adafruit/Adafruit BusIO@^1.17.0
	adafruit/Adafruit NeoPixel@^1.15.0
	arduino-libraries/Arduino_CRC32@^1.0.0
	bblanchon/ArduinoJson@^7.4.2
	Adafruit FT6206 Library @ 1.1.0
	Adafruit CST8XX Library @ 1.1.1

build_flags =
	${env.build_flags}
	-D FIRMWARE_NAME='"attractap_lite"'
	-D HAS_WS2812_LED=1
	-D PIN_WS2812_DATA=38
	-D WS2812_LED_COUNT=24
	-D USE_CIRCULAR_LED_RING=1
	-D FIRMWARE_FRIENDLY_NAME='"Attractap Lite"'
	-D FIRMWARE_VARIANT='"ethernet"'
	-D FIRMWARE_VARIANT_FRIENDLY_NAME='"Ethernet"'

	-D LOG_LEVEL=INFO
	-D LOGGER_LEVEL_NUM=3

	-D PIN_PN532_IRQ=0
	-D PIN_NFC_I2C_SDA=48
	-D PIN_NFC_I2C_SCL=47

	-D PIN_ETH_SPI_CS=14
	-D PIN_W5500_INT=10
	-D PIN_W5500_RESET=9
	-D PIN_ETH_SPI_MOSI=11
	-D PIN_ETH_SPI_MISO=12
	-D PIN_ETH_SPI_SCK=13

	-D BEEPER_PIN=21
