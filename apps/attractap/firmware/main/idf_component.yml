dependencies:
  idf: ">=6.0.2"

  # UI (touch variants; dead-stripped from the headless lite build)
  lvgl/lvgl: "9.3.0"

  # JSON for the websocket API protocol (framework-agnostic despite the name)
  bblanchon/arduinojson: "^7.0.0"

  # Websocket client (managed component since IDF 5.x).
  # 1.6.0+ needs esp_transport_ws_get_redir_uri, which IDF v5.5.0's
  # tcp_transport does not have yet — 1.5.x is the newest that builds.
  espressif/esp_websocket_client: "~1.5.0"

  # ST7701 480x480 RGB panel (both display variants) + 3-wire SPI init transport
  espressif/esp_lcd_st7701: "^2.0.0"
  espressif/esp_lcd_panel_io_additions: "^1.0.1"

  # Qualia S3: XCA9554 IO expander (panel init SPI lines + backlight/reset).
  # Touch (FocalTech protocol) is a small first-party reader on the shared
  # i2c_master bus — see src/display/driver/qualia/.
  espressif/esp_io_expander_tca9554: "^2.0.0"

  # Attractap Lite: WS2812 LED ring (RMT backend)
  espressif/led_strip: "^3.0.0"

  # W5500 SPI Ethernet MAC (moved out of IDF core into the Component
  # Registry in IDF v6 and requires the v6 migration baseline).
  espressif/w5500: "^2.0.0"
