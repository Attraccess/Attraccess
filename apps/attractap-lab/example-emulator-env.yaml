# Reader plus the NFC card emulator mounted in front of it. Only for places
# that export NfcEmulatorSerial and NfcEmulatorFlash.
imports:
  - attractap_lab.drivers
targets:
  main:
    resources:
      RemotePlace:
        name: reader-1
    drivers:
      ESPToolDriver:
        bindings:
          device: USBFlashableDevice
      SerialDriver:
        bindings:
          port: USBSerialPort
      ScreenCaptureDriver: {}
      NfcEmulatorDriver:
        bindings:
          port: NfcEmulatorSerial
      NfcEmulatorFlashDriver:
        bindings:
          device: NfcEmulatorFlash
      # Presses the reader's power button through the emulator, for readers
      # that have one wired (Touch V1): labgrid-client power on/off/cycle/get.
      ReaderPowerDriver: {}
