# --place (or LG_PLACE) overrides the place name below.
# LG_COORDINATOR=lab-host:20408 selects the coordinator (default localhost).
imports:
  - attractap_lab.drivers
targets:
  main:
    resources:
      RemotePlace:
        name: reader-1
    drivers:
      ESPToolDriver: {}
      SerialDriver: {}
      # Captures the place's HTTPVideoStream as served. If that is the whole
      # camera frame, add crop: "width:height:x:y" in camera pixels.
      ScreenCaptureDriver: {}
