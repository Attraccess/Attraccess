# Local resources for HIL_LOCAL_ENV: a reader and its NFC emulator on this
# machine's USB, no labgrid coordinator. hil/conftest.py fills in the device paths
# from READER_SERIAL_PORT and EMULATOR_SERIAL_PORT. There is no camera and no
# emulator flash driver here: the emulator keeps the firmware it already runs.
imports:
  - attractap_lab.drivers
targets:
  main:
    resources:
      - RawSerialPort:
          name: reader-serial
          port: "@READER_SERIAL_PORT@"
          speed: 115200
      - RawSerialPort:
          name: emulator-serial
          port: "@EMULATOR_SERIAL_PORT@"
          speed: 115200
    drivers:
      SerialDriver:
        name: reader
        bindings:
          port: reader-serial
      NfcEmulatorDriver:
        bindings:
          port: emulator-serial
