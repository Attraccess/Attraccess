; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env]
monitor_speed = 115200
monitor_echo = true
monitor_filters = esp32_exception_decoder
build_type = debug
extra_scripts = 
    pre:tools/build_adaptive_certs_wrapper.py

[env:actual-board]
board = esp32-s3-devkitc-1-n16r8v
platform = platformio/espressif32 
framework = arduino

build_src_filter = +<*> -<disabled/> -<display/images/>

lib_deps = 
	adafruit/Adafruit BusIO@^1.17.0
	arduino-libraries/Arduino_CRC32@^1.0.0
	lvgl/lvgl@9.3.0
	bblanchon/ArduinoJson @ ^7.4.2

build_flags =
	-D FIRMWARE_NAME='"attractap_touch"'
	-D FIRMWARE_FRIENDLY_NAME='"Attractap Touch"'
	-D FIRMWARE_VERSION='"1.0.0"'
	-D FIRMWARE_VARIANT='"wifi"'
	-D FIRMWARE_VARIANT_FRIENDLY_NAME='"WiFi"'
	-D BOARD_FAMILY='"ESP32-S3"'

	-D PIN_PN532_IRQ=6

	-D PIN_ETH_SPI_CS=-1
	-D PIN_W5500_INT=-1
	-D PIN_W5500_RESET=-1
	-D PIN_ETH_SPI_MOSI=-1
	-D PIN_ETH_SPI_MISO=-1
	-D PIN_ETH_SPI_SCK=-1


    #-D CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
    #-D CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL=n
    #-D CONFIG_MBEDTLS_CUSTOM_CERTIFICATE_BUNDLE=y

	; LVGL
	-D LV_CONF_PATH='"${PROJECT_DIR}/include/lv_conf.h"'
	-D USER_SETUP_LOADED=1

[env:esp32-s3-devkitc-1]
board = esp32s3box
platform = platformio/espressif32
framework = arduino

board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio

board_build.partitions = default_16MB.csv

build_src_filter = +<*> -<disabled/> -<display/images/>

lib_deps = 
	adafruit/Adafruit BusIO@^1.17.0
	arduino-libraries/Arduino_CRC32@^1.0.0
	lvgl/lvgl@9.3.0
	bblanchon/ArduinoJson @ ^7.4.2

build_flags =
	-DBOARD_HAS_PSRAM
  	-DARDUINO_USB_CDC_ON_BOOT=1

	-D FIRMWARE_NAME='"attractap_touch"'
	-D FIRMWARE_FRIENDLY_NAME='"Attractap Touch"'
	-D FIRMWARE_VERSION='"1.0.0"'
	-D FIRMWARE_VARIANT='"wifi"'
	-D FIRMWARE_VARIANT_FRIENDLY_NAME='"WiFi"'
	-D BOARD_FAMILY='"ESP32-S3"'

	-D PIN_PN532_IRQ=0

	-D PIN_ETH_SPI_CS=-1
	-D PIN_W5500_INT=-1
	-D PIN_W5500_RESET=-1
	-D PIN_ETH_SPI_MOSI=-1
	-D PIN_ETH_SPI_MISO=-1
	-D PIN_ETH_SPI_SCK=-1

	; LVGL
	-D LV_CONF_PATH='"${PROJECT_DIR}/include/lv_conf.h"'
	-D USER_SETUP_LOADED=1
