; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env]
lib_compat_mode = strict
lib_ldf_mode = chain+

extra_scripts = 
    pre:tools/build_adaptive_certs_wrapper.py

monitor_speed = 115200
monitor_echo = true


[env:attractap_base]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

board_build.partitions = partitions/attractap.csv

lib_deps = 
	adafruit/Adafruit BusIO@^1.17.0
	arduino-libraries/Arduino_CRC32@^1.0.0
	bblanchon/ArduinoJson@^7.0.4
	fastled/FastLED@^3.9.16
	adafruit/Adafruit SSD1306@^2.5.14
	adafruit/Adafruit GFX Library@^1.12.1
	aki237/Adafruit_ESP32_SH1106@^1.0.2
	robtillaart/I2CKeyPad@^0.5.0
build_flags =
	-D FIRMWARE_NAME='"attractap"'
	-D FIRMWARE_FRIENDLY_NAME='"Attractap"'
	-D FIRMWARE_VERSION='"1.0.0"'

	-D I2C_FREQ=100000

	-D CONFIG_ATTRACTAP
	-D FIRMWARE_VARIANT='"base"'
	-D FIRMWARE_VARIANT_FRIENDLY_NAME='"Base"'

	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1

	-D HAS_I2C_KEYPAD
	-D I2C_KEYPAD_ADDRESS=0x20

	-D HAS_NETWORK_ETHERNET

	; SPI Pins
	-D PIN_ETH_SPI_SCK=4
	-D PIN_ETH_SPI_MISO=5
	-D PIN_ETH_SPI_MOSI=6

	; Chip Select Pins
	-D PIN_ETH_SPI_CS=3

	; W5500 Ethernet Pins (optional - set to -1 to disable)
	-D PIN_W5500_RESET=-1 ; Set to actual pin number if available
	-D PIN_W5500_INT=7    ; Use GPIO7 for interrupt (even if not physically connected)

	; I2C Pins
	-D PIN_I2C_SDA=8
	-D PIN_I2C_SCL=9

	; PN532 Pins
	-D PIN_PN532_IRQ=21
	-D PIN_PN532_RESET=21

	; Display configuration
	-D DISPLAY_OLED
	-D SCREEN_WIDTH=128
	-D SCREEN_HEIGHT=64
	-D SCREEN_RESET=21

	-D SCREEN_DRIVER_SH1106

	; LEDs
	-D PIN_LED=0
	-D LED_COUNT=5
	-D LED_MAX_BRIGHTNESS=150

[env:attractap_touch]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps = 
	adafruit/Adafruit BusIO@^1.17.0
	arduino-libraries/Arduino_CRC32@^1.0.0
	bblanchon/ArduinoJson@^7.0.4
	fastled/FastLED@^3.9.16
	bodmer/TFT_eSPI@2.5.43
	https://github.com/PaulStoffregen/XPT2046_Touchscreen


#board_build.partitions = partitions/attractap_touch.csv
build_src_filter = +<*> -<display/oled> -<keypad>
board_build.cmake_extra_args = -DCONFIG_SPIRAM_SUPPORT=0

build_flags =
	-D FIRMWARE_NAME='"attractap"'
	-D FIRMWARE_FRIENDLY_NAME='"Attractap"'
	-D FIRMWARE_VERSION='"1.0.0"'

	-D I2C_FREQ=100000

	-D CONFIG_ATTRACTAP_TOUCH
	-D FIRMWARE_VARIANT='"touch"'
	-D FIRMWARE_VARIANT_FRIENDLY_NAME='"Touch"'

	; SPI Pins
	-D PIN_ETH_SPI_SCK=18
	-D PIN_ETH_SPI_MISO=19
	-D PIN_ETH_SPI_MOSI=23

	; Chip Select Pins
	-D PIN_ETH_SPI_CS=5

	; W5500 Ethernet Pins (optional - set to -1 to disable)
	-D PIN_W5500_RESET=-1 ; Set to actual pin number if available
	-D PIN_W5500_INT=35   ; Use GPIO7 for interrupt (even if not physically connected)

	; I2C Pins
	-D PIN_I2C_SDA=22
	-D PIN_I2C_SCL=27

	; PN532 Pins
	-D PIN_PN532_IRQ=16
	-D PIN_PN532_RESET=17

	; LEDs
	-D PIN_LED=1
	-D LED_COUNT=5
	-D LED_MAX_BRIGHTNESS=150
