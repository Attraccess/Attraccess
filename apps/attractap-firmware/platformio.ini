; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env]
monitor_speed = 115200
monitor_echo = true
monitor_filters = esp32_exception_decoder
build_type = debug
extra_scripts = 
    pre:tools/build_adaptive_certs_wrapper.py
build_flags =
	-D FIRMWARE_VERSION='"1.2.0"'

[env:attractap-touch]
board = esp32-s3-devkitc-1-n16r8v
platform = platformio/espressif32 
framework = arduino

build_src_filter = +<*> -<disabled/> -<display/images/> -<display/driver/qualia/>
board_build.sdkconfig_override = sdkconfig.defaults

lib_deps = 
	adafruit/Adafruit BusIO@^1.17.0
	arduino-libraries/Arduino_CRC32@^1.0.0
	lvgl/lvgl@9.3.0
	bblanchon/ArduinoJson@^7.4.2

build_flags =
	${env.build_flags}
	-D FIRMWARE_NAME='"attractap_touch"'
	-D FIRMWARE_FRIENDLY_NAME='"Attractap Touch"'
	-D FIRMWARE_VARIANT='"wifi"'
	-D FIRMWARE_VARIANT_FRIENDLY_NAME='"WiFi"'

	-D LOG_LEVEL=DEBUG
	-D LOGGER_LEVEL_NUM=4

	-D PIN_PN532_IRQ=0

	-D PIN_ETH_SPI_CS=-1
	-D PIN_W5500_INT=-1
	-D PIN_W5500_RESET=-1
	-D PIN_ETH_SPI_MOSI=-1
	-D PIN_ETH_SPI_MISO=-1
	-D PIN_ETH_SPI_SCK=-1

	-D DISPLAY_DRIVER_GT911=1
	-D HAS_IO_EXPANDER_TCA9554=1

	; LVGL
	-D LV_CONF_PATH='"${PROJECT_DIR}/include/lv_conf.h"'
	-D USER_SETUP_LOADED=1

[env:attractap-touch-ethernet]
board = adafruit_qualia_s3_rgb666_no_uf2
platform = platformio/espressif32 
framework = arduino

build_src_filter = +<*> -<disabled/> -<display/images/> -<display/driver/gt911/> -<ioexpander/>
board_build.sdkconfig_override = sdkconfig.defaults
board_build.partitions = default_16MB.csv

lib_deps = 
	adafruit/Adafruit BusIO@^1.17.0
	arduino-libraries/Arduino_CRC32@^1.0.0
	lvgl/lvgl@9.3.0
	bblanchon/ArduinoJson@^7.4.2
	Adafruit FT6206 Library @ 1.1.0
	Adafruit CST8XX Library @ 1.1.1

build_flags =
	${env.build_flags}
	-D FIRMWARE_NAME='"attractap_touch"'
	-D FIRMWARE_FRIENDLY_NAME='"Attractap Touch"'
	-D FIRMWARE_VARIANT='"ethernet"'
	-D FIRMWARE_VARIANT_FRIENDLY_NAME='"Ethernet"'

	-D LOG_LEVEL=DEBUG
	-D LOGGER_LEVEL_NUM=4

	-D PIN_PN532_IRQ=0

	-D PIN_ETH_SPI_CS=15
	-D PIN_W5500_INT=A0
	-D PIN_W5500_RESET=-1
	-D PIN_ETH_SPI_MOSI=7
	-D PIN_ETH_SPI_MISO=6
	-D PIN_ETH_SPI_SCK=5

	-D DISPLAY_DRIVER_QUALIA=1
	-D BEEPER_PIN=A1

	; LVGL
	-D LV_CONF_PATH='"${PROJECT_DIR}/include/lv_conf.h"'
	-D USER_SETUP_LOADED=1
