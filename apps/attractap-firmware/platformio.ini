; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env]
monitor_speed = 115200
monitor_echo = true
monitor_filters = esp32_exception_decoder
build_type = debug
extra_scripts = 
    pre:tools/build_adaptive_certs_wrapper.py
build_flags =
	-D FIRMWARE_VERSION='"1.2.1"'

[env:attractap-touch]
board = esp32-s3-devkitc-1-n16r8v
platform = platformio/espressif32 
framework = arduino

build_src_filter = +<*> -<display/images/> -<display/driver/qualia/>
board_build.sdkconfig_override = sdkconfig.defaults

lib_deps = 
	adafruit/Adafruit BusIO@^1.17.0
	arduino-libraries/Arduino_CRC32@^1.0.0
	lvgl/lvgl@9.3.0
	bblanchon/ArduinoJson@^7.4.2

build_flags =
	${env.build_flags}
	-D FIRMWARE_NAME='"attractap_touch"'
	-D FIRMWARE_FRIENDLY_NAME='"Attractap Touch"'
	-D FIRMWARE_VARIANT='"wifi"'
	-D FIRMWARE_VARIANT_FRIENDLY_NAME='"WiFi"'

	-D LOG_LEVEL=DEBUG
	-D LOGGER_LEVEL_NUM=4

	-D PIN_PN532_IRQ=0
	-D PIN_I2C_SDA=15
	-D PIN_I2C_SCL=7

	-D PIN_ETH_SPI_CS=-1
	-D PIN_W5500_INT=-1
	-D PIN_W5500_RESET=-1
	-D PIN_ETH_SPI_MOSI=-1
	-D PIN_ETH_SPI_MISO=-1
	-D PIN_ETH_SPI_SCK=-1

	-D HAS_LVGL_DISPLAY=1

	-D DISPLAY_DRIVER_GT911=1
	-D HAS_IO_EXPANDER_TCA9554=1

	; LVGL
	-D LV_CONF_PATH='"${PROJECT_DIR}/include/lv_conf.h"'
	-D USER_SETUP_LOADED=1

[env:attractap-touch-ethernet]
board = adafruit_qualia_s3_rgb666_no_uf2
platform = platformio/espressif32 
framework = arduino

build_src_filter = +<*> -<display/images/> -<display/driver/gt911/> -<ioexpander/>
board_build.sdkconfig_override = sdkconfig.defaults
board_build.partitions = default_16MB.csv

lib_deps = 
	adafruit/Adafruit BusIO@^1.17.0
	arduino-libraries/Arduino_CRC32@^1.0.0
	lvgl/lvgl@9.3.0
	bblanchon/ArduinoJson@^7.4.2
	Adafruit FT6206 Library @ 1.1.0
	Adafruit CST8XX Library @ 1.1.1

build_flags =
	${env.build_flags}
	-D FIRMWARE_NAME='"attractap_touch"'
	-D FIRMWARE_FRIENDLY_NAME='"Attractap Touch"'
	-D FIRMWARE_VARIANT='"ethernet"'
	-D FIRMWARE_VARIANT_FRIENDLY_NAME='"Ethernet"'

	-D LOG_LEVEL=DEBUG
	-D LOGGER_LEVEL_NUM=4

	-D PIN_PN532_IRQ=0

	-D PIN_ETH_SPI_CS=15
	-D PIN_W5500_INT=A0
	-D PIN_W5500_RESET=-1
	-D PIN_ETH_SPI_MOSI=7
	-D PIN_ETH_SPI_MISO=6
	-D PIN_ETH_SPI_SCK=5

	-D HAS_LVGL_DISPLAY=1

	-D DISPLAY_DRIVER_QUALIA=1
	-D BEEPER_PIN=A1

	; LVGL
	-D LV_CONF_PATH='"${PROJECT_DIR}/include/lv_conf.h"'
	-D USER_SETUP_LOADED=1

[env:attractap-lite-ethernet]
board = adafruit_qualia_s3_rgb666_no_uf2
platform = platformio/espressif32 
framework = arduino

build_src_filter = +<*> -<display> -<ioexpander/>
board_build.sdkconfig_override = sdkconfig.defaults
board_build.partitions = default_16MB.csv

lib_deps = 
	adafruit/Adafruit BusIO@^1.17.0
	arduino-libraries/Arduino_CRC32@^1.0.0
	bblanchon/ArduinoJson@^7.4.2
	Adafruit FT6206 Library @ 1.1.0
	Adafruit CST8XX Library @ 1.1.1

build_flags =
	${env.build_flags}
	-D FIRMWARE_NAME='"attractap_lite"'
	-D FIRMWARE_FRIENDLY_NAME='"Attractap Lite"'
	-D FIRMWARE_VARIANT='"ethernet"'
	-D FIRMWARE_VARIANT_FRIENDLY_NAME='"Ethernet"'

	-D LOG_LEVEL=DEBUG
	-D LOGGER_LEVEL_NUM=4

	-D PIN_PN532_IRQ=0
	-D PIN_I2C_SDA=48
	-D PIN_I2C_SCL=47

	-D PIN_ETH_SPI_CS=14
	-D PIN_W5500_INT=10
	-D PIN_W5500_RESET=9
	-D PIN_ETH_SPI_MOSI=11
	-D PIN_ETH_SPI_MISO=12
	-D PIN_ETH_SPI_SCK=13

	-D BEEPER_PIN=21

; ESP32-P4 + C6: Guition JC1060P470 7" 1024x600 DSI touchscreen (full app + WiFi via ESP-Hosted)
; Ref: https://www.reddit.com/r/homeassistant/s/7yXRVO9815
[env:attractap-p4]
board = esp32-p4
platform = https://github.com/pioarduino/platform-espressif32.git#c28413a
framework = arduino

build_src_filter = +<*> -<main_p4.cpp> -<display/images/> -<display/driver/qualia/> -<display/driver/gt911/> -<display/display_p4.cpp> -<ioexpander/> -<nfc/nfc.cpp> -<nfc/mbedtlscmac.c> -<nfc/Adafruit_PN532_NTAG424.cpp> -<network/ethernet/> -<websocket/websocket.cpp>
board_build.sdkconfig_override = sdkconfig.defaults
board_build.partitions = default_16MB.csv
extra_scripts = pre:tools/patch_esp32p4_toolchain.py

lib_deps =
	adafruit/Adafruit BusIO@^1.17.0
	lvgl/lvgl@9.3.0
	bblanchon/ArduinoJson@^7.4.2
	arduino-libraries/Arduino_CRC32@^1.0.0

build_flags =
	${env.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-D ATTACTAP_P4_FULL_APP=1
	-D FIRMWARE_NAME='"attractap_p4"'
	-D FIRMWARE_FRIENDLY_NAME='"Attractap P4"'
	-D FIRMWARE_VARIANT='"wifi"'
	-D FIRMWARE_VARIANT_FRIENDLY_NAME='"WiFi"'
	-D PIN_ETH_SPI_CS=-1
	-D PIN_W5500_INT=-1
	-D PIN_W5500_RESET=-1
	-D PIN_ETH_SPI_MOSI=-1
	-D PIN_ETH_SPI_MISO=-1
	-D PIN_ETH_SPI_SCK=-1
	-D LOG_LEVEL=DEBUG
	-D LOGGER_LEVEL_NUM=4
	-D PIN_I2C_SDA=7
	-D PIN_I2C_SCL=8
	-D HAS_LVGL_DISPLAY=1
	-D CONFIG_IDF_TARGET_ESP32P4=1
	-D DISPLAY_DRIVER_P4_DSI=1
	-D P4_PANEL_JC1060P470=1
	-D P4_LCD_BL_ACTIVE_HIGH=1
	-D LV_CONF_PATH='"${PROJECT_DIR}/include/lv_conf.h"'
	-D USER_SETUP_LOADED=1
